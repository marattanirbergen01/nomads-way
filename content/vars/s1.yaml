  bai_enemy:      { toast: { kk: "Құдайберген мұны ұмытпайды", ru: "Кудайберген этого не забудет" }, icon: icon_flag_memory }
  wrote_laws:     { toast: { kk: "Заң жазылды",                ru: "Закон записан" },               icon: icon_flag_memory }
