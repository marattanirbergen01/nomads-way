# Переменные сюжета сезона 1 — подписи для всплывающих уведомлений после выбора
# («+1 Батылдық» вверху экрана, как «+1 Кровавая Луна» в референсе Марата).
# Предложение — docs/DECISIONS.md, 2026-10-21. Пока «Код» не сделал показ, файл ничего не меняет.
#
# trait  — черта аватара, копится за сезон: тост «+N <название>».
# flag   — факт выбора: тост показывается, только если задан `toast` (последствие «это запомнят»).
#          Флаги без `toast` — скрытые, игроку не показываются.
# icon   — id из media/manifest.yaml (kind icon), кадры делает окно «Медиа».

traits:
  courage:    { kk: Батылдық,     ru: Смелость,        icon: icon_trait_courage }
  loyalty:    { kk: Адалдық,      ru: Верность,        icon: icon_trait_loyalty }
  justice:    { kk: Әділдік,      ru: Справедливость,  icon: icon_trait_justice }
  caution:    { kk: Сақтық,       ru: Осторожность,    icon: icon_trait_caution }
  practical:  { kk: Пысықтық,     ru: Смекалка,        icon: icon_trait_practical }
  vigilant:   { kk: Байқағыш,     ru: Наблюдательность, icon: icon_trait_vigilant }
  memory:     { kk: Даналық,      ru: Мудрость,        icon: icon_trait_memory }

flags:
