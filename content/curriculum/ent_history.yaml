# Дерево тем программы по истории Казахстана — раздел «Казахское ханство».
# Источник структуры: ent_spec_history (ЗАПОЛНИТЬ точную нумерацию разделов по официальной спецификации).
# must_know — проверяемые факты: год, место, имя, причина. Из них растут вопросы.
# Формулировки сверять с учебником (textbook_7): на ЕНТ спрашивают так, как написано там.

- id: kz.4
  title: { kk: "Қазақ хандығы", ru: "Казахское ханство", en: "The Kazakh Khanate" }
  children:

    - id: kz.4.1
      title: { kk: "Қазақ хандығының құрылуы", ru: "Образование Казахского ханства", en: "Founding of the Kazakh Khanate" }
      status: in_progress          # покрывается серией s1e01
      must_know:
        - id: f.4.1.a
          kk: "1465 жыл — Қазақ хандығының құрылған жылы"
          ru: "1465 год — год образования Казахского ханства"
          source: dulati_tarikh_i_rashidi
          note: "Дулати даёт 870 г. хиджры = 1465–1466. В учебниках и на ЕНТ — 1465. 550-летие отмечалось в 2015 г."
        - id: f.4.1.b
          kk: "Керей мен Жәнібек — хандықтың негізін қалаушылар, Орыс хан ұрпағы"
          ru: "Керей и Жанибек — основатели ханства, султаны из рода Урус-хана (потомки Жошы)"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.c
          kk: "Шу мен Қозыбасы алқабы (Батыс Жетісу) — көш орналасқан жер"
          ru: "Долины Шу и Козыбасы (Западное Жетысу) — место, где обосновалось кочевье"
          source: dulati_tarikh_i_rashidi
        - id: f.4.1.d
          kk: "Есен-Бұға — сұлтандарды қабылдап, жер берген Моғолстан ханы"
          ru: "Есен-Буга — хан Могулистана, принявший султанов и выделивший им земли"
          source: dulati_tarikh_i_rashidi
          note: "Мотив: нужны союзники против Абулхайра и щит на западной границе; конфликт с братом Жунусом."
        - id: f.4.1.e
          kk: "Керей мен Жәнібек Әбілқайыр хандығынан (Көшпелі өзбектер мемлекеті) бөлініп кетті"
          ru: "Керей и Жанибек откочевали от Абулхайр-хана (ханство Абулхайра / Государство кочевых узбеков)"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.f
          kk: "1457 жыл — Әбілқайырдың Сығанақ түбінде ойраттардан жеңілуі, көшудің себептерінің бірі"
          ru: "1457 год — поражение Абулхайра от ойратов под Сыгнаком, одна из причин откочёвки"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.g
          kk: "1468 жыл — Әбілқайырдың Керей мен Жәнібекке қарсы жорықта қаза табуы"
          ru: "1468 год — смерть Абулхайра во время похода против Керея и Жанибека"
          source: qazaqstan_tarihy_v2
          note: "После его смерти государство распалось, роды массово перешли к казахским ханам."
        - id: f.4.1.h
          kk: "«Тарих-и Рашиди» (Мұхаммед Хайдар Дулати) — хандықтың құрылуы туралы негізгі жазба дерек"
          ru: "«Тарих-и Рашиди» Мухаммада Хайдара Дулати — основной письменный источник об образовании ханства"
          source: dulati_tarikh_i_rashidi
        - id: f.4.1.i
          kk: "«Қазақ» сөзі — «ерікті, бөлініп шыққан адам»; кеткендерді әуелі өзбек-қазақ деп атады"
          ru: "«Казак» — «вольный, отделившийся человек»; откочевавших сначала называли узбек-казаками, затем казаками"
          source: qazaqstan_tarihy_v2

    - id: kz.4.2
      title: { kk: "Хандықтың нығаюы: Бұрындық және Қасым хан", ru: "Укрепление ханства: Бурундук и Касым-хан", en: "Consolidation: Burunduk and Kasym Khan" }
      status: planned              # серии s1e02–s1e04
      must_know:
        - id: f.4.2.a
          kk: "Бұрындық хан — Керейдің ұлы, 1480–1511 жж. билік құрды"
          ru: "Бурундук-хан — сын Керея, правил в 1480–1511 гг."
          source: qazaqstan_tarihy_v2
        - id: f.4.2.b
          kk: "Қасым хан — Жәнібектің ұлы, 1511–1521 жж.; хандықтың күшеюі"
          ru: "Касым-хан — сын Жанибека, правил в 1511–1521 гг.; период наивысшего усиления ханства"
          source: qazaqstan_tarihy_v2
        - id: f.4.2.c
          kk: "«Қасым ханның қасқа жолы» — Қасым хан тұсындағы заңдар жинағы"
          ru: "«Касым ханнын каска жолы» («Столбовая дорога Касым-хана») — свод законов при Касым-хане"
          source: textbook_7
        - id: f.4.2.d
          kk: "Қасым хан тұсында халық саны шамамен 1 миллионға жетті"
          ru: "При Касым-хане численность населения ханства достигла около 1 миллиона человек"
          source: textbook_7
        - id: f.4.2.e
          kk: "Қасым хан тұсында қазақтар туралы алғашқы деректер орыс жазбаларында пайда болды"
          ru: "При Касым-хане казахи впервые упоминаются в русских письменных источниках"
          source: textbook_7
