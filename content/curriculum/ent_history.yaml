# Дерево тем программы по истории Казахстана. Корневой узел = сезон (план v2: 12 сезонов, 95 серий,
# см. docs/DECISIONS.md 2026-10-13). kz.4 — сезон 1 «Қазақ хандығы» (id сохранён: на него ссылаются
# факты и серия s1e01), kz.s2 … kz.s12 — сезоны 2–12. Порядок узлов в файле = порядок сезонов на «Жол».
# Источник структуры: ent_spec_history — спецификация НЦТ «для использования с 2026 года»
# (7 разделов, 55 тем; копия в sources/ent_spec_history_2026.pdf).
# Поле spec у узла — раздел и темы спецификации, на которые узел работает.
# Разделы 06 «Развитие культуры» (темы 48–52) и 07 «Контекстные задания» (53 документы,
# 54 лица, 55 карты и схемы) идут поперёк периодов: их закрываем внутри серий, а не отдельной веткой.
# must_know — проверяемые факты: год, место, имя, причина. Из них растут вопросы.
# Формулировки, даты и имена сверять со школьными учебниками (sources/registry.yaml: tb05_* … tb11_*;
# какие параграфы к какой серии — reference/textbooks/season<N>.md): на ЕНТ спрашивают так, как написано там.

- id: kz.4
  title: { kk: "Қазақ хандығы", ru: "Казахское ханство" }
  era: "1457–1598"
  spec:
    sections: ["02 — Период средневековья", "06 — Развитие культуры"]
    topics: [10, 11, 12, 13, 14, 50]
    note: "Есим и Жангир (темы 15–16) — сезон 2. XVIII век ханства спецификация уводит в раздел 03 «Новое время»: Тауке — тема 17, устройство и хозяйство — 18, джунгарские войны — 19, Аблай — 21."
  # Объявленный план серий периода. Материала ещё нет — клиент рисует их закрытыми.
  # Как только появится content/episodes/s1/e02_*.yaml с тем же id, строка станет живой.
  planned_series:
    - { id: s1e02, number: 2, era: "1468–1511", title: { kk: "Бұрындық хан", ru: "Бурундук-хан" } }
    - { id: s1e03, number: 3, era: "1511–1518", title: { kk: "Қасым хан", ru: "Касым-хан" } }
    - { id: s1e04, number: 4, era: "1538–1580", title: { kk: "Хақназар хан", ru: "Хакназар-хан" } }
    - { id: s1e05, number: 5, era: "1582–1598", title: { kk: "Тәуекел хан", ru: "Тауекел-хан" } }
  children:

    - id: kz.4.1
      title: { kk: "Қазақ хандығының құрылуы", ru: "Образование Казахского ханства" }
      status: in_progress          # покрывается серией s1e01
      spec:
        section: "02 — Период средневековья"
        topics: [10, 11]
        topic_titles:
          - "10. Формирование казахского народа. Казахи — наследники Великой степи: историческая и этническая преемственность. Этноним «казах». Окончательное становление казахского народа"
          - "11. Образование единого Казахского государства. Предпосылки образования национального государства казахов. Образование казахского ханства (территория, этнический состав населения). Основатели государства — Жанибек и Керей. Внутренняя и внешняя политика Казахского ханства в первые годы становления. Историческое значение образования единого казахского государства"
        background: "Тема 08 — Могулистан (Есен-Буга), тема 09 — Ханство Абулхаира: в спецификации это предыдущий материал, у нас он звучит фоном в s1e01."
      must_know:
        - id: f.4.1.a
          kk: "1465 жыл — Қазақ хандығының құрылған жылы"
          ru: "1465 год — год образования Казахского ханства"
          source: dulati_tarikh_i_rashidi
          note: "Дулати даёт 870 г. хиджры = 1465–1466. В учебниках и на ЕНТ — 1465. 550-летие отмечалось в 2015 г."
        - id: f.4.1.b
          kk: "Керей мен Жәнібек — хандықтың негізін қалаушылар, Орыс хан ұрпағы"
          ru: "Керей и Жанибек — основатели ханства, султаны из рода Урус-хана (потомки Жошы)"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.c
          kk: "Шу мен Қозыбасы алқабы (Батыс Жетісу) — көш орналасқан жер"
          ru: "Долины Шу и Козыбасы (Западное Жетысу) — место, где обосновалось кочевье"
          source: dulati_tarikh_i_rashidi
        - id: f.4.1.d
          kk: "Есенбұға — сұлтандарды қабылдап, жер берген Моғолстан ханы"
          ru: "Есен-Буга — хан Могулистана, принявший султанов и выделивший им земли"
          source: dulati_tarikh_i_rashidi
          note: "Мотив: нужны союзники против Абулхаира и щит на западной границе; конфликт с братом Жунусом."
        - id: f.4.1.e
          kk: "Керей мен Жәнібек Әбілқайыр хандығынан (Көшпелі өзбектер мемлекеті) бөлініп кетті"
          ru: "Керей и Жанибек откочевали от Абулхаир-хана (ханство Абулхаира / Государство кочевых узбеков)"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.f
          kk: "1457 жыл — Әбілқайырдың Сығанақ түбінде ойраттардан жеңілуі, көшудің себептерінің бірі"
          ru: "1457 год — поражение Абулхаира от ойратов под Сыгнаком, одна из причин откочёвки"
          source: qazaqstan_tarihy_v2
        - id: f.4.1.g
          kk: "1468 жыл — Әбілқайырдың Керей мен Жәнібекке қарсы жорықта қаза табуы"
          ru: "1468 год — смерть Абулхаира во время похода против Керея и Жанибека"
          source: qazaqstan_tarihy_v2
          note: "После его смерти государство распалось, роды массово перешли к казахским ханам."
        - id: f.4.1.h
          kk: "«Тарих-и Рашиди» (Мұхаммед Хайдар Дулати) — хандықтың құрылуы туралы негізгі жазба дерек"
          ru: "«Тарих-и Рашиди» Мухаммада Хайдара Дулати — основной письменный источник об образовании ханства"
          source: dulati_tarikh_i_rashidi
        - id: f.4.1.i
          kk: "«Қазақ» сөзі — «ерікті, бөлініп шыққан адам»; кеткендерді әуелі өзбек-қазақ деп атады"
          ru: "«Казах» — «вольный, отделившийся человек»; откочевавших сначала называли узбек-казахами, затем казахами"
          source: qazaqstan_tarihy_v2

        - id: f.4.1.j
          kk: "Дулатидің дерегі бойынша, Керей мен Жәнібекке қосылғандардың саны 200 мыңға жетті"
          ru: "По данным Дулати, число присоединившихся к Керею и Жанибеку достигло 200 тысяч человек"
          source: dulati_tarikh_i_rashidi
          note: "Цифра приводится в учебниках со ссылкой на «Тарих-и Рашиди». ЗАПОЛНИТЬ точный локатор при вычитке историком. Не путать с 1 млн при Касым-хане (f.4.2.d)."

    - id: kz.4.2
      title: { kk: "Хандықтың нығаюы: Бұрындық және Қасым хан", ru: "Укрепление ханства: Бурундук и Касым-хан" }
      status: planned              # серии s1e02–s1e04
      spec:
        section: "02 — Период средневековья"
        topics: [12, 13]
        note: "Отдельной темы про Бурундук-хана в спецификации нет — он внутри тем 11 и 12. Касым — тема 12, Хакназар — тема 13."
      must_know:
        - id: f.4.2.a
          kk: "Бұрындық хан — Керейдің ұлы, 1480–1511 жж. билік құрды"
          ru: "Бурундук-хан — сын Керея, правил в 1480–1511 гг."
          source: qazaqstan_tarihy_v2
          note: "Учебники расходятся: tb10 §36 с.141 — 1480–1511; tb06 §42 с.168 — «около 1474–1511». Опираемся на 1480–1511, «1474» в вопросах не используем."
        - id: f.4.2.b
          kk: "Қасым хан — Жәнібектің ұлы, 1511–1518 жж.; хандықтың күшеюі"
          ru: "Касым-хан — сын Жанибека, правил в 1511–1518 гг.; период наивысшего усиления ханства"
          source: tb06_ru
          note: "tb06 §43 с.170–173: 1511–1518, умер в 1518 г. в Сарайчике (по Мухаммаду Хайдару); в школьных тестах тоже 1518 (сын Мамаш на троне с 1518). tb10 §36 с.142 даёт «1511–1518/23», академическая литература (Qalam) — зима 1520–1521. Для ЕНТ — 1518."
        - id: f.4.2.c
          kk: "«Қасым ханның қасқа жолы» — Қасым хан тұсындағы заңдар жинағы"
          ru: "«Касым ханнын каска жолы» («Светлый путь хана Касыма») — свод законов при Касым-хане"
          source: tb06_ru
          note: "tb06 §43 с.171–173: пять разделов — имущественный, уголовный, военный закон, посольский обычай, закон общественности. tb11 ч.2 §25–26 с.15: первый свод законов казахов на основе обычаев и суда биев."
        - id: f.4.2.d
          kk: "Қасым хан тұсында халық саны шамамен 1 миллионға жетті"
          ru: "При Касым-хане численность населения ханства достигла около 1 миллиона человек"
          source: tb06_ru
          note: "tb06 §43 с.171 (по Мухаммаду Хайдару): подданных более 1 млн, войско до 300 тыс. В tb11 ч.2 с.14 — «около 160 тыс. отборных воинов»: численность войска в вопросах не спрашивать."
        - id: f.4.2.e
          kk: "Қасым хан тұсында Қазақ хандығы мен Мәскеу мемлекеті арасында алғашқы байланыстар орнады; қазақтар Батыс Еуропаға алғаш рет белгілі болды"
          ru: "При Касым-хане установлены первые контакты Казахского ханства с Московским государством; казахи впервые стали известны в Западной Европе"
          source: tb06_ru
          note: "Формулировка по tb06 §43 с.171 (kk с.172): сведения о казахах — в записках немецкого дипломата первой половины XVI в. Прежняя формулировка «впервые в русских письменных источниках» в учебнике не встречается."
        - id: f.4.2.f
          kk: "1510 ж. Сығанақ түбінде Қасым сұлтан Мұхаммед Шайбаниді жеңді"
          ru: "В 1510 г. под Сыгнаком султан Касым разбил Мухаммеда Шайбани"
          source: tb06_ru
          note: "tb06_ru#§42,с.168."
        - id: f.4.2.g
          kk: "Мұхаммед Шайбани Мәуереннахрға кетіп, 1500 ж. Самарқанд пен Бұхараны Әмір Темір ұрпақтарынан алды"
          ru: "Мухаммед Шайбани ушёл в Мавераннахр и в 1500 г. отнял Самарканд и Бухару у Тимуридов"
          source: tb06_ru
          note: "tb06_ru#§42,с.169; tb10_ru#§36,с.141."
        - id: f.4.2.h
          kk: "Сайрам Қасым ханға соғыссыз берілді"
          ru: "Сайрам сдался Касым-хану без боя"
          source: tb06_ru
          note: "tb06_ru#§43,с.170 (год не спрашиваем). Год не спрашиваем: в tb06 ru — 1518, в tb06 kk и школьных тестах — 1513 (reference/textbooks/season1.md, «Расхождения»)."
        - id: f.4.2.i
          kk: "«Қасым ханның қасқа жолы» бес бөлімнен тұрады: мүліктік, қылмыстық, әскери заң, елшілік жоралары, жұртшылық заңы"
          ru: "«Светлый путь хана Касыма» — пять разделов: имущественный, уголовный, военный закон, посольский обычай, закон общественности"
          source: tb06_ru
          note: "tb06_ru#§43,с.171–173."
        - id: f.4.2.j
          kk: "Қасым хан 1518 ж. Сарайшықта қайтыс болып, сонда жерленді"
          ru: "Касым-хан умер в 1518 г. в Сарайчике и там похоронен"
          source: tb06_ru
          note: "tb06_ru#§43,с.173."
        - id: f.4.2.k
          kk: "Қасым ханнан бастап хан билігі Жәнібек ұрпақтарының қолында болды"
          ru: "С Касыма верховная власть осталась у потомков Жанибека"
          source: tb06_ru
          note: "tb06_ru#§43,с.170."
        - id: f.4.2.l
          kk: "XV ғ. соңы – XVI ғ. басында сыртқы саясаттың басты міндеті — Сырдария бойына билік орнату; Сығанақ — сауда айлағы"
          ru: "Главная задача внешней политики конца XV – начала XVI в. — утвердиться на Сырдарье; Сыгнак — торговая гавань"
          source: tb06_ru
          note: "tb06_ru#§42,с.167. «Сауда айлағы / торговая гавань» — формулировка школьных тестов; Сыгнак как ставка ханов Ак Орды — tb06 §30."
        - id: f.4.2.n
          kk: "Қасым хан ноғайларды ығыстырды: шекара батыста Жайықтан асып, солтүстік-шығыста Ертіске жетті"
          ru: "Касым-хан потеснил ногаев: граница на западе ушла за Урал, на северо-востоке дошла до Иртыша"
          source: tb06_ru
          note: "tb06_ru#§43,с.170–171."

    - id: kz.4.3
      title: { kk: "Хақназар хан: хандықтың қайта бірігуі", ru: "Хакназар-хан: восстановление единства ханства" }
      status: planned              # серия s1e04 (черновик в студии)
      spec:
        section: "02 — Период средневековья"
        topics: [13]
      must_know:
        - id: f.4.3.a
          kk: "Хақназар — Қасым ханның ұлы, 1538–1580 жж. билік құрды"
          ru: "Хакназар — сын Касым-хана, правил в 1538–1580 гг."
          source: tb06_ru
          note: "tb06_ru#§44,с.175."
        - id: f.4.3.b
          kk: "Қасым ханнан кейін Мамаш (1522 ж. қаза тапты), Тахир, Бұйдаш — алауыздық кезең"
          ru: "После Касыма — Мамаш (погиб в 1522 г.), Тахир, Буйдаш: смутное время"
          source: tb06_ru
          note: "tb06_ru#§44,с.174–175."
        - id: f.4.3.c
          kk: "Хақназар «қазақтар мен ноғайлардың ханы», «қазақ пен қырғыздың ханы» атанды"
          ru: "Хакназара называли «ханом казахов и ногаев», «ханом казахским и кыргызским»"
          source: tb06_ru
          note: "tb06_ru#§44,с.176."
        - id: f.4.3.d
          kk: "Хақназар 60–70 жж. ноғайларға жорық жасап, Солтүстік Арал маңы мен Жайықты қосты"
          ru: "В 60–70-е гг. Хакназар ходил на ногаев и закрепил Северное Приаралье и берега Урала (Яика)"
          source: tb06_ru
          note: "tb06_ru#§44,с.176."
        - id: f.4.3.e
          kk: "Хақназар Бұхар ханы Абдаллахпен Баба сұлтанға қарсы ант-одақ жасап, Түркістан мен Сауранды алды"
          ru: "Хакназар заключил с бухарским ханом Абдаллахом клятвенный союз против Баба-султана и взял Туркестан и Сауран"
          source: tb06_ru
          note: "tb06_ru#§44,с.176."
        - id: f.4.3.f
          kk: "Хақназар Иван Грозныймен елшілік байланыс орнатты"
          ru: "Хакназар установил посольские связи с Иваном Грозным"
          source: tb06_ru
          note: "tb06_ru#§44,с.177."
        - id: f.4.3.g
          kk: "Хақназар 1580 ж. Баба сұлтанмен күресте қаза тапты"
          ru: "Хакназар погиб в 1580 г. в борьбе с Баба-султаном"
          source: tb06_ru
          note: "tb06_ru#§44,с.176."
        - id: f.4.3.h
          kk: "Тахир хан — ойраттармен алғаш соғысқан қазақ ханы; халық одан бөлініп кетті"
          ru: "Тахир — первый казахский хан, воевавший с ойратами; народ от него отделился"
          source: tb06_ru
          note: "tb06_ru#§44,с.175."
        - id: f.4.3.j
          kk: "Ұлыс жүйесінің жүз жүйесіне ауысуы Хақназардың есімімен байланыстырылады"
          ru: "С именем Хакназара связывают замену улусной системы жузовой"
          source: tb10_ru
          note: "tb10_ru#§36,с.143. tb10 говорит «связывают». По академическим работам (Qalam) жузы сложились позже, в 1630–1670-е: формулировку «Хакназар создал жузы» не использовать."

    - id: kz.4.4
      title: { kk: "Тәуекел хан: Сыр бойы үшін күрес", ru: "Тауекел-хан: борьба за Присырдарье" }
      status: planned              # серия s1e05 (черновик в студии)
      spec:
        section: "02 — Период средневековья"
        topics: [14]
      must_know:
        - id: f.4.4.i
          kk: "1580 ж. Жәнібектің немересі Шығай хан болып сайланды"
          ru: "В 1580 г. ханом избран внук Жанибека Шигай"
          source: tb06_ru
          note: "tb06_ru#§45,с.178."
        - id: f.4.4.a
          kk: "Тәуекел 1582 ж. Баба сұлтанды жеңіп, өлтірді"
          ru: "Тауекел в 1582 г. разбил и убил Баба-султана"
          source: tb06_ru
          note: "tb06_ru#§45,с.178."
        - id: f.4.4.j
          kk: "Тәуекел Абдаллахтан кетті: дербес билеуші болу үшін; Бұхара одақтас болудан қалып, Сыр қалалары үшін бәсекелеске айналды"
          ru: "Тауекел ушёл от Абдаллаха: чтобы стать независимым правителем; Бухара из союзника стала соперником за сырдарьинские города"
          source: tb06_ru
          note: "tb06_ru#§45,с.178–179. Год ухода не спрашиваем: в учебниках 1583 и 1588."
        - id: f.4.4.g
          kk: "Тәуекелдің қарсыластары — Бұхар ханы Абдаллах және Сібір ханы Көшім"
          ru: "Противники Тауекела — бухарский хан Абдаллах и сибирский хан Кучум"
          source: tb06_ru
          note: "tb06_ru#§45,с.179. Союз Абдаллаха с Кучумом против Тауекела — в школьных тестах; в tb06 оба названы противниками."
        - id: f.4.4.h
          kk: "Тәуекел ұлын қарақалпақ руларына, інісін қалмақтарға билеуші етіп қойды"
          ru: "Тауекел поставил сына править каракалпакскими родами, брата — калмаками"
          source: tb06_ru
          note: "tb06_ru#§45,с.179."
        - id: f.4.4.b
          kk: "1594 ж. Тәуекел Мәскеуге елші жіберді: Ораз-Мұхаммедті босату, әскери одақ, «от қару»"
          ru: "В 1594 г. Тауекел отправил посольство в Москву: освободить Ораз-Мухаммеда, военный союз, «огненный бой»"
          source: tb06_ru
          note: "tb06_ru#§45,с.179."
        - id: f.4.4.c
          kk: "Мәскеу «от қару» беруге дайын болды, бірақ одаққа уәде бермеді"
          ru: "Москва готова была дать «огненный бой», но союза не обещала"
          source: tb06_ru
          note: "tb06_ru#§45,с.179."
        - id: f.4.4.d
          kk: "1597–1598 жж. Ташкент пен Самарқанд арасында бұхар әскері жеңілді"
          ru: "В 1597–1598 гг. бухарское войско разбито между Ташкентом и Самаркандом"
          source: tb06_ru
          note: "tb06_ru#§45,с.179."
        - id: f.4.4.e
          kk: "Тәуекел Бұхара түбінде ауыр жараланып, 1598 ж. қайтыс болды"
          ru: "Тауекел тяжело ранен под Бухарой и умер в 1598 г."
          source: tb06_ru
          note: "tb06_ru#§45,с.180."
        - id: f.4.4.f
          kk: "Есім ханның бітімі: Ташкент, Сайрам, Түркістан қазақтарда қалды, Самарқанд қайтарылды"
          ru: "Мир Есим-хана: Ташкент, Сайрам, Туркестан остались за казахами, Самарканд возвращён"
          source: tb06_ru
          note: "tb06_ru#§45,с.180."
        - id: f.4.4.k
          kk: "Қадырғали Жалайыри — «Жылнамалар жинағы» авторы, XVII ғ. басындағы тарихшы"
          ru: "Кадыргали Жалаири — автор «Джами ат-таварих» («Сборника летописей»), историк начала XVII в."
          source: tb06_ru
          note: "tb06_ru#§44,с.177. Название сочинения — по глоссарию: kk «Жылнамалар жинағы», ru «Джами ат-таварих» («Сборник летописей»). В tb06 Кадыргали назван историком начала XVII в."

