- id: ba27f077
  stem:
    ru: 'В условиях кочевого образа жизни получили развитие устное народное творчество, жырауская традиция, музыкальное искусство. Борьба казахов против джунгарских захватчиков, национально-освободительное движение жителей степи против колониальной политики царского правительства стали основной темой акынов и жырау того времени. В истории казахской литературы особое место занимают выдающиеся акыны и жырау XVIII века. Одним из выдающихся казахских жырау является Актамберды-жырау Сарыулы. Он участвовал во многих походах против джунгар и был также известен как батыр. В 50-х годах XVIII века он предлагал казахам вернуться на земли, освобождённые от джунгар. Всё творчество Актамберды-жырау посвящено призыву народа к героизму, мужеству и смелости. Его мавзолей до сих пор сохранился у подножия холма Журекжота на территории Восточно-Казахстанской области. Используя текст и исторические знания, определите выдающегося казахского жырау, жившего в XVIII веке:'
