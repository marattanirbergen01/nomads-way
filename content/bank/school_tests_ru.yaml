    ru: 'Отрывок из текста: «Об ранних кочевниках — саках, скифах (древнеперсидское — сака, древнекитайское — сэ) и сарматах, а также о племенах восточной части Великой степи можно узнать не только по археологическим данным, но и из многочисленных письменных источников. Древнеперсидские письмена конца VI века до н. э. — самый ранний источник о времени саков. На древнеперсидских рельефах изображены и саки. В бехистунских надписях персидского царя... описан его поход в Центральную Азию против саков-тиграхауда («носящих остроконечные колпаки»). На территории Казахстана найдены сотни сакских курганов. Самые древние из них относятся к VIII веку до н. э. Диаметр крупных курганов достигал 100 м, а высота — 17 м...» Используя текст, определите самый ранний источник о времени саков, написанный в конце VI века до н. э.:'
