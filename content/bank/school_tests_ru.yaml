- id: cқазақ-27
  text:
    ru: 'Основными направлениями внешней политики в конце XVI века были борьба за города по Сырдарье и борьба с сибирским ханом Кучумом. Благодаря военным походам и умелой дипломатии он расширил территорию казахских земель. Одного из своих сыновей он поставил правителем каракалпакских родов, а младшего брата — правителем калмыков. В предстоящей борьбе с бухарским ханом Абдаллахом за города по Сырдарье он искал поддержки Российского государства. С этой целью в 1594 году он направил посла в Москву. Хан получил широкую известность в Центральной Азии как талантливый полководец и умелый дипломат. По словам современников, он выделялся также храбростью и примером умения держать себя. Придворный историк хана Абдаллаха писал о нём: «по мужеству, отваге и доблести он стал знаменит в Дешт-и-Кыпчаке».'
  note: Имя хана в исходнике опущено (контекст вырван из параграфа).
