  stem:
    ru: '26 августа 1920 года М. И. Калинин и В. И. Сталин Ленин подписали декрет о создании Киргизской Казахской Автономной Советской Социалистической Республики. В состав КАССР дополнительным постановлением в сентябре 1920 года была включена Оренбургская губерния. Оренбург стал первой столицей республики. В 1920 году в пограничную единицу состава КАССР вошли: Семипалатинская область в составе Павлодарского, Семипалатинского, Усть-Каменогорского, Зайсанского и Каркаралинского уездов; Акмолинская область, в составе которой были Атбасарский, Акмолинский, Кокчетавский, Петропавловский уезды и часть Омского уезда; Тургайская область в составе Костанайского, Иргизского, Актюбинского и Тургайского уездов; Уральская область в составе Уральского, Илецкого, Темирского и Гурьевского уездов; Мангышлакский уезд Закаспийской области; 4-я и 5-я адайские волости Красноводского уезда этой области; территории Синеморской области с Астраханской губернией, ранее прилегавшие к Букеевской Орде и 1-му и 2-му Приморским округам. Определите столицу Казахской АССР до 1925 года'
  options:
  - ru: Семипалатинск
  - ru: Кызылорда
  - ru: Оренбург
  - ru: Алматы
  note: Текст контекста в исходнике искажён; передан по смыслу.
