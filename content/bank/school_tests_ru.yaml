- id: badba84c
  stem:
    ru: 'Что стало причиной упадка власти хана Абулхаира и откочёвки Керея и Жанибека? В 1457 году близ Сыгнака Абулхаир потерпел поражение от ойратов. ... Большая часть народа вместе с Кереем и Жанибеком откочевала в Западное Жетысу. Причины дружественного отношения правителя Могулистана Есен-Буги к султанам: во-первых, у Есен-Буги в то время не было возможностей противостоять продвижению северных соседей. ... В-третьих, Есен-Буга с целью укрепления своей власти «счёл приход Керея и Жанибека к добру». Есен-Буга принял их «от достопочтенных ханов» с добрыми намерениями и почётом и отдал им западную часть Могулистана, долины рек Чу и Талас. Усиление Керея и Жанибека за счёт вновь прибывших, ослабление Могулистана, необходимость сдержать натиск ойратов в середине XV века поставили перед казахскими султанами задачу создания собственного государства. В долинах Чу и Таласа в 1465 году было провозглашено Казахское ханство, его первым ханом стал Керей, ставкой — Козыбасы»... Используя текст, определите край, где было образовано Казахское ханство'
  options:
  - ru: Между Чу и Таласом
