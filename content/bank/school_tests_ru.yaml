- id: cқазақ-10
  text:
    ru: Санжар Асфендияров (1889–1938 гг.) окончил реальное училище в городе Ташкенте … С. Асфендияров учился на стипендию Военно-морского министерства. Сначала в далёком Термезе, затем в Туркестанском полку был на фронте в качестве военного врача. Под Лодзью вместе с полком попал в немецкое окружение и был взят в плен. В начале 1916 года при обмене военнопленными вернулся на родину через Швецию. С 1919 года был народным комиссаром здравоохранения и земледелия Туркестанской республики, постоянным представителем Туркестанской республики в Москве. С. Асфендияров занимал ответственные должности в аппаратах Среднеазиатского бюро, ЦК Компартии Туркестана, Президиума ВЦИК. Был профессором Первого Московского государственного университета, наркомом здравоохранения Казахской ССР, заместителем председателя Казахской базы Академии наук СССР. … Будучи профессиональным врачом, увлёкся историей народа и стал её знатоком.
- id: cimg-ig_4787
  caption:
    ru: Могулистан (карта)
- id: cқазақ-11
  text:
    ru: 'В 1723–1724 годах войска Абулхаира захватили всю территорию между двумя реками. Эти слова хана Абулхаира, защищавшего казахов, запомнились народу навсегда: «… пока река не иссякнет и русло её не высохнет, казахи не покинут её берегов». Военные отряды Среднего жуза также пытались остановить продвижение военно-колониальных сил царского правительства. В 1731 году близ крепости … произошло кровавое столкновение между казахами и местным военным гарнизоном. Укрепление и улучшение царским правительством своего положения в Волго-Уральском регионе вызвало определённое противодействие со стороны правителей казахской страны. Возникновению таких напряжённых событий способствовали в основном следующие обстоятельства: во-первых, усилилась борьба за пастбища, во-вторых, …, в-третьих, казахи были против строительства Российской империей линии военных укреплений на их земле, в-четвёртых, казахи часто участвовали в борьбе башкир против царского правительства.'
- id: cқазақ-12
  text:
    ru: Образование Монгольского государства «… На территории Монголии было создано крупное кочевое государство под властью Темучина. Темучин родился около 1155 года. Рано оставшись сиротой, в молодые годы он пережил множество трудностей. К концу XII века он стал правителем монгольской степи. В 1203–1204 годах … Темучин завершил объединение основных племён Монголии. … весной на курултае монгольской знати он был провозглашён повелителем всех монголов и назван Чингисханом (его называли каганом), и это имя впоследствии стало его настоящим именем. Так было образовано Монгольское государство. Это государство объединило разрозненные племена в единый народ и прекратило междоусобные войны. На этом курултае была провозглашена «Яса» («Великая Яса»). …».
  note: В исходнике «бұл K2 шын есіміне» — артефакт OCR («бұл кейін»); цифра 2 в переводе опущена намеренно.
- id: cқазақ-13
  text:
    ru: Текст № 1. Сельское хозяйство постоянно упиралось в проблему нехватки кормовой базы, которая решалась в основном за счёт концентрированных кормов и зерна. Скот ежегодно кормили зерном в объёме до 40–45 млн т. Зерна для выпечки хлеба не хватало, и государство закупало зерно за границей. Первые крупнейшие поставки зерна начались с 1963 года, а с 1972–1973 годов они стали осуществляться регулярно. В Казахской ССР огромные объёмы зерна также шли на экстенсивное животноводство. Хотя миллионы тонн зерна использовались для кормления скота, результативность животноводства была очень низкой. Текст № 2. «…Сентябрьский Пленум ЦК КПСС 1953 года, критикуя положение сельского хозяйства в стране, взял курс на проведение реформ в этой жизненно важной отрасли. На нём рассматривались вопросы материальной заинтересованности сельских тружеников, поддержки личного подсобного хозяйства… постановление — один из законодательных актов, положивших начало законодательному оформлению быстрого освоения новых земель. Оно обязывало довести в 1956 году посевы зерновых на целинных землях до 20–30 млн га. Постоянное «ускорение» темпов освоения новых земель, то есть погоня за показателями, решало продовольственные проблемы, но вместе с тем стало причиной гораздо более печальных последствий…».
- id: cқазақ-14
  text:
    ru: Целиноградские события. Ярким проявлением пренебрежения интересами казахского народа стало решение политбюро ЦК КПСС весной 1979 года о создании немецкой автономии на территории Казахстана. Центром будущей автономии был определён город Ерейментау. В её состав должны были войти ряд районов … областей. В Казахстане, особенно в его северных областях, быстро распространилась весть о создании немецкой автономии. 16 июня 1979 года казахская молодёжь начала собираться на площади Ленина в центре Целинограда. Они вышли с лозунгами «Казахстан един», «Немецкой автономии — нет». Выражалось недовольство тем, что столь важное решение было принято без широкого общественного обсуждения. Попытки руководителей области быстро разогнать собравшихся закончились неудачей. Участники шествия построились в колонну и прошли по улицам города, скандируя лозунги. Следующее шествие состоялось 19 июня. Участники передали руководителям области обращение против создания автономии. Некоторые участники шествия были наказаны в административном порядке. В ходе народного недовольства создание немецкой автономии не было допущено.
  note: В исходнике искажён фрагмент «Ж кім қолдарына»; прочитан как «они вышли с лозунгами».
- id: cқазақ-15
  text:
    ru: '«…Урбанизация — один из глобальных процессов современного мира. В Казахстане в ходе промышленного строительства быстро росли города, строились рабочие посёлки, увеличивалась численность городского населения. В 80-е годы возросла миграция внутри республики, особенно переезд из села в город. В составе населения республики стало преобладать городское население. Его удельный вес в составе населения приблизился к общесоюзному показателю. Что касается сельского населения, то его численность быстрыми темпами не росла: в 1959 году доля сельского населения в общей численности населения была высокой. После этого началось снижение удельного веса сельских жителей. По данным Всесоюзной переписи населения 1970 года, удельный вес городского населения республики составил 50,3%. Именно с этого времени городское население стало составлять большую часть населения Казахстана. В дальнейшем доля городского населения медленно, но непрерывно росла. В советское время рост числа городов в Казахстане происходил под влиянием развития промышленности. Среди них можно выделить освоение природных ресурсов и развитие транспортной инфраструктуры. Ведь на железнодорожных магистралях и станциях возникли малые и средние города. В 60–80-е годы быстрый рост урбанизации происходил за счёт миграции сельского населения в города…»'
  note: Исходный текст контекста продублирован целиком (два одинаковых абзаца); переведён один раз. Цифры в проверке поэтому «удваиваются».
- id: cimg-ig_5115
  caption:
    ru: Эмир Тимур и Могулистан (карта)
- id: cқазақ-16
  text:
    ru: 'Текст № 1 «… Касым — сын Жанибек-хана. Касым правил в период укрепления Казахского государства. «Как истинный сын Степи, соблюдавший обычай уважения к старшим, султан Касым сначала во всём подчинялся Бурундук-хану», — пишет Мухаммед Хайдар. Султан Касым в источниках сначала упоминается как «известный султан, один из предводителей конницы» хана Бурундука. … К началу XVI века Касым «ещё не принял ханский титул, но его власть была столь велика, что никто не вспоминал о Бурундуке. Лишь в 1511 году, после того как состарившегося Бурундука проводили в Самарканд, Касым взял в свои руки управление государством и ханский титул. Как сказано в «Тарих-и-Рашиди», «Касым-хан стал могущественным правителем Дешт-и-Кыпчака, какого не было после Джучи-хана, его слава и могущество возросли…». Текст № 2 «…Для укрепления государства Касым-хан издал законы. Законы Касым-хана сохранились в памяти народа под названием «Касым ханнын каска жолы» («Светлый путь хана Касыма»). Этот свод права состоит из пяти основных разделов: 1. Имущественное право (мульк); 2. Уголовное право; 3. Военное право; 4. Посольский обычай; 5. Закон общества. … ».'
  note: «Жұртшылық заңы» передано как «закон общества» — сверить по учебнику.
- id: cқазақ-17
  text:
    ru: Кимакский каганат «О кимаках говорится в арабских, персидских, тюркских и китайских источниках. Обособление племени произошло в 656 году в ходе падения Западно-Тюркского каганата. Предводитель племени кимаков носил титул шад-тутук. После падения в 840 году Уйгурского каганата часть племён, входивших в его состав, присоединилась к кимакам. Глава Кимакского племенного союза носил титул кагана. Арабский учёный аль-Идриси называет 16 кимакских городов. Упоминаются пашни, города и поселения кимаков. Об Имакии, городе-ставке кагана, оставили записи арабские путешественники. Кимаки занимались в основном кочевым скотоводством; на берегах Иртыша и в горах Тарбагатая найдены древнетюркские надписи IX–X веков»
- id: cқазақ-18
  text:
    ru: «Население и территория. Тюргеши в VI веке входили в состав Западно-Тюркского каганата. Они заселяли междуречье Или и Чу и делились на чуйских тюргешей (жёлтые тюргеши) и илийских тюргешей (чёрные тюргеши). В конце VII века борьба тюрков против Китая привела к усилению тюргешских племён. В 704 году тюргеши … установили своё политическое господство. Каган разделил страну на 20 административных округов, каждый из которых выставлял войско. Ставками были города Суяб и Кунгут. При них тюргеши окрепли и превратились в самое могущественное государство. Положение Тюргешского государства с момента его образования было сложным. На юго-западе они вели ожесточённую борьбу с арабами, на юго-востоке отражали китайскую агрессию, с востока угрожал Восточно-Тюркский каганат; в Жетысу с Алтая и Тарбагатая переселились карлукские племена. Ослабевшее Тюргешское государство пало в 756 году».
- id: cқазақ-20
  text:
    ru: Есим-хан. Источники особо выделяют султана Турсуна среди политических соперников Есим-хана. В 1613 году правитель Ташкента Турсун объявляет себя ханом. Главной опорой его в этом мятеже был род катаган. Стремление Турсуна к ханскому престолу и выступление против Есим-хана привели к ослаблению в стране центральной власти. В 1627 году, когда Есим-хан, разгромив ойратов, возвращался из похода, Турсун напал на его ставку Туркестан. Услышав эту весть, Есим-хан вступает со своим войском в Ташкент и разбивает Турсуна. Он сурово наказывает род катаган, бывший главной опорой мятежника. Часть рода катаган, уцелевшая после наказания, уходит в Афганистан, а некоторые растворились среди уйгуров и кыргызов. Это событие вошло в историю как «катаганская резня». По словам историка Махмуда ибн Вали, Есим-хан умер в 1628 году и был похоронен рядом с мавзолеем Ходжи Ахмеда Яссауи в городе Туркестане. Будучи богатырём, высокого роста, внушительной внешности, он получил от народа прозвание «Енсегей бойлы ер Есим» («рослый муж Есим»). По сведениям источников, он был «свободен от высокомерия и честолюбия», приветлив, прост. Даже в тяжёлое время борьбы с Турсуном, как пишет историк Абулгази, он «оставался таким же простым, гостеприимным и скромным, как прежде».
  note: «Енсегей бойлы ер» оставлено в транслитерации с пояснением; «катаганская резня» — сверить по учебнику.
- id: cқазақ-22
  text:
    ru: Контекст № 2 «... Однако к началу XX века большая часть горнодобывающих предприятий перешла в руки иностранных предпринимателей. Царское правительство широко открыло иностранным предпринимателям дорогу к освоению окраин. Ни достаточного опыта, ни современных технических средств для освоения месторождений у русских предпринимателей не было. При сбыте добытой готовой продукции они сталкивались с огромными трудностями. Российские же чиновники были на стороне иностранных предпринимателей. Они получали от иностранных предпринимателей взятки за оказание поддержки. Иностранные предприниматели в основном были случайными людьми. Среди них были рядовые учителя, мясники, торговавшие мясом, мелкие торговцы и даже переводчики. Не имея в личной собственности капитала, они на кредиты, выданные банками западных стран, скупали рудники и шахты в Казахстане почти за бесценок и быстро разбогатели.»
- id: cқазақ-23
  text:
    ru: Тюрки, объединившиеся с родами-племенами теле под властью Бумын-кагана, выступили против жужаней, от которых они в то время зависели. В 552 году тюрки под предводительством Бумын-кагана разгромили жужаней. Причиной этой войны стало стремление тюрков освободиться из-под власти жужаней. Среди них были и очень могущественные племена ашина. Желая спровоцировать жужаней на войну, тюрки попросили Анахуана, кагана жужаней, отдать свою дочь замуж за их вождя. Эта просьба задела честь Анахуана. Жужани никогда не могли и подумать о подобных намерениях со стороны тюрков, выплавлявших для войск жужаней необходимое железо и исправно выплачивавших дань. Но тюркам повезло, и они одержали победу. Внезапно напавший Бумын-каган разгромил врагов. Анахуан покончил с собой, а наследник жужаней бежал в соседнюю страну…»
  note: 'В исходнике опечатка «көсемдеріке» (= «көсемдеріне»): тюрки просят Анахуана отдать дочь за их вождя. Фраза «түркілердің … пиғыл ойларына да келмейтін» — субъект: жужани.'
- id: cқазақ-24
  text:
    ru: 'Текст 1. «Кенесары с юных лет отличался смелостью и мужеством. Кенесары сумел стать правителем, достойным расположения своей дружины. Высоким духом его дружины позавидовал бы любой полководец европейской армии. Его нападения были столь стремительны, как степной ураган, сметающий всё на своём пути. Какие бы препятствия ни стояли перед ним, он лишь распалялся и не останавливался, пока не сметал, как потоп, все преграды на пути к намеченной цели, и чем сильнее становились трудности, тем сильнее становился его натиск. Кочевники высоко ценили эти качества Кенесары, и сердца его соратников бились безграничной, самоотверженной верой в своего полководца». И. Есенберлин «Хан Кене». Текст 2. Английский журналист Д. Ч. Бульджер, живший во второй половине XIX века, писал: «…Сырым-батыр — энергичная, глубокомысленная, мужественная, смелая, находчивая, хитрая, исключительная личность. От природы обладая исключительной физической силой, богатый умом, волевой, храбрый, находчивый, с достаточной долей хитрости и изворотливости, умеющий по достоинству ценить себя, он пользовался таким почитанием, что можно сказать — ему поклонялся весь народ».'
- id: cқазақ-25
  text:
    ru: 'Великий Шёлковый путь объединил дорогу, тянувшуюся от реки Хуанхэ в Китае на востоке до Византийской империи (Восточной Римской империи) на западе. Вдоль пути шёлковая ткань наряду с золотом играла роль международной валюты. Самым ценным товаром на Великом Шёлковом пути был шёлк. Шёлк появился в Китае 6000 лет назад. Китай долго хранил тайну шёлка. Тайну производства шёлка первыми раскрыли согдийцы и японские купцы. В II–V веках Шёлковый путь начинался на востоке от Хуанхэ, шёл в Кашгарию и Фергану, затем через Самарканд и Бухару в Сирию. В VI–XIII веках основным направлением ВШП было: Сирия — Иран — Средняя Азия — Южный Казахстан — долина Таласа и Чу — Иссык-Куль, через Восточный Туркестан в Китай.'
