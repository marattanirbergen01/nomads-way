    ru: 'Используя исторические знания, определите верное утверждение о культуре саков I. В погребальных сооружениях тасмолинской культуры рядом расположены два кургана: выстроены каменные ящики; II. Усуньская культура сформировалась на территории Тянь-Шаня, Западного Алтая и Северо-Западного Тибета; III. Ковёр «Сапалы» — один из первых образцов ворсовых ковров в мире; IV. В период саков на территории Южной Сибири существовала вахшская культура.'
