- id: beac9577
  stem:
    ru: 'Саки «Об ранних кочевниках — саках, скифах (древнеперсидское — сака, древнекитайское — сэ) и сарматах и о племенах восточной части Великой степи можно узнать не только из данных археологов, но и из многочисленных письменных источников. Древнеперсидские письмена конца VI века до н. э. — самый ранний источник о времени саков. На древнеперсидских рельефах изображены и саки. В Бехистунских надписях персидского царя ... описан его поход в Среднюю Азию против саков-тиграхауда («носивших остроконечные колпаки»). На территории Казахстана найдены сотни сакских курганов. Самые древние из них относятся к VIII веку до н. э. Диаметр крупных курганов достигал 100 м, а высота — 17 м.» Используя сведения из текста, определите персидского царя, описавшего в Бехистунских надписях поход против саков-тиграхауда:'
