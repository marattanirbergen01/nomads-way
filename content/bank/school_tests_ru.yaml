- id: c20252-1
  text:
    ru: Курмангазы Сагырбайулы (1806–1879) родился в местности Жидели в Букеевской Орде. С детства он самостоятельно учился играть услышанные им кюи. Полностью посвятив себя искусству кюя, он стал профессиональным кюйши. У него более шестидесяти кюев, а некоторые из них известны в нескольких вариантах. В кюях Курмангазы отражена правда жизни, они подобны автобиографическим произведениям. В кюе «Кишкентай» слышится скорбь народа, потерпевшего поражение в восстании. В кюе «Балбырауын» изображён народный праздник, в кюе «Сарыарка» — необъятная степь, в кюе «Кисен ашкан» — трагическая судьба народа. За произведения, проникнутые духом борьбы, Курмангазы преследовали богачи и царские чиновники, он был заключён в тюрьму.
  note: В исходнике сбита фраза «олар өмірбаяндық белгілі… шығармалар іспеттес»; восстановлен смысл по контексту.
- id: c20252-2
  text:
    ru: 'В марте 1921 года ВЦИК принял декрет «О замене продовольственной и сырьевой разверстки продналогом». В марте–апреле 1921 года в республике продразвёрстка была заменена продналогом. Размер продналога был твёрдым: он устанавливался до весеннего сева по каждому виду сельскохозяйственной продукции с учётом местных условий и зажиточности крестьянского хозяйства. Скотоводческие хозяйства, имевшие 6 голов крупного рогатого скота и менее, освобождались от налога. В 1922–1923 годах все виды натуральных налогов были заменены единым натуральным налогом.'
  note: «Жарғы» передано как «декрет» (по смыслу документа).
- id: c20252-3
  text:
    ru: Место Абылая в истории Казахстана. Абылай-хан умер в 1781 году и был похоронен в мавзолее Ходжи Ахмеда Яссауи. Узнав о смерти Абылай-хана, китайское правительство выразило соболезнования и направило послов. Абылай-хан занимает особое место в истории казахского народа. Усилия Абылая прежде всего были направлены на создание сильного и независимого Казахского государства. По словам русского учёного И. Крафта, «Он (Абылай. — авт.) умел, смотря по обстоятельствам, казаться то искренне преданным России, то Китаю, то Джунгарии, а на деле никому не покорялся». Абылай-хан возглавил процесс объединения казахов и внёс большой вклад в создание в необъятной степи государства с единым центром. Он сыграл важнейшую роль в разгроме и победе над джунгарами и волжскими калмыками. Он не только остановил продвижение китайской армии вглубь территории Казахстана, но и добился возвращения казахам их исконных традиционных пастбищ в Тарбагатае и в Приилийском крае. Он остановил и нападения алатауских кыргызов на казахов.
- id: c20252-4
  text:
    ru: «Родился в местности Сарытубек Тургайского уезда Тургайской области. Учился в аульной школе, там же овладел грамотой. В 1886–1891 годах учился в двухклассном русско-казахском училище в Тургае. В 1891 году поступил в Оренбургскую учительскую школу и окончил её в 1895 году. ... Работал учителем в школах и русско-казахских училищах Актюбинского, Костанайского, Каркаралинского уездов. В 1913 году стал редактором газеты «Казах», поднимал актуальные вопросы народной жизни, призывал народ к знаниям и просвещению. В 1911 году вышел сборник стихов «Маса» («Комар»). По приговору НКВД в декабре 1937 года расстрелян».
  note: «ІІХК» = НКВД.
- id: c20252-5
  text:
    ru: «В 1643 году Батур-хунтайджи вторгся на территорию Казахского ханства. Получив известие о нашествии врага, Жангир выступил против него. Неизвестно, сколько войск собрал Жангир для этого сражения. Жангир-хан, применив передовые для степного края военные приёмы, одержал победу в Орбулакской битве. По русским документам того времени, Жангир приказал половине своих людей, вооружённых «огненным боем», вырыть ров на горном перевале и укрепиться. Сам же с тремястами воинами укрылся в горах. Когда ойраты вошли в ущелье, их встретил шквальный ружейный огонь. Враг пришёл в смятение, потерял голову, и в этот момент с тыла ударил сам Жангир. На помощь казахским воинам с 20 тысячами человек пришёл правитель Самарканда Жалантос-батыр. Ойраты были разбиты, потеряв около десяти тысяч человек, и отступили».
- id: c20252-7
  text:
    ru: Жангир-хан «В 1643 году Батур-хунтайджи вторгся на территорию Казахского ханства. Получив известие о нашествии врага, Жангир выступил против него. Известно, сколько войск собрал Жангир для этого сражения. Жангир-хан, применив передовые новые военные методы для степной войны, одержал победу в Орбулакской битве. По русским документам того времени, Жангир приказал половине своих людей, вооружённых «огненным боем», вырыть ров в горах и укрепиться. Сам же с тремястами воинами прячется в горах. Когда ойраты вошли в ущелье, их встретил шквальный ружейный огонь. Враг пришёл в смятение, потерял голову, и в этот момент спереди ударил сам Жангир. На помощь казахским воинам с 20 тысячами человек пришёл правитель Самарканда Жалантос-батыр. Ойраты разбиты, они теряют около десяти тысяч человек и отступают».
  note: Отличия от c20252-5 (белгілі/белгісіз, алдан/тылдан, настоящее время) сохранены намеренно.
- id: c20252-8
  text:
    ru: «...Султан Абылай в это самое время с каждым днём набирал силу. Среди современных ему ханов и султанов киргизов (казахов) он был правителем, превосходившим других опытом, широко известным умом и рассудительностью, могущественным по числу своего народа. Абылай, слава которого среди трёх жузов возросла благодаря его отношениям и с императором Русского государства, и с китайским богдыханом, обладал всем необходимым, чтобы стать правителем Среднего жуза. Вполне уверенный в своих преимуществах, он умел привлекать на свою сторону всех сторонников учтивостью и степенным нравом, устрашать врагов демонстрацией силы, а в зависимости от каждого сложившегося положения вёл себя то как находящийся под рукой русских, то как находящийся под рукой китайцев, но на деле был независимым правителем, никого не признававшим. Это его качество особенно ярко проявилось после 1771 года. К тому времени он перестал даже думать о том, чтобы хотя бы внешне казаться подвластным России, и, не прибегая к двуличию, стал называть себя истинно самостоятельным и независимым ханом».
  note: Исходник — неуклюжий перевод с русского; фразы сглажены, смысл сохранён.
- id: c20252-9
  text:
    ru: «Государство найманов, владея землями Западной Монголии и Восточного Казахстана, достигло расцвета во второй половине XII века. У найманов развились городская культура и земледелие, расширились торговые связи с соседними государствами. Именно в это время все восемь племён объединились в единое государство. Столицей государства был город Балыкты на берегу реки Орхон. ... Мирные отношения с кереитами сменялись периодами военных столкновений. Найманы соперничали с кереитами за власть над кочевниками Центральной Азии. Однако на рубеже XII–XIII веков государство найманов само распалось на две части. ... В это время начало усиливаться влияние монгольского вождя Темучина (Чингисхана). В 1201 году найманы, стремясь остановить усиление монголов, организовали курултай с участием представителей тюркоязычных племён. Однако в том же году найманы и их союзники потерпели поражение от монголов. В 1204 году монголы полностью разгромили найманов. Кучлук, сын последнего правителя найманов, собрал оставшееся войско и ... поселился»...
  note: «Балықты» оставлено в транслитерации — проверить по учебнику.
- id: c20252-10
  text:
    ru: 'Диктаторская единоличная власть. Тоталитарный режим. Формы проявления: формирование экономики сырьевой направленности. Ассимиляционная политика. Отсутствие подлинного суверенитета. Создание концлагерей. Проведение массовых репрессий. Страдания более 3,7 млн человек.'
- id: c20252-11
  text:
    ru: '«... толпа предъявила комиссии свои требования. Он заявил, что не желает принимать новое положение... просил оставить без изменений прежнюю систему управления через султанов и прежние виды налогов и сборов. Он упорно твердил, что с оружием в руках готов защищать прежние порядки до конца... Волнение народа с каждым днём усиливалось и ширилось. Киргизы теперь начали переходить от слов к делу: образовалась огромная толпа смутьянов. В Уральской области такие группы встречались повсюду, а в Тургайской области — часто по берегам рек Илек и Кобда. Они постоянно поддерживали связь друг с другом, обменивались вестями и намеревались действовать сообща в любом месте. Кроме того, они пытались привлечь в свои ряды и казахов... представители царской администрации не могли найти транспортные средства. Ведь найти такой транспорт могла только сама казахская степь. В Букеевскую Орду был послан специальный чиновник, чтобы найти верблюдов и проводников. Но тамошние киргизы, сочувствуя своим единокровным братьям по ту сторону Урала, не поддались уговорам этого чиновника».'
- id: cimg-t2526_991
  caption:
    ru: Ранние кочевые племена (карта)
- id: c20252-12
  text:
    ru: 'Текст № 1: В период депортации немцев (при ликвидации Немецкой автономной области на Волге) сотни тысяч немцев были переселены на территорию Казахстана. После принятия решения о создании немецкой автономии руководство Казахстана приступило к его реализации. Рассматривались вопросы уточнения границ новой области, размещения областных организаций, утверждения структуры и штатов новой администрации. Планировалось включить в состав новой автономии ряд районов Акмолинской, Павлодарской, Карагандинской, Кокшетауской областей. Текст № 2: ... в центре собралась большая группа казахской молодёжи с транспарантами «Казахстан неделим!», «Немецкой автономии не будет!». Заявив, что Казахстан является Родиной не только казахов, но и русских, украинцев, татар, представителей других национальностей, они объявили, что создание автономии без учёта мнения проживающего в республике населения невозможно и противоречит закону. 19 июня во время второго митинга руководители области заверили народ, что «... никакой автономии не будет». Немецкая автономия на территории Казахской ССР создаваться не будет.'
- id: cimg-t2526_1108
  caption:
    ru: Сакские племена и курганы (карта)
- id: c20252-13
  text:
    ru: «... эпоха охватывает III–II тысячелетия до н. э. В эту эпоху в Степи появилось скотоводство. Одомашнивание лошади степняками связывают с формированием в Казахстане ботайско-терсекской археологической культуры. В этой переходной культуре преобладала охота, скотоводство только начинало осваиваться. Ботайская (ботайско-терсекская) культура — первая в истории человечества культура коневодов. Ботайское поселение существовало в 3700–3100 годах до н. э. Ботайцы занимались коневодством. Конина и кумыс были их основной пищей. Одомашнивание ими лошади и верховую езду подтверждают найденные на ботайских поселениях конская сбруя, приспособления для стреноживания и другие предметы»
- id: c20252-14
  text:
    ru: 'Махмуд Кашгари, живший в эпоху правителя из династии Караханидов Сатук Богра-хана, написал труд «Диван лугат ат-турк» («Словарь тюркских наречий»). Он считается первым среди тюркских народов учёным, почти в совершенстве овладевшим арабским и персидским языками, литературой и культурой. Этот труд содержит ценные сведения о быте и жизни многих тюркских племён, живших в XI веке. В него вошли и пословицы с поговорками того времени, бытующие в современном казахском языке. Махмуд Кашгари считал тюркский язык одним из самых чистых языков. Он писал: «Я — тюрк» и характеризовал тюркский язык как самый открытый, ясный и точный. По его словам, это чистый язык, не подвергшийся влиянию никаких других языков. Он подчёркивает, что все люди желают жить в мире, спокойствии и счастье. Кашгари призывал современников самостоятельно учиться и познавать: «Избирай добро, не проявляй трусости». В творчестве Махмуда Кашгари показано, что развитие общества зависит от нравственных качеств человека. Для этого, по его мнению, граждане страны должны воспитываться на чувствах патриотизма, любви к Отечеству, на духе смелости и мужества.'
- id: c20252-15
  text:
    ru: В эпоху правления Есим-хана внутриполитическое положение ханства было сложным и тревожным. Главным его соперником в борьбе за власть был правитель Ташкента Турсун-султан. В 1613 году Турсун-султан поднял восстание против Есим-хана, и некоторые правители рода катаган также отказались подчиняться Есиму. Турсун объявил себя ханом и стал самостоятельным правителем южного региона. Его стремление к власти привело к ослаблению центральной власти. В 1627 году, когда Есим-хан возвращался из похода против ойратов, Турсун напал на его ставку — Туркестан. Это событие усилило раздробленность казахских родов и породило внутренние противоречия. Однако войско Есим-хана разбило Турсуна близ Ташкента. Поражение Турсуна жестоко отразилось на племени катаган как суровое наказание. Часть племени катаган бежала в Афганистан, а некоторые поселились среди уйгуров и кыргызов. Это событие вошло в историю как «катаганская резня» и запомнилось как одна из самых кровавых страниц межплеменных противоречий внутри ханства.
  note: «Қатаған қырғыны» — в глоссарии нет, вариант «катаганская резня» проверить по учебнику.
- id: c20252-16
  text:
    ru: '16. Обострение отношений Абулхаира с Россией. Он рассчитывал: 1. опираясь на помощь России, подчинить хивинцев и каракалпаков, стать ханом над тремя казахскими жузами; 2. передать власть по наследству своим потомкам; 3. усилившись, отказаться от подчинения России. Цель российского правительства: подчинив казахов, наладить торговые связи со Средней Азией. В 1740-х годах Абулхаир просил у правительства следующее, но: 1. Под предлогом отдалённости местности запрошенные им пушки не были даны. 2. Для развития торговли в степь не были направлены караваны. 3. Отправленный в аманаты сын впоследствии не был возвращён. 4. В Сибири для казахов под предлогом, что «казахи не могут жить на одном месте», города не строились. Надежды хана и народа не оправдались. Поэтому и хан, и народ стали терять доверие к царскому правительству.'
- id: cimg-t2526_2259
  caption:
    ru: Колониальный характер административных реформ 80–90-х годов XIX в. (схема)
- id: c20252-17
  text:
    ru: Национально-освободительные движения казахского народа в первой половине XIX века. В первой половине XIX века Российская империя усилила колониальные действия на территории Казахстана. Это ярко проявилось в процессе захвата земель казахов. Царское правительство, присоединив земли казахов Младшего жуза вдоль реки Илек, создало новую Новоилецкую линию. Новоилецкая линия охватывала пространство между реками Урал, Илек, Куралай и Бердянка. У казахов было отнято около 600 тысяч десятин плодородных земель. По реке Илек были заложены укрепления-крепости Изобильная, Боранды, Ново-Илецкая, Линёв, Угольная, Вятлянская и Бердянская. На территории нового района были размещены военные, казаки и переселённые из России крестьяне. Это толкнуло доведённых до отчаяния местных казахов на открытое вооружённое восстание.
  note: Названия крепостей Боранды, Угольная (Көмірлі), река Куралай — проверить по учебнику.
- id: cimg-t2526_2383
  caption:
    ru: Проявления тоталитаризма в Казахстане (схема)
- id: c20252-18
  text:
    ru: Усуни. Государство усуней было создано в конце I тысячелетия до н. э. на территории Жетысу (Семиречья), Тарбагатая и Тянь-Шаня. Усуни — потомки саков-тиграхауда. Они занимались полукочевым хозяйством. Социальные различия хорошо прослеживаются по курганам. Высшая власть у усуней принадлежала правителю — гуньмо; она передавалась ему по наследству. Дворец гуньмо находился в городе Чигу. Государство делилось на восточную (левую), южную (правую), западную и центральную части, которые, в свою очередь, делились на мелкие уделы.
  note: Опечатки OCR в исходнике («соп жақ», «мөлдіктерге», «Үйнсіндер») прочитаны как «сол жақ», «бөліктерге/уделы», «Үйсіндер».
- id: c20252-19
  text:
    ru: Как отмечал писатель М. Ауэзов, поэты эпохи «Зар заман» до середины XIX века тосковали по свободной жизни страны в прошлом, призывали нацию не отрываться от духовных ценностей, в печальных песнях оплакивали судьбу народа. Они не смирялись с колониальным гнётом царской России, с тяжёлым положением народа на собственной земле. Поэты «Зар заман» тревожились за будущее своей страны, вспоминали прошлое с тоской и сожалением. Критике подвергались взяточничество волостных управителей, несправедливость некоторых казахских биев, распространившиеся в обществе клевета, сплетни и т. д. Выход из этого тупика некоторые поэты сравнивали с загробным миром. Беду, обрушившуюся на страну, они уподобляли концу света.
- id: c20252-20
  text:
    ru: Жаяу Муса Байжанулы — одна из известных личностей казахской музыки второй половины XIX века, выдающийся поэт и композитор (1835–1929). Он родился в местности Акшоки Баянаульского округа. Грамоте сначала учился у аульного муллы, затем получил образование в Омске. Игре на домбре, скрипке и гармони он научился с юных лет. Был знаком с произведениями выдающихся русских поэтов и писателей. В своих стихах и песнях Жаяу Муса смело разоблачал насилие местных волостных управителей, колониальную политику царского правительства. Его знаменитая песня «Аксиса» родилась из протеста против социальной несправедливости. За сопротивление властям он был осуждён как «опасный человек в степи» и сослан в город Тобольск. Там, находясь в тюрьме, он написал письмо генерал-губернатору Западной Сибири с просьбой отправить его на военную службу. Его просьба была удовлетворена, и он служил в армии в Тобольске, Оренбурге, Казани, Новгороде, Москве, Владимире и Петербурге, а также в Польше и Литве. Он сочинил более 60 песен, среди них «Толгау», «Бозторгай», «Жанбота», «Гашыгым».
- id: c20252-21
  text:
    ru: '«АЛАШ: ОБЩЕСТВЕННАЯ МЫСЛЬ И НАЦИОНАЛЬНАЯ ИДЕЯ» «...В начале ХХ века самосознание казахского народа проявилось на высоком уровне. В борьбе за национальную свободу вперёд выдвинулись образованные казахи, не жалевшие сил ради интересов народа. Великие реформаторы ХХ века Алихан Бокейхан, Ахмет Байтурсынулы, Миржакып Дулатулы повели нацию к свободе. Стержнем национальной идеи Алаш было создание национального государства. Основные положения идеи Алаш мы можем увидеть в Каркаралинской петиции, в программе партии «Алаш» и в трудах крупных представителей национально-демократического движения...»'
- id: c20252-22
  text:
    ru: История казахской печати. Первый номер вышел в 1913 году в городе Троицке Тургайской губернии. Большинство материалов, опубликованных в журнале, было посвящено вопросам жизни человека, обычаев и нравов, образования, здравоохранения. Однако журнал был закрыт в 1913 году. Тем не менее влияние журнала на формирующийся народ было значительным, он особенно повлиял на сознание народа. — С 1913 года в Оренбурге начала выходить общенациональная газета. Основу издания заложил А. Байтурсынулы, активными авторами были А. Бокейхан и М. Дулатулы. При среднем тираже около 8 тысяч экземпляров на страницах издания пропагандировались свобода и равенство восточных женщин, поднимались вопросы народного просвещения.
  note: В исходнике названия журнала и газеты опущены (потеряны при извлечении).
- id: c20252-23
  text:
    ru: ХУННУ «...Государство хунну — империя ранних кочевников. Оно относилось ко второму типу государств. Государство хунну складывалось в борьбе с соседними племенными союзами и китайскими царствами. Во главе государства стоял шаньюй (тэнгрикут), его власть строго передавалась по наследству, и он обладал огромным авторитетом. Его называли «Сыном Неба», «Рождённым Небом и Землёй», «Назначенным Солнцем и Луной», «Великим шаньюем». Он объявлял войну и заключал мир, возглавлял войско в походах, вёл переговоры, решал все вопросы внешней политики. В государстве после шаньюя высшими лицами были «левые» и «правые» (т. е. западные и восточные) малые ханы. Они управляли западными и восточными территориями империи, руководили левым и правым крылом войска...»
  note: Соотнесение «левые = западные» дано как в исходнике (в литературе левое крыло — восточное).
- id: c20252-24
  text:
    ru: '«Особенности археологических культур заключительного этапа бронзового века на территории Казахстана: Синташтинская культура сосредоточена на равнине Южного Урала в России. Эта культура известна поселениями круглой или прямоугольной формы особого устройства, построенными из глины, и погребениями с двухколёсной колесницей и захороненной вместе с ней лошадью. Петровская культура близка к синташтинской. Особенность петровских поселений — наличие оборонительных рвов. В петровских погребальных памятниках дети и воины имели отдельные захоронения. Алакульская культура расположена в лесостепных районах Центрального и Западного Казахстана. Её носители жили в полуземлянках. Алакульцы, жившие в лесостепи, строили большие жилища из брёвен; в степях Западного Казахстана отсутствие леса определило своеобразие каменных поселений, где вместо дерева использовали камень. Федоровская культура продолжила традиции алакульцев. В какой-то период алакульцы и федоровцы могли жить рядом друг с другом. Федоровцы продвигались на восток и расселились близ бассейнов Тобола и Иртыша.»'
  note: Середина абзаца про алакульскую культуру в исходнике испорчена («Батыс Қазақстанның жартылай жер үйлерде тұрған… тасты бұтақ қоныстарының»); смысл восстановлен приблизительно — сверить с учебником.
- id: c20252-25
  text:
    ru: Открытие светских школ и учебных заведений в Казахском крае. «В 1813 году в Омске, а в 1825 году в Оренбурге были открыты военные училища. Впоследствии они были преобразованы в Сибирский и Оренбургский Неплюевский кадетские корпуса. На приём казахских детей в эти учебные заведения были наложены значительные ограничения. Казахских кадетов не допускали к изучению ряда военных предметов. В целом нельзя сказать, что дело народного образования и уровень грамотности в Казахстане были удовлетворительными. Светских школ было очень мало. Не хватало специалистов-учителей. В условиях кочевого и полукочевого образа жизни открывать постоянные школы было трудно. В казачьих станицах, в крепостях при церквях были школы, где учились дети казахов. Уровень преподавания в них был очень низким. Подавляющее большинство учителей составляли малограмотные дьячки, а также солдаты и казахи, выполнявшие служебные обязанности. Поэтому ... в 1883 году в городе Орске Оренбургской губернии впервые была открыта учительская школа для казахов.»
  note: «Қазақ станицаларында» прочитано как «казачьих станицах».
- id: cimg-t2526_3043
  caption:
    ru: Кимакский каганат (карта)
- id: c20252-27
  text:
    ru: Западно-Тюркский каганат «...Усиление Китая, борьба между правящими группами тюрков привели к распаду Тюркского каганата и выделению в 603 году Западно-Тюркского каганата («он ок будун»). Восточные «пять стрел» западных тюрков — племена дулу — занимали земли Восточного Туркестана и Жетысу. Западные «пять стрел» — нушиби — владели территорией к западу от реки Чу. Каганат достиг расцвета при Шегу-кагане и Тон-ябгу. Западно-Тюркский каганат состоял не только из кочевого населения. Ему были подчинены многие города и земледельческие районы. Зависимость среднеазиатских государств (Хорезм, Фергана, Шаш, Согд и др.) не ограничивалась выплатой дани. Руководители, назначенные тюрками, обеспечивали сбор налогов и сборов. К местным правителям были приставлены тюрки, и они были включены в административную иерархию империи. Тюркские правители стремились также породниться с правителями зависимых оседлых народов...».
  note: Фраза «Жергілікті билеушілерге түркі халықтары беріліп…» в исходнике неясна; перевод — наиболее вероятное прочтение.
- id: c20252-28
  text:
    ru: Бахытжан Каратаев «...Первый казахский юрист, государственный и общественный деятель, просветитель, демократ (1863–1934). Родился в ауле Акбакай Каратобинского района Западно-Казахстанской области. Правнук хана Младшего жуза Абулхаира. Окончил Оренбургскую гимназию и юридический факультет Санкт-Петербургского университета. В 1905–1914 годах был членом ... партии. В 1907 году участвовал во второй Государственной думе в качестве депутата от ... области, выступал в защиту интересов казахского народа по вопросу... Несмотря на недолгую работу в Государственной думе, казахские депутаты сделали всё возможное, чтобы донести до российского парламента правду о положении в крае...»
- id: c20252-29
  text:
    ru: Развитие народного образования «Одновременно с установлением Советской власти начали осуществляться меры по перестройке культуры. В стране большое внимание уделялось развитию народного образования и просвещения. В 1920–1921 учебном году в Казахстане действовало 2410 школ, большинство из них — начальные. Развитию образования мешали малочисленность специальных и соответствующих учебных заведений, нехватка учебников и преподавателей. Были написаны учебники на казахском языке. К концу 1928 года для казахских школ вышло более 30 учебников. В 1924 году А. Байтурсынулы усовершенствовал казахский алфавит, созданный на основе арабской графики. В 1929 году все нововведения, внесённые в арабскую письменность, прекратились с переходом на латинский алфавит. В середине 20-х годов центральные и местные органы власти начали уделять внимание обучению девочек... Школы для девочек были открыты в Шымкенте, Туркестане, Алматы и Орде...».
- id: cimg-t2526_3329
  caption:
    ru: Причины переселения крестьян на территорию Казахстана (схема)
- id: c20252-30
  text:
    ru: Казахстан в период «застоя». В политическом плане против «инакомыслящих» (диссидентов) активно и целенаправленно использовались средства массовой информации и идеологическая работа. За «идеологически вредными» действиями внимательно следили КГБ (Комитет государственной безопасности) и партийные органы. Человек, уличённый в таких проступках, подвергался преследованию; среди тех, кто избрал собственный альтернативный путь и вступил в столкновение с органами советской власти, были Махмет Кулмагамбетов, Хасен Кожахметов и др. Философ Махмет Кулмагамбетов, обладавший высокой квалификацией и глубокими знаниями, в 1962 году за несогласие с советским порядком был арестован в городе Рудном Костанайской области и осуждён на 7 лет. Усиление контроля за поведением граждан создало невыносимые условия. Многие важные решения, принятые небольшой группой советского руководства, были нелогичными и противоречили интересам советского народа. Искажения в национальной политике, господство советской идеологии, нетерпимость власти к свободе мысли вызывали недовольство, особенно среди интеллигенции.
- id: cimg-t2526_3562
  caption:
    ru: Могулистан (карта)
- id: c20252-31
  text:
    ru: Рунические письмена «Древние образцы письменности, которой пользовались далёкие предки современных казахов, называются орхоно-енисейской, или древнетюркской рунической письменностью. В 582 году была установлена надгробная плита, на которой были записаны подвиги первых тюркских каганов. С этой плиты начинаются древнетюркские письменные источники. Древнетюркский рунический алфавит возник в середине первого тысячелетия. Одними из первых древнетюркскую письменность европейские учёные начали изучать в XVIII веке. В 1893 году датский учёный В. Томсен разгадал тайну слова «Тенгри», прочитанного первым. В его книге «Расшифрованные орхонские надписи» был опубликован не только полный алфавит древнетюркских надписей, но и перевод. Раскрытие тайны тюркской письменности показало, что в Центральной Азии ещё в начале средних веков существовала цивилизация. До открытия Томсена господствовало мнение, что у тюрков письменности не было. В долине Енисея найдено более 150 рунических надписей. Большую часть из них составляют надгробные плиты, поставленные при погребении знати. Все надгробия написаны древнетюркским литературным языком.»
  note: «Алғашқы «Тәңір» сөзінің құпиясын ашты» передано как «тайну слова «Тенгри»» (слово «алғашқы» относится к прочтению); сверить по учебнику.
- id: c20252-32
  text:
    ru: Тауке-хан «События времени правления Тауке-хана встречаются в трудах восточных авторов, в китайских, русских источниках, а также в устном народном творчестве. В народных преданиях период правления Тауке-хана называют «Золотым веком» Казахского государства. ... Порядок в ханстве Тауке обеспечивал не только военной силой, но и благодаря дипломатическому мастерству и умению управлять страной. Эти качества ..... Тауке собрал вокруг себя мудрых советников. Влиятельные бии трёх жузов вошли в совет при хане. Это Толе би в Старшем жузе, Казыбек би в Среднем, Айтеке би в Младшем..... Тауке вёл активную внешнюю политику. Он руководил посольствами ещё в то время, когда правил его отец Жангир-хан».
- id: cқазақ-19
  text:
    ru: 'Ахмет Байтурсынулы (1873–1937 гг.) — известный учёный-языковед, поэт, просветитель, литературовед, переводчик, педагог и общественный деятель. … Один из авторов Каркаралинской петиции и создателей партии «Алаш» и правительства Алаш-Орда. А. Байтурсынулы многое сделал для формирования литературного казахского языка и реформирования арабской графики. После образования Казахской АССР в 1920–1921 годах был комиссаром народного просвещения. В 1922–1925 годах возглавлял научно-литературную комиссию Наркомата просвещения Казахской АССР. Наряду с государственной службой Байтурсынулы занимался и педагогической деятельностью: в 1921–1928 годах преподавал в институтах народного образования казахский язык и литературу, историю культуры. Он создал первый казахский алфавит, написал учебник «Тил-курал». А. Байтурсынулы был редактором газеты «Казах», которая издавалась реформированным арабским письмом (тоте жазу). В 1917 году разработал программу партии.'
- id: cқазақ-1
  text:
    ru: Образование Могулистана. Эмиры восточной части государства не сразу захватили верховную власть, а посадили на ханский престол потомка Чингисхана. Об этом более полные сведения приводит Мухаммед Хайдар Дулати. По традиции монгольских государств, на ханский престол мог садиться только потомок Чингисхана. Поэтому глава племени дулат, очень могущественный эмир Пуладчи, не решившись назвать себя ханом как самый влиятельный эмир восточных областей, посадил на престол потомка Чагатая Туглук-Тимура (1347–1363 годы). Туглук-Тимур основал династию правителей Могулистана.
- id: cimg-ig_2150
  caption:
    ru: Казахстан в годы индустриализации (карта)
- id: cқазақ-2
  text:
    ru: «Была введена в период гражданской войны и иностранной интервенции, в условиях крайней ограниченности материальных ресурсов страны. Её непосредственной задачей были централизация производства и распределения, сосредоточение и эффективное использование продовольствия, сырья и других ресурсов страны в интересах обороны государства. Были введены хлебная монополия и продразвёрстка, всеобщая трудовая повинность. Гражданская война и политика «военного коммунизма» привели сельское хозяйство в крайне тяжёлое положение. По сравнению с довоенным временем площадь пашни сократилась более чем вдвое, а объём собранного зерна — более чем втрое…»
  note: В исходнике опущено название политики (подлежащее) — перевод начинается со сказуемого.
- id: cқазақ-3
  text:
    ru: ОСВОЕНИЕ ЦЕЛИНЫ В феврале 1954 года на пост первого секретаря ЦК Компартии Казахстана был назначен никому в Казахстане не известный П. К. Пономаренко. Вопрос об освобождении Ж. Шаяхметова от должности решила в Кремле лишь небольшая группа. На самом деле Н. Хрущёв в этот период начал расставлять своих людей на разные места, а Ж. Шаяхметов не поддержал идею быстрого освоения целинных земель. По принятому советской властью постановлению «О дальнейшем увеличении производства зерна в стране, об освоении целинных и залежных земель» было принято решение о срочном увеличении посевов зерновых культур в северных районах Казахстана, в Сибири, на Урале и на Северном Кавказе. В 1954–1955 годах было распахано 13 гектаров земли, и в 1955 году планировалось получить с неё 1100–1200 млн пудов зерна. Численность населения Казахстана достигла 9 млн 295 тысяч человек.
  note: «13 гектар» — как в исходнике (вероятно, пропущено «млн»); проверить.
- id: cқазақ-4
  text:
    ru: КАЗАХСКИЕ ДЕПУТАТЫ, ИЗБРАННЫЕ В I И II ГОСУДАРСТВЕННЫЕ ДУМЫ. В 1-й Государственной думе России должны были участвовать 9 депутатов от Казахстана, в том числе 5 депутатов от казахского народа. Во II Государственную думу от Казахстана было избрано 14 депутатов, в том числе 7 — от казахского народа.
- id: cдоп-64789e2
  text:
    ru: Жусипбек Аймауытов (1889–1931) — казахский поэт, драматург, переводчик, литературовед и педагог; работал редактором газеты «Казак тили», сотрудником газеты «Акжол», директором Шымкентского педагогического техникума. Ж. Аймауытов написал множество сказок для детей и подростков, литературно-критических статей, научных трудов; он автор исследований «Психология», «Психология и искусствоведение». Он мастерски перевёл произведения А. С. Пушкина («Скупой рыцарь», «Каменный гость»), рассказы Н. В. Гоголя, Л. Н. Толстого, А. М. Горького, трагедии У. Шекспира.
- id: cқазақ-5
  text:
    ru: Контекст. В начале II века до н. э. усуни создали сильное государство. В борьбе с хунну они объединились с китайцами. В I веке до н. э. государство усуней разделилось на владения «малого гуньмо» и «большого гуньмо», и началась междоусобная война. В результате оба владения оказались под властью китайцев. Часть усуней ушла на запад и с помощью кангюев успешно воевала с китайскими правителями. Во II веке усуни полностью освободились от Китая. … Усуни и в V веке упоминаются как одно из государств, посылавших послов в Китай.
  note: Последняя фраза в исходнике оборвана («үйсінд»); смысл восстановлен.
- id: cқазақ-7
  text:
    ru: 'КОНТЕКСТ Основными очагами первых предприятий по переработке продуктов животноводства были Акмолинская и Семипалатинская области. По данным, собранным местными учреждениями, первые очаги таких промыслов возникли в Акмолинской области ещё в середине XIX века. В 1888 году в Семипалатинской области имелось 63 «завода»: 13 кожевенных, 9 мыловаренных, 1 салотопенный, 23 кирпичных и 4 других, на которых работало 262 рабочих; общая стоимость выпущенной продукции достигла 230 147 рублей… В 1890 году только на двух кирпичных заводах в Усть-Каменогорске объём производства составил 20 тысяч штук обожжённого и сырцового кирпича; кроме того, в Зайсане действовали 3 кожевенных и 1 дубильный завод, в Павлодаре — 2 салотопенных, 2 мыловаренных, 2 кирпичных завода; в Кокпекты, Семипалатинске, Павлодаре — 13 салотопенных и воскобойных, 23 кожевенных, 5 дубильных «заводов». С 80-х годов XIX века и в Сырдарьинской области начала набирать темпы перерабатывающая промышленность.'
  note: «сом» передано как «рублей»; опечатки OCR исправлены молча.
- id: cқазақ-8
  text:
    ru: КОНТЕКСТ Санжар Асфендияров (1889–1938 гг.) окончил реальное училище в городе Ташкенте. С. Асфендияров учился на стипендию Военно-морского министерства. Сначала в далёком Термезе, затем в Туркестанском полку был на фронте в качестве военного врача. Под Лодзью вместе с полком попал в немецкое окружение и был взят в плен. В начале 1916 года при обмене пленными вернулся на родину через Швецию. С 1919 года был народным комиссаром здравоохранения и земледелия Туркестанской республики, постоянным представителем Туркестанской республики в Москве. С. Асфендияров занимал ответственные должности в аппаратах Среднеазиатского бюро, ЦК Компартии Туркестана, Президиума ВЦИК. Был профессором Первого Московского государственного университета, наркомом здравоохранения Казахской ССР, заместителем председателя Казахской базы Академии наук СССР. Будучи врачом-профессионалом, увлёкся историей народа и стал её знатоком.
- id: cimg-ig_4555
  caption:
    ru: Задачи, стоящие перед независимым Казахстаном (схема)
- id: cқазақ-9
  text:
    ru: После того как Абулхаир-хан принял вхождение под власть России, его ожидания не оправдались. Поэтому до последнего дня своей жизни он старался не подчиняться царской администрации. Кроме того, напряжённые столкновения казахов с калмыками, башкирами и уральскими казаками в приграничной зоне не прекращались. Активные действия Абулхаира против царского правительства прекратились лишь после того, как он погиб от рук своих политических противников. Тевкелев с грамотой о принятии казахов под власть России прибывает в ставку Абулхаир-хана, расположенную на реке Иргиз. В октябре 1731 года 29 старшин во главе с Абулхаиром принесли присягу на вхождение под власть России. … Большая группа батыров и биев выступила против сторонников Абулхаира. Большинство народа понимало, что присяга на подданство России означает потерю независимости. Однако из-за разногласий между биями народ не оказал организованного сопротивления.
