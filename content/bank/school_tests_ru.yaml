  stem:
    ru: 'Родился в местности Сарытубек Тургайского уезда Тургайской области. Учился в аульной школе, там же овладел грамотой. В 1886–1891 годах учился в двухклассном русско-казахском училище в Тургае. В 1891 году поступил в Оренбургскую учительскую школу и окончил её в 1895 году. ... Работал учителем в школах и русско-казахских училищах Актюбинского, Костанайского, Каркаралинского уездов. В 1913 году стал редактором газеты «Казах», поднимал актуальные вопросы народной жизни, призывал народ к знаниям и просвещению. В 1911 году вышел сборник стихов «Маса» («Комар»). По приговору НКВД в декабре 1937 года расстрелян. Определите личность, описанную в тексте:'
