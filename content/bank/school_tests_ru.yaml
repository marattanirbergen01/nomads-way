- id: cқаңта-2
  text:
    ru: Абу Наср аль-Фараби родился в … году в городе Фараб. Астрономия, логика, теория музыки, математика, социология, этика, медицина, психология, философия и право — это далеко не полный перечень областей науки, которыми занимался аль-Фараби. Он собрал воедино и привёл в порядок весь смысл учения Аристотеля «Органон». Написал комментарии ко всем его книгам. Заслуги его были столь велики, что ему было присвоено звание … ... Фараби был учёным мирового уровня, сблизил и объединил достижения арабской, персидской, греческой, индийской и тюркской науки и культуры. Он систематизировал все знания своего времени. Всё это отразилось в его трактате «Слово о классификации наук». ... Размышляя о путях достижения счастья, аль-Фараби высказал суждение о возможности познания счастья. Его взгляды о природе человека, интеллектуальном и этическом совершенствовании, об идеале правителя изложены в трудах «Гражданская политика», «О достижении счастья».
  note: В исходнике пропущены год рождения и звание («Второй учитель») — оставлено многоточие.
