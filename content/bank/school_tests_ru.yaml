    ru: 'Определите верные утверждения о политической и общественной деятельности Алихана Бокейхана: I. В период советской власти к нему относились с недоверием, его общественную деятельность оценивали отрицательно и ограничивали; II. Основоположник казахского языкознания и литературоведения, реформатор национальной письменности; III. Поддерживал и был инициатором традиционного исламистского течения, широко распространённого в Бухаре и Туркестанском крае на казахской степи; IV. Выдвинув идею Алаш для объединения казахского народа, был одним из первых казахских демократов, поддерживавших европейский путь развития.'
