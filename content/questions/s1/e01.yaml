- id: q_s1e01_013
  fact: f.4.1.f
  format: context
  context: sc010
  difficulty: 1
  stem:
    kk: "1457 жылы Сығанақ түбінде Әбілқайыр ханның әскерін кім талқандады?"
    ru: "Кто разбил войско Абулхайр-хана под Сыгнаком в 1457 году?"
  options:
    - { id: a, kk: "Ойраттар", ru: "Ойраты", correct: true }
    - { id: b, kk: "Моғолстан әскері", ru: "Могулы" }
    - { id: c, kk: "Ноғайлар", ru: "Ногайцы" }
    - { id: d, kk: "Темір әулеті", ru: "Тимуриды" }
  explain:
    kk: "Ойраттар — батыс моңғол тайпалары, XV ғасырда Дешті Қыпшақтың шығысына жиі шабуыл жасады. 1457 жылғы жеңіліс Әбілқайырдың беделін түсіріп, ел қорғансыз қалды. Моғолдар мен ноғайлар — көршілер, бірақ бұл шайқасқа қатысы жоқ."
    ru: "Ойраты — западномонгольские племена, в XV веке они регулярно вторгались с востока в Дешт-и-Кипчак. Поражение 1457 года подорвало авторитет Абулхайра и оставило народ без защиты. Могулы и ногайцы — соседи, но к этой битве отношения не имеют."
  source: qazaqstan_tarihy_v2#гл.«Ханство Абулхайра»
  distractor_note: "Могулы — потому что Могулистан звучит в теме рядом; ногайцы и Тимуриды — соседи Абулхайра по западу и югу. Ловим «любой сосед-враг» вместо ойратов."

- id: q_s1e01_014
  fact: f.4.1.f
  format: single
  difficulty: 3
  stem:
    kk: "1457 жылғы Сығанақ түбіндегі жеңілістің Әбілқайыр хандығы үшін салдары қандай болды?"
    ru: "Каким было последствие поражения под Сыгнаком в 1457 году для ханства Абулхайра?"
  options:
    - { id: a, kk: "Хан беделі әлсіреп, қысымы күшейді — сұлтандар шығар жол іздей бастады", ru: "Авторитет хана ослаб, давление усилилось — султаны начали искать выход", correct: true }
    - { id: b, kk: "Ойраттар Дешті Қыпшақты түгел жаулап алды", ru: "Ойраты завоевали весь Дешт-и-Кипчак" }
    - { id: c, kk: "Әбілқайыр ордасын Моғолстанға көшірді", ru: "Абулхайр перенёс ставку в Могулистан" }
    - { id: d, kk: "Хан Есен-Бұғамен одақ жасасты", ru: "Хан заключил союз с Есен-Бугой" }
  explain:
    kk: "Ойраттар жаулап алуды мақсат етпеді — олжа алып, кетті. Бірақ жеңіліс ханның әлсіздігін көрсетті. Әбілқайыр билігін сақтау үшін сұлтандарға қысымды күшейтті, ал бұл керісінше Керей мен Жәнібектің көшуіне түрткі болды."
    ru: "Ойраты не ставили целью завоевание — взяли добычу и ушли. Но поражение показало слабость хана. Чтобы удержать власть, Абулхайр усилил давление на султанов, а это, наоборот, подтолкнуло Керея и Жанибека к откочёвке."
  source: qazaqstan_tarihy_v2#гл.«Ханство Абулхайра»
  distractor_note: "Вопрос на причинно-следственную связь. «Завоевали» — преувеличение набега; «союз с Есен-Бугой» — Есен-Буга был противником Абулхайра, а не союзником."

- id: q_s1e01_015
  fact: f.4.1.e
  format: context
  context: sc010
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібек Әбілқайыр хандығынан неліктен кетті?"
    ru: "Почему Керей и Жанибек ушли из ханства Абулхайра?"
  options:
    - { id: a, kk: "Әбілқайыр өзі оларға Жетісуды сыйға берді", ru: "Абулхайр сам пожаловал им Жетысу" }
    - { id: b, kk: "Әбілқайырдың қысымынан құтылып, өз билігін орнатқысы келді", ru: "Хотели уйти из-под давления Абулхайра и установить собственную власть", correct: true }
    - { id: c, kk: "Ойраттар оларды Дешті Қыпшақтан қуып шықты", ru: "Ойраты изгнали их из Дешт-и-Кипчака" }
    - { id: d, kk: "Есен-Бұға оларды күшпен Моғолстанға әкетті", ru: "Есен-Буга силой увёл их в Могулистан" }
  explain:
    kk: "Бұл — ерікті көшу. Әбілқайыр Дешті Қыпшақты қатаң биледі, ал 1457 жылғы жеңілістен кейін қысымы одан әрі күшейді. Керей мен Жәнібек — Орыс хан ұрпағы, билікке құқығы бар сұлтандар — өз елін бөлек әкетуді жөн көрді."
    ru: "Это была добровольная откочёвка. Абулхайр правил Дешт-и-Кипчаком жёстко, а после поражения 1457 года давление ещё усилилось. Керей и Жанибек — потомки Урус-хана с законным правом на власть — предпочли увести свой народ отдельно."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Ловим подмену «ушли сами» на «были изгнаны / уведены / пожалованы». Ойраты и Есен-Буга — реальные участники темы, но не причина откочёвки."

- id: q_s1e01_016
  fact: f.4.1.b
  format: single
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібек Шыңғыс ханның қай ұлының ұрпағы?"
    ru: "Потомками какого сына Чингисхана были Керей и Жанибек?"
  options:
    - { id: a, kk: "Жошы", ru: "Жошы", correct: true }
    - { id: b, kk: "Шағатай", ru: "Чагатая" }
    - { id: c, kk: "Үгедей", ru: "Угедея" }
    - { id: d, kk: "Төле", ru: "Толуя" }
  explain:
    kk: "Керей мен Жәнібек — Жошы ұлысының ханы Орыс ханның ұрпағы. Әбілқайыр да Жошы ұрпағы (Шибан тармағы), сондықтан олардың билікке құқығы одан кем емес еді. Моғолстан хандары — Есен-Бұға да — Шағатай әулетінен."
    ru: "Керей и Жанибек — потомки Урус-хана, правителя из Улуса Жошы. Абулхайр тоже Жошид (по линии Шибана), поэтому их право на власть было не меньше его. Ханы Могулистана, в том числе Есен-Буга, — Чагатаиды."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Чагатай — линия ханов Могулистана, к которым султаны пришли; типичная подмена. Угедей и Толуй — другие ветви Чингизидов, не связанные с Дешт-и-Кипчаком."

- id: q_s1e01_017
  fact: f.4.1.a
  format: context
  context: sc030
  difficulty: 1
  stem:
    kk: "1465 жылы қандай оқиға болды?"
    ru: "Какое событие произошло в 1465 году?"
  options:
    - { id: a, kk: "Әбілқайыр Сығанақ түбінде ойраттардан жеңілді", ru: "Абулхайр потерпел поражение от ойратов под Сыгнаком" }
    - { id: b, kk: "Керей мен Жәнібек Шу бойына орнығып, Қазақ хандығы құрылды", ru: "Керей и Жанибек обосновались на Шу — образовано Казахское ханство", correct: true }
    - { id: c, kk: "Әбілқайыр Керей мен Жәнібекке қарсы жорықта қаза тапты", ru: "Абулхайр умер в походе против Керея и Жанибека" }
    - { id: d, kk: "Бұрындық хан таққа отырды", ru: "Бурундук стал ханом" }
  explain:
    kk: "1465 — көштің Шу мен Қозыбасы алқабына жетіп, Есен-Бұғадан жер алған жылы; тарихшылар осы жылды хандықтың құрылған жылы деп санайды. Сығанақ түбіндегі жеңіліс — 1457, Әбілқайырдың қазасы — 1468, Бұрындықтың билігі — 1480 жылдан."
    ru: "1465 — год, когда кочевье дошло до долин Шу и Козыбасы и получило земли от Есен-Буги; историки считают его годом образования ханства. Поражение под Сыгнаком — 1457, смерть Абулхайра — 1468, правление Бурундука — с 1480."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Зеркало q_s1e01_005: там от события к году, здесь от года к событию. Все варианты — реальные события темы со сдвигом дат."

- id: q_s1e01_018
  fact: f.4.1.a
  format: single
  difficulty: 1
  stem:
    kk: "Қазақ хандығы қай ғасырда құрылды?"
    ru: "В каком веке образовалось Казахское ханство?"
  options:
    - { id: a, kk: "XIV ғасырда", ru: "В XIV веке" }
    - { id: b, kk: "XV ғасырда", ru: "В XV веке", correct: true }
    - { id: c, kk: "XVI ғасырда", ru: "В XVI веке" }
    - { id: d, kk: "XVII ғасырда", ru: "В XVII веке" }
  explain:
    kk: "Хандық 1465 жылы құрылды — бұл XV ғасырдың екінші жартысы. XIV ғасыр — Орыс хан мен Ақ Орда дәуірі, XVI ғасыр — Қасым хан және «Тарих-и Рашидидің» жазылған кезеңі. Жылды ғасырға аударғанда 1465 → XV екенін ұмытпау керек."
    ru: "Ханство образовано в 1465 году — это вторая половина XV века. XIV век — время Урус-хана и Ак Орды, XVI век — Касым-хан и написание «Тарих-и Рашиди». При переводе года в век помним: 1465 → XV, а не XIV."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Классическая ошибка перевода года в век: 1465 → «четырнадцатый». XVI — век источника (Дулати), путается с веком события."

- id: q_s1e01_019
  fact: f.4.1.c
  format: single
  difficulty: 2
  stem:
    kk: "Шу мен Қозыбасы алқабы қай тарихи-географиялық аймаққа жатады?"
    ru: "К какому историко-географическому региону относятся долины Шу и Козыбасы?"
  options:
    - { id: a, kk: "Сырдария бойы", ru: "Присырдарья" }
    - { id: b, kk: "Батыс Жетісу", ru: "Западное Жетысу", correct: true }
    - { id: c, kk: "Сарыарқа", ru: "Сарыарка" }
    - { id: d, kk: "Маңғыстау", ru: "Мангыстау" }
  explain:
    kk: "Шу мен Қозыбасы — Батыс Жетісу, ол кезде Моғолстанның батыс шеті. Дәл шекарада болғандықтан Есен-Бұға бұл жерді сұлтандарға берді: олар оған Әбілқайырдан қалқан болды. Сырдария бойы — Сығанақ пен Әбілқайырдың орталығы."
    ru: "Шу и Козыбасы — Западное Жетысу, тогда западная окраина Могулистана. Именно потому что это пограничье, Есен-Буга отдал его султанам: они стали его щитом от Абулхайра. Присырдарья — Сыгнак и центр владений Абулхайра."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Присырдарья — регион, ОТКУДА ушли. Сарыарка и Мангыстау — крупные регионы Казахстана, которые называют «наугад», не зная карты."

- id: q_s1e01_020
  fact: f.4.1.c
  format: context
  context: sc030
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібектің көші 1465 жылы қай өзеннің алқабына жетті?"
    ru: "В долину какой реки пришло кочевье Керея и Жанибека в 1465 году?"
  options:
    - { id: a, kk: "Сырдария", ru: "Сырдарьи" }
    - { id: b, kk: "Шу", ru: "Шу", correct: true }
    - { id: c, kk: "Іле", ru: "Или" }
    - { id: d, kk: "Ертіс", ru: "Иртыша" }
  explain:
    kk: "Көш Шу өзені мен Қозыбасы алқабына орнықты — бұл Батыс Жетісу. Іле — Жетісудың орталығы, бірақ ол Моғолстанның ішкі жері, шекара емес. Сырдария — Әбілқайырдың орталығы, олар одан кетті. Ертіс — Дешті Қыпшақтың шығысы."
    ru: "Кочевье встало в долине реки Шу и урочища Козыбасы — это Западное Жетысу. Или — центр Жетысу, но это внутренние земли Могулистана, не граница. Сырдарья — центр Абулхайра, оттуда они ушли. Иртыш — восток Дешт-и-Кипчака."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Или — «тоже Жетысу», самая частая подмена. Сырдарья — путаница откуда/куда."

- id: q_s1e01_021
  fact: f.4.1.d
  format: context
  context: sc030
  difficulty: 1
  stem:
    kk: "Есен-Бұға қай мемлекеттің ханы болды?"
    ru: "Ханом какого государства был Есен-Буга?"
  options:
    - { id: a, kk: "Моғолстан", ru: "Могулистана", correct: true }
    - { id: b, kk: "Көшпелі өзбектер мемлекеті", ru: "Государства кочевых узбеков" }
    - { id: c, kk: "Ноғай Ордасы", ru: "Ногайской Орды" }
    - { id: d, kk: "Ақ Орда", ru: "Ак Орды" }
  explain:
    kk: "Есен-Бұға — Моғолстан ханы, Шағатай әулетінен. Керей мен Жәнібек дәл соған келді, ол оларға Батыс Жетісудан жер берді. Көшпелі өзбектер мемлекеті — Әбілқайырдікі, олар одан кетті."
    ru: "Есен-Буга — хан Могулистана, Чагатаид. Именно к нему пришли Керей и Жанибек, и он выделил им земли в Западном Жетысу. Государство кочевых узбеков — это Абулхайр, откуда они ушли."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Зеркало q_s1e01_011: там государство Абулхайра, здесь — Есен-Буги. Ловим путаницу двух ханов и двух государств."

- id: q_s1e01_022
  fact: f.4.1.i
  format: single
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібекпен бірге кеткен халықты әуелі қалай атады?"
    ru: "Как первоначально называли людей, ушедших с Кереем и Жанибеком?"
  options:
    - { id: a, kk: "Өзбек-қазақтар", ru: "Узбек-казаки", correct: true }
    - { id: b, kk: "Моғол-қазақтар", ru: "Могул-казаки" }
    - { id: c, kk: "Ноғай-қазақтар", ru: "Ногай-казаки" }
    - { id: d, kk: "Қырғыз-қазақтар", ru: "Киргиз-казаки" }
  explain:
    kk: "Әбілқайыр мемлекетінің халқын «өзбек» деп атаған, сондықтан одан бөлініп кеткендер әуелі «өзбек-қазақ» атанды — «өзбектерден бөлінген еріктілер». Уақыт өте «өзбек» бөлігі түсіп қалып, «қазақ» халық атауына айналды."
    ru: "Население государства Абулхайра называли «узбеками», поэтому отделившихся от него сначала звали «узбек-казаками» — «вольными из узбеков». Со временем часть «узбек» отпала, и «казак» стало названием народа."
  source: qazaqstan_tarihy_v2#гл.«Этноним казак»
  distractor_note: "«Могул-казаки» — потому что ушли в Могулистан. «Киргиз-казаки» — так называли казахов в русских документах XVIII–XIX вв., это другая эпоха."

- id: q_s1e01_023
  fact: f.4.1.i
  format: context
  context: sc040
  difficulty: 3
  stem:
    kk: "Керей мен Жәнібекпен кеткендерді неліктен «қазақ» деп атады?"
    ru: "Почему ушедших с Кереем и Жанибеком стали называть «казаками»?"
  options:
    - { id: a, kk: "Олар өз ханынан бөлініп, ерікті адамдар болғандықтан", ru: "Потому что они отделились от своего хана и стали вольными людьми", correct: true }
    - { id: b, kk: "Жетісуда бұрыннан «қазақ» деген тайпа тұрғандықтан", ru: "Потому что в Жетысу издавна жило племя «казак»" }
    - { id: c, kk: "Есен-Бұға оларға осы атауды бергендіктен", ru: "Потому что это имя дал им Есен-Буга" }
    - { id: d, kk: "Олар Дешті Қыпшақтың ең үлкен руы болғандықтан", ru: "Потому что они были самым большим родом Дешт-и-Кипчака" }
  explain:
    kk: "«Қазақ» — сол дәуірде этноним емес, әлеуметтік атау: билеушісінен бөлініп, еркін жүрген адам. Керей мен Жәнібектің елі дәл осылай — Әбілқайырдан бөлініп — кетті, сондықтан атау оларға жабысты. Кейін ол тайпа емес, тұтас халықтың атына айналды."
    ru: "«Казак» в ту эпоху — не этноним, а социальный термин: человек, отделившийся от правителя и живущий вольно. Народ Керея и Жанибека ушёл именно так — отделившись от Абулхайра, — поэтому название закрепилось за ними. Позже оно стало именем всего народа."
  source: qazaqstan_tarihy_v2#гл.«Этноним казак»
  distractor_note: "«Племя казак» и «самый большой род» — самое частое заблуждение: слово изначально означало статус, а не род. «Дар Есен-Буги» — для тех, кто ищет внешнее происхождение имени."

- id: q_s1e01_024
  fact: f.4.1.g
  format: single
  difficulty: 1
  stem:
    kk: "Әбілқайыр хан қай жылы қайтыс болды?"
    ru: "В каком году умер Абулхайр-хан?"
  options:
    - { id: a, kk: "1457", ru: "1457" }
    - { id: b, kk: "1465", ru: "1465" }
    - { id: c, kk: "1468", ru: "1468", correct: true }
    - { id: d, kk: "1480", ru: "1480" }
  explain:
    kk: "Әбілқайыр 1468 жылы Керей мен Жәнібекке қарсы жорыққа шығып, жолда қайтыс болды. Осыдан кейін мемлекеті ыдырады. 1457 — Сығанақ түбіндегі жеңілісі, 1465 — хандықтың құрылуы, 1480 — Бұрындықтың билігінің басы."
    ru: "Абулхайр умер в 1468 году, выступив в поход против Керея и Жанибека. После этого его государство распалось. 1457 — его поражение под Сыгнаком, 1465 — образование ханства, 1480 — начало правления Бурундука."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Три соседние даты темы. Особенно путают 1465 и 1468: «ханство образовалось, когда умер Абулхайр» — нет, за три года до."

- id: q_s1e01_025
  fact: f.4.1.g
  format: context
  context: sc040
  difficulty: 3
  stem:
    kk: "Әбілқайырдың 1468 жылғы қазасының Қазақ хандығы үшін маңызы неде?"
    ru: "В чём значение смерти Абулхайра в 1468 году для Казахского ханства?"
  options:
    - { id: a, kk: "Оның мемлекеті ыдырап, рулар жаппай қазақ хандарына өтті", ru: "Его государство распалось, и роды массово перешли к казахским ханам", correct: true }
    - { id: b, kk: "Ойраттар Дешті Қыпшақты басып алып, хандыққа қауіп төндірді", ru: "Ойраты захватили Дешт-и-Кипчак и стали угрозой ханству" }
    - { id: c, kk: "Моғолстан Жетісуды сұлтандардан қайтарып алды", ru: "Могулистан вернул Жетысу у султанов" }
    - { id: d, kk: "Билік Әбілқайырдың ұлына өтіп, мемлекет күшейе түсті", ru: "Власть перешла к сыну Абулхайра, и государство усилилось" }
  explain:
    kk: "Әбілқайырдың мемлекеті оның жеке беделіне сүйенді. Ол қайтыс болғанда бірлік ыдырап, Дешті Қыпшақ рулары Жетісуға — Керей мен Жәнібекке — ағылды. Жас хандық осылайша адаммен де, жермен де толықты. Бұл — оның нығаюының басты түрткісі."
    ru: "Государство Абулхайра держалось на его личном авторитете. Когда он умер, единство распалось, и роды Дешт-и-Кипчака потянулись в Жетысу — к Керею и Жанибеку. Так молодое ханство пополнилось и людьми, и землёй. Это главный толчок к его усилению."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Вопрос на следствие. «Сын усилил государство» — противоположность реальности; «ойраты захватили» и «Могулистан вернул» — выдуманные внешние угрозы вместо внутреннего распада."

- id: q_s1e01_026
  fact: f.4.1.h
  format: single
  difficulty: 2
  stem:
    kk: "«Тарих-и Рашиди» еңбегінің авторы кім?"
    ru: "Кто автор труда «Тарих-и Рашиди»?"
  options:
    - { id: a, kk: "Мұхаммед Хайдар Дулати", ru: "Мухаммад Хайдар Дулати", correct: true }
    - { id: b, kk: "Рашид ад-Дин", ru: "Рашид ад-Дин" }
    - { id: c, kk: "Қадырғали Жалайыри", ru: "Кадыргали Жалаири" }
    - { id: d, kk: "Әбілғазы", ru: "Абулгази" }
  explain:
    kk: "«Тарих-и Рашиди» — XVI ғасырда Мұхаммед Хайдар Дулати жазған еңбек, Керей мен Жәнібектің көшуі туралы негізгі дерек. Атаудағы «Рашиди» — автордың есімі емес. Рашид ад-Дин — басқа автор, XIV ғасырдағы парсы тарихшысы."
    ru: "«Тарих-и Рашиди» написал Мухаммад Хайдар Дулати в XVI веке — это главный источник об откочёвке Керея и Жанибека. «Рашиди» в названии — не имя автора. Рашид ад-Дин — другой историк, персидский, XIV века."
  source: dulati_tarikh_i_rashidi#предисловие
  distractor_note: "Рашид ад-Дин — ловушка по созвучию с названием. Жалаири и Абулгази — тюркские авторы XVII века, встречаются в ЕНТ по соседним темам."

- id: q_s1e01_027
  fact: f.4.1.h
  format: context
  context: sc040
  difficulty: 2
  stem:
    kk: "«Тарих-и Рашиди» қай ғасырда жазылды?"
    ru: "В каком веке был написан «Тарих-и Рашиди»?"
  options:
    - { id: a, kk: "XIV ғасырда", ru: "В XIV веке" }
    - { id: b, kk: "XV ғасырда", ru: "В XV веке" }
    - { id: c, kk: "XVI ғасырда", ru: "В XVI веке", correct: true }
    - { id: d, kk: "XVII ғасырда", ru: "В XVII веке" }
  explain:
    kk: "Дулати еңбегін XVI ғасырдың ортасында жазды — хандық құрылғаннан кейін шамамен 80 жыл өткенде. Яғни бұл оқиғаның куәгері емес, кейінгі ұрпақтың жазбасы. Дегенмен ол — көшуді ең толық сипаттаған дерек, сондықтан негізгі саналады."
    ru: "Дулати написал свой труд в середине XVI века — примерно через 80 лет после образования ханства. То есть это не свидетельство очевидца, а запись следующего поколения. Тем не менее это самое подробное описание откочёвки, поэтому источник считается основным."
  source: dulati_tarikh_i_rashidi#предисловие
  distractor_note: "XV — век самих событий, главная путаница: источник написан позже, чем произошло описанное. XVII — век Жалаири и Абулгази из q_s1e01_010."
