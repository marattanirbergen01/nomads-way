# Вопросы серии s1e01. Формат — docs/CONTENT_FORMAT.md.
# distractor_note — какую типичную ошибку ловят неправильные варианты. Это обязательное поле.

- id: q_s1e01_001
  fact: f.4.1.f
  format: single
  difficulty: 2
  stem:
    kk: "Әбілқайыр хан Сығанақ түбінде ойраттардан қай жылы жеңілді?"
    ru: "В каком году Абулхайр-хан потерпел поражение от ойратов под Сыгнаком?"
  options:
    - { id: a, kk: "1428", ru: "1428" }
    - { id: b, kk: "1457", ru: "1457", correct: true }
    - { id: c, kk: "1465", ru: "1465" }
    - { id: d, kk: "1468", ru: "1468" }
  explain:
    kk: "1457 жылы Әбілқайыр ойраттардан жеңіліп, беделі әлсіреді. Осыдан кейін оның қысымы күшейіп, сұлтандардың көшуіне себеп болды. 1465 — хандықтың құрылуы, 1468 — Әбілқайырдың қазасы."
    ru: "В 1457 году Абулхайр был разбит ойратами, и его авторитет пошатнулся. После этого его давление на султанов усилилось — это одна из причин откочёвки. 1465 — образование ханства, 1468 — смерть Абулхайра."
  source: qazaqstan_tarihy_v2#гл.«Ханство Абулхайра»
  distractor_note: "1465 и 1468 — соседние ключевые даты темы, их путают между собой. 1428 — начало правления Абулхайра."

- id: q_s1e01_002
  fact: f.4.1.e
  format: context
  context: sc010
  difficulty: 1
  stem:
    kk: "Керей мен Жәнібек қай билеушіден бөлініп кетті?"
    ru: "От какого правителя откочевали Керей и Жанибек?"
  options:
    - { id: a, kk: "Есен-Бұға", ru: "Есен-Буга" }
    - { id: b, kk: "Әбілқайыр", ru: "Абулхайр", correct: true }
    - { id: c, kk: "Орыс хан", ru: "Урус-хан" }
    - { id: d, kk: "Тоқтамыс", ru: "Тохтамыш" }
  explain:
    kk: "Сұлтандар Әбілқайыр хандығынан (Көшпелі өзбектер мемлекеті) кетті. Есен-Бұға — оларды ҚАБЫЛДАҒАН хан, Орыс хан — олардың АТАСЫ."
    ru: "Султаны ушли из ханства Абулхайра (Государства кочевых узбеков). Есен-Буга — тот, кто их ПРИНЯЛ; Урус-хан — их ПРЕДОК."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Главная путаница темы: «от кого ушли» (Абулхайр) vs «к кому пришли» (Есен-Буга). Урус-хан — предок, не современник."

- id: q_s1e01_003
  fact: f.4.1.b
  format: single
  difficulty: 1
  stem:
    kk: "Қазақ хандығының негізін қалаушылар кім?"
    ru: "Кто считается основателями Казахского ханства?"
  options:
    - { id: a, kk: "Керей мен Жәнібек", ru: "Керей и Жанибек", correct: true }
    - { id: b, kk: "Бұрындық пен Қасым", ru: "Бурундук и Касым" }
    - { id: c, kk: "Әбілқайыр мен Есен-Бұға", ru: "Абулхайр и Есен-Буга" }
    - { id: d, kk: "Тәуке мен Абылай", ru: "Тауке и Абылай" }
  explain:
    kk: "Керей мен Жәнібек — 1465 жылы хандықтың негізін қалаған сұлтандар. Бұрындық пен Қасым — олардың ұлдары, кейінгі хандар. Тәуке мен Абылай — XVII–XVIII ғасырлар."
    ru: "Керей и Жанибек — султаны, основавшие ханство в 1465 году. Бурундук и Касым — их сыновья, следующее поколение ханов. Тауке и Абылай — XVII–XVIII века."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Бурундук и Касым — следующее поколение, частая подмена. Абулхайр + Есен-Буга — два хана, между которыми происходила откочёвка."

- id: q_s1e01_004
  fact: f.4.1.b
  format: context
  context: sc020
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібек қай ханның ұрпағы болды?"
    ru: "Потомками какого хана были Керей и Жанибек?"
  options:
    - { id: a, kk: "Әбілқайыр", ru: "Абулхайра" }
    - { id: b, kk: "Орыс хан", ru: "Урус-хана", correct: true }
    - { id: c, kk: "Есен-Бұға", ru: "Есен-Буги" }
    - { id: d, kk: "Әмір Темір", ru: "Эмира Тимура" }
  explain:
    kk: "Керей мен Жәнібек — Ақ Орда ханы Орыс ханның ұрпағы, Жошы әулетінен. Сондықтан билікке заңды құқығы болды."
    ru: "Керей и Жанибек — потомки Урус-хана, правителя Ак Орды, из рода Жошы. Именно это давало им законное право на власть."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Абулхайр и Есен-Буга — современники, не предки. Тимур — не Жошид вообще."

- id: q_s1e01_005
  fact: f.4.1.a
  format: single
  difficulty: 1
  stem:
    kk: "Қазақ хандығы қай жылы құрылды?"
    ru: "В каком году образовалось Казахское ханство?"
  options:
    - { id: a, kk: "1457", ru: "1457" }
    - { id: b, kk: "1465", ru: "1465", correct: true }
    - { id: c, kk: "1468", ru: "1468" }
    - { id: d, kk: "1511", ru: "1511" }
  explain:
    kk: "1465 жыл — Керей мен Жәнібектің Шу бойына келіп орнығуы. Дулати «Тарих-и Рашидиде» 870 хижра жылын көрсетеді (1465–1466). 1457 — Сығанақ түбіндегі жеңіліс, 1468 — Әбілқайырдың қазасы, 1511 — Қасым ханның билікке келуі."
    ru: "1465 год — Керей и Жанибек обосновались в долине Шу. Дулати в «Тарих-и Рашиди» называет 870 год хиджры (1465–1466). 1457 — поражение под Сыгнаком, 1468 — смерть Абулхайра, 1511 — начало правления Касыма."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Все четыре — реальные даты темы. Ловим смешение соседних событий."

- id: q_s1e01_006
  fact: f.4.1.c
  format: context
  context: sc030
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібектің көші қай жерге орналасты?"
    ru: "В какой местности обосновалось кочевье Керея и Жанибека?"
  options:
    - { id: a, kk: "Сырдария бойы, Сығанақ маңы", ru: "На Сырдарье, у Сыгнака" }
    - { id: b, kk: "Шу мен Қозыбасы алқабы", ru: "В долинах Шу и Козыбасы", correct: true }
    - { id: c, kk: "Ертіс пен Есіл бойы", ru: "На Иртыше и Есиле" }
    - { id: d, kk: "Жайық пен Еділ аралығы", ru: "Между Жайыком и Едилем" }
  explain:
    kk: "Шу мен Қозыбасы — Батыс Жетісу, Моғолстанның батыс шекарасы. Дәл осы жерді Есен-Бұға берді. Сығанақ — керісінше, Әбілқайырдың орталығы, олар одан кетті."
    ru: "Шу и Козыбасы — Западное Жетысу, западная окраина Могулистана. Именно эти земли дал Есен-Буга. Сыгнак, наоборот, центр владений Абулхайра — оттуда они ушли."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Сыгнак — место, ОТКУДА ушли, звучит в теме и путается с местом, КУДА пришли."

- id: q_s1e01_007
  fact: f.4.1.d
  format: single
  difficulty: 1
  stem:
    kk: "Керей мен Жәнібекке жер берген Моғолстан ханы кім?"
    ru: "Какой хан Могулистана предоставил земли Керею и Жанибеку?"
  options:
    - { id: a, kk: "Әбілқайыр", ru: "Абулхайр" }
    - { id: b, kk: "Есен-Бұға", ru: "Есен-Буга", correct: true }
    - { id: c, kk: "Мұхаммед Шайбани", ru: "Мухаммед Шайбани" }
    - { id: d, kk: "Жүніс", ru: "Жунус" }
  explain:
    kk: "Есен-Бұға Моғолстан ханы болды және Әбілқайырға қарсы одақтас іздеді. Жүніс — оның ағасы, билік үшін бақталасы. Шайбани — Әбілқайырдың немересі."
    ru: "Есен-Буга правил Могулистаном и искал союзников против Абулхайра. Жунус — его брат и соперник за трон. Шайбани — внук Абулхайра."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Жунус — тоже хан Могулистана, но соперник Есен-Буги: проверяем точность, а не «любого могульского хана»."

- id: q_s1e01_008
  fact: f.4.1.g
  format: context
  context: sc040
  difficulty: 2
  stem:
    kk: "1468 жылы қандай оқиға болды?"
    ru: "Что произошло в 1468 году?"
  options:
    - { id: a, kk: "Қазақ хандығы құрылды", ru: "Образовано Казахское ханство" }
    - { id: b, kk: "Әбілқайыр қазақтарға қарсы жорықта қаза тапты", ru: "Абулхайр умер во время похода против казахов", correct: true }
    - { id: c, kk: "Сығанақ түбіндегі шайқас", ru: "Битва под Сыгнаком" }
    - { id: d, kk: "Қасым хан таққа отырды", ru: "Касым стал ханом" }
  explain:
    kk: "1468 жылы Әбілқайыр Керей мен Жәнібекке қарсы жорыққа шығып, жолда қайтыс болды. Оның мемлекеті ыдырап, рулар жаппай қазақ хандарына өтті — хандықтың нығаюына түрткі болған оқиға."
    ru: "В 1468 году Абулхайр выступил против Керея и Жанибека и умер в пути. Его государство распалось, роды массово перешли к казахским ханам — это событие резко усилило молодое ханство."
  source: qazaqstan_tarihy_v2#гл.«Образование Казахского ханства»
  distractor_note: "Три другие даты темы, сдвинутые на 1468. Ловим привязку событий к годам."

- id: q_s1e01_009
  fact: f.4.1.i
  format: single
  difficulty: 2
  stem:
    kk: "XV ғасырда «қазақ» сөзі қандай мағына берді?"
    ru: "Что означало слово «казак» в XV веке?"
  options:
    - { id: a, kk: "Жалдамалы жауынгер", ru: "Воин-наёмник" }
    - { id: b, kk: "Ерікті, бөлініп шыққан адам", ru: "Вольный, отделившийся человек", correct: true }
    - { id: c, kk: "Ұлыс билеушісі", ru: "Правитель улуса" }
    - { id: d, kk: "Мал бағатын көшпелі", ru: "Кочевник-скотовод" }
  explain:
    kk: "«Қазақ» — өз билеушісінен бөлініп, еркін жүрген адам. Керей мен Жәнібекпен кеткендерді әуелі «өзбек-қазақ», кейін жай «қазақ» деп атады — атау осылай халық атына айналды."
    ru: "«Казак» — человек, отделившийся от своего правителя и живущий вольно. Ушедших с Кереем и Жанибеком сначала называли «узбек-казаками», потом просто «казаками» — так термин стал названием народа."
  source: qazaqstan_tarihy_v2#гл.«Этноним казак»
  distractor_note: "«Кочевник» — самый соблазнительный неверный ответ: все казаки были кочевниками, но слово значило не это."

- id: q_s1e01_010
  fact: f.4.1.h
  format: context
  context: sc040
  difficulty: 2
  stem:
    kk: "Қазақ хандығының құрылуы туралы негізгі жазба дерек:"
    ru: "Основной письменный источник об образовании Казахского ханства:"
  options:
    - { id: a, kk: "«Тарих-и Рашиди», Мұхаммед Хайдар Дулати", ru: "«Тарих-и Рашиди» Мухаммада Хайдара Дулати", correct: true }
    - { id: b, kk: "«Жами ат-тауарих», Қадырғали Жалайыри", ru: "«Жами ат-таварих» Кадыргали Жалаири" }
    - { id: c, kk: "«Бабыр-нама», Захир ад-дин Бабыр", ru: "«Бабур-наме» Захир ад-дина Бабура" }
    - { id: d, kk: "«Шежіре-и түрк», Әбілғазы", ru: "«Шежире-и тюрк» Абулгази" }
  explain:
    kk: "Дулати XVI ғасырда өз еңбегінде Керей мен Жәнібектің көшуін, Есен-Бұғаның жер беруін және 870 хижра жылын тікелей жазған. Басқа авторлар — кейінгі немесе басқа тақырыпта."
    ru: "Дулати в XVI веке прямо описал откочёвку Керея и Жанибека, дар Есен-Буги и назвал 870 год хиджры. Остальные авторы — либо позже, либо о другом."
  source: dulati_tarikh_i_rashidi#предисловие
  distractor_note: "Все четыре — реальные тюркские/персоязычные источники, встречаются в ЕНТ. Проверяем привязку источника к событию."

- id: q_s1e01_011
  fact: f.4.1.e
  format: single
  difficulty: 2
  stem:
    kk: "Керей мен Жәнібек кеткен Әбілқайыр мемлекеті қалай аталды?"
    ru: "Как называлось государство Абулхайра, из которого ушли Керей и Жанибек?"
  options:
    - { id: a, kk: "Моғолстан", ru: "Могулистан" }
    - { id: b, kk: "Көшпелі өзбектер мемлекеті (Әбілқайыр хандығы)", ru: "Государство кочевых узбеков (ханство Абулхайра)", correct: true }
    - { id: c, kk: "Ноғай Ордасы", ru: "Ногайская Орда" }
    - { id: d, kk: "Ақ Орда", ru: "Ак Орда" }
  explain:
    kk: "Әбілқайыр 1428 жылдан Дешті Қыпшақта Көшпелі өзбектер мемлекетін биледі. Моғолстан — керісінше, олар КЕЛГЕН мемлекет. Ақ Орда — Орыс ханның бұрынғы мемлекеті, XV ғасырдың басында әлсіреген."
    ru: "Абулхайр с 1428 года правил Государством кочевых узбеков в Дешт-и-Кипчаке. Могулистан — наоборот, государство, КУДА они пришли. Ак Орда — прежнее государство Урус-хана, ослабевшее к началу XV века."
  source: qazaqstan_tarihy_v2#гл.«Ханство Абулхайра»
  distractor_note: "Могулистан — снова путаница «откуда/куда». Ак Орда — предшественник, к 1450-м уже не существовала как сила."

- id: q_s1e01_012
  fact: f.4.1.d
  format: context
  context: sc030
  difficulty: 3
  stem:
    kk: "Есен-Бұға көшіп келген сұлтандарды неге қабылдады?"
    ru: "Почему Есен-Буга принял откочевавших султанов?"
  options:
    - { id: a, kk: "Әбілқайырмен құдандалы болғысы келді", ru: "Хотел породниться с Абулхайром" }
    - { id: b, kk: "Батыс шекараға қалқан және Әбілқайырға қарсы одақтас керек болды", ru: "Ему нужен был щит на западной границе и союзник против Абулхайра", correct: true }
    - { id: c, kk: "Оларды Қашқарға қоныстандыру үшін", ru: "Чтобы переселить их в Кашгар" }
    - { id: d, kk: "Темір әулетінің талабы бойынша", ru: "По требованию Тимуридов" }
  explain:
    kk: "Есен-Бұғаның жағдайы қиын еді: батыста Әбілқайыр, ішінде — ағасы Жүніспен тақ таласы. Күшті сұлтандардың келуі оған қорғаныс та, одақтас та берді. Бұл — саяси есеп, мейірімділік емес."
    ru: "Положение Есен-Буги было шатким: на западе — Абулхайр, внутри — борьба за трон с братом Жунусом. Приход сильных султанов давал ему и щит, и союзника. Это политический расчёт, а не милосердие."
  source: dulati_tarikh_i_rashidi#гл.об откочёвке
  distractor_note: "Вопрос на причину, не на факт. Ловим тех, кто помнит имя, но не понимает мотив."
