# Вопросы серии s1e02. Формат — docs/CONTENT_FORMAT.md. Создано студией.

- id: q_s1e02_001
  fact: f.4.2.a
  format: single
  difficulty: 2
  stem:
    kk: "Керейдің ұлы, қазақтың екінші ханы:"
    ru: "Сын Керея и второй казахский хан:"
  options:
    - { id: "a", kk: "Жәнібек", ru: "Жанибек" }
    - { id: "b", kk: "Бұрындық", ru: "Бурундук", correct: true }
    - { id: "c", kk: "Қасым", ru: "Касым" }
    - { id: "d", kk: "Хақназар", ru: "Хакназар" }
  explain:
    kk: Бұрындық — Керейдің ұлы, ол әкесінен кейін хан болды. Жәнібек — Керейдің серігі, хандықтың негізін бірге қалаған. Қасым — Жәнібектің ұлы, Бұрындықтан кейінгі хан.
    ru: Бурундук — сын Керея, он стал ханом после отца. Жанибек — соратник Керея и сооснователь ханства. Касым — сын Жанибека, хан после Бурундука.
  source: tb06_ru#§42,с.168
  distractor_note: "Жанибек — частая ошибка в тестах: «второй хан — Жанибек». Касым — следующий хан, путают поколения. Хакназар — сын Касыма, другая эпоха."
- id: q_s1e02_002
  fact: f.4.2.a
  format: single
  difficulty: 2
  stem:
    kk: "Бұрындық хан билік құрған жылдар:"
    ru: "Годы правления Бурундук-хана:"
  options:
    - { id: "a", kk: "1538–1580", ru: "1538–1580" }
    - { id: "b", kk: "1465–1474", ru: "1465–1474" }
    - { id: "c", kk: "1480–1511", ru: "1480–1511", correct: true }
    - { id: "d", kk: "1511–1518", ru: "1511–1518" }
  explain:
    kk: Бұрындық 1480–1511 жылдары билік құрды, отыз жылдан астам. 1465–1474 — Керейдің, 1511–1518 — Қасымның, 1538–1580 — Хақназардың жылдары.
    ru: Бурундук правил в 1480–1511 годах, больше тридцати лет. 1465–1474 — годы Керея, 1511–1518 — Касыма, 1538–1580 — Хакназара.
  source: tb10_ru#§36,с.141
  distractor_note: Все варианты — годы правления ханов сезона. Ловим тех, кто не привязывает хана к его эпохе.
- id: q_s1e02_003
  fact: f.4.2.a
  format: single
  difficulty: 2
  stem:
    kk: Шамамен 1511 жылы биліктен кеткен Бұрындық хан қайда барды?
    ru: Куда около 1511 года удалился Бурундук-хан, оставив власть?
  options:
    - { id: "a", kk: "Моғолстанға, Есенбұғаға", ru: "В Могулистан, к Есен-Буге" }
    - { id: "b", kk: "Сібірге, Ибаққа", ru: "В Сибирь, к Ибаку" }
    - { id: "c", kk: "Самарқанға, қызына", ru: "В Самарканд, к дочери", correct: true }
    - { id: "d", kk: "Сарайшыққа", ru: "В Сарайчик" }
  explain:
    kk: Нақты билік Қасымның қолына өтті, ал қартайған Бұрындық жақындарымен Самарқанға, қызына кетті. Қасым оны құрметпен шығарып салды — сондықтан алауыздық болмады.
    ru: Реальная власть перешла к Касыму, и постаревший Бурундук с приближёнными уехал в Самарканд, к дочери. Касым проводил его с почестями — поэтому до междоусобицы не дошло.
  source: tb06_ru#§42,с.169
  distractor_note: Сарайчик — место погребения Касыма. Могулистан — куда уходили Керей и Жанибек в серии 1. Ибак — сибирский хан той же эпохи, знаком только по имени.
- id: q_s1e02_004
  fact: f.4.2.g
  format: single
  difficulty: 2
  stem:
    kk: 1500 жылы Мұхаммед Шайбани Самарқан мен Бұхараны кімнен тартып алды?
    ru: У кого Мухаммед Шайбани в 1500 году отнял Самарканд и Бухару?
  options:
    - { id: "a", kk: "Орыс хан ұрпақтарынан", ru: "У потомков Урус-хана" }
    - { id: "b", kk: "Едіге ұрпақтарынан", ru: "У потомков Едиге" }
    - { id: "c", kk: "Тоғылық Темір ұрпақтарынан", ru: "У потомков Туглук-Тимура" }
    - { id: "d", kk: "Әмір Темір ұрпақтарынан", ru: "У потомков Тимура", correct: true }
  explain:
    kk: Мәуереннахрда Әмір Темір ұрпақтарының мемлекеті әлсіреген еді, Шайбани соны пайдаланды. Сырдария қалаларын қазақтардан ала алмаған соң, ол оңтүстікке бұрылды.
    ru: Держава Тимуридов в Мавераннахре ослабла, и Шайбани этим воспользовался. Не сумев отнять у казахов сырдарьинские города, он повернул на юг.
  source: tb06_ru#§42,с.169
  distractor_note: "Потомки Урус-хана — казахские ханы, Мавераннахром они не правили. Едиге — ногайская линия, Туглук-Тимур — могульская: соседние династии."
- id: q_s1e02_005
  fact: f.4.2.g
  format: single
  difficulty: 2
  stem:
    kk: Сырдария қалалары үшін күресте жеңілген Мұхаммед Шайбани қайда бет алды?
    ru: Куда направился Мухаммед Шайбани, проиграв борьбу за сырдарьинские города?
  options:
    - { id: "a", kk: "Мәуереннахрға", ru: "В Мавераннахр", correct: true }
    - { id: "b", kk: "Жетісуға", ru: "В Жетысу" }
    - { id: "c", kk: "Дешті Қыпшаққа", ru: "В Дешт-и-Кыпчак" }
    - { id: "d", kk: "Хорезмге", ru: "В Хорезм" }
  explain:
    kk: Шайбани шамамен 1500 жылы Мәуереннахрға кетіп, сол жерде жаңа мемлекет құрды. Онымен бірге кеткен тайпалар кейін өзбек халқының негізіне айналды.
    ru: Около 1500 года Шайбани ушёл в Мавераннахр и основал там новое государство. Ушедшие с ним племена позже стали основой узбекского народа.
  source: tb10_ru#§36,с.141
  distractor_note: Жетысу — путь казахов в серии 1. Дешт-и-Кыпчак — степь, которую Шайбани вернуть не смог. Хорезм — позже Хива, но не главное направление Шайбани.
- id: q_s1e02_006
  fact: f.4.2.g
  format: single
  difficulty: 2
  stem:
    kk: Шайбанимен бірге Мәуереннахрға кеткен тайпаларға қандай атау қалды?
    ru: Какое имя осталось за племенами, ушедшими с Шайбани в Мавераннахр?
  options:
    - { id: "a", kk: "Моғол", ru: "Могулы" }
    - { id: "b", kk: "Өзбек", ru: "Узбеки", correct: true }
    - { id: "c", kk: "Қазақ", ru: "Казахи" }
    - { id: "d", kk: "Ноғай", ru: "Ногаи" }
  explain:
    kk: Бұрын даладағы барлық тайпаларды «өзбек» деп атайтын, ал Керей мен Жәнібекпен кеткендерді «өзбек-қазақ» деген. Шайбани кеткен соң «өзбек» атауы онымен бірге кетті, далада «қазақ» қалды.
    ru: Раньше «узбеками» звали все племена степи, а ушедших с Кереем и Жанибеком — «узбек-казахами». Когда Шайбани ушёл, имя «узбек» ушло с ним, в степи осталось «казах».
  source: tb10_ru#§36,с.141
  distractor_note: «Казахи» — наоборот, имя оставшихся в степи. Ногаи и могулы — соседние народы, к паре «узбек-казах» отношения не имеют.
- id: q_s1e02_007
  fact: f.4.2.f
  format: single
  difficulty: 2
  stem:
    kk: 1510 жылы Сығанақ түбінде Мұхаммед Шайбани кімнен жеңілді?
    ru: Кто разбил Мухаммеда Шайбани под Сыгнаком в 1510 году?
  options:
    - { id: "a", kk: "Бұрындық хан", ru: "Бурундук-хан" }
    - { id: "b", kk: "Сібір ханы Ибақ", ru: "Сибирский хан Ибак" }
    - { id: "c", kk: "Қасым сұлтан", ru: "Султан Касым", correct: true }
    - { id: "d", kk: "Иран шахы Исмаил", ru: "Иранский шах Исмаил" }
  explain:
    kk: 1510 жылдың басында Сығанақ түбінде Шайбаниді Қасым сұлтанның әскері жеңді. Осыдан кейін Шайбани Иранмен соғысып, сол жылы күзде Мерв түбінде қаза тапты.
    ru: В начале 1510 года под Сыгнаком Шайбани разбило войско султана Касыма. После этого Шайбани ввязался в войну с Ираном и осенью того же года погиб под Мервом.
  source: tb06_ru#§42,с.168
  distractor_note: Исмаил разбил Шайбани в том же году, но под Мервом. Бурундук — формально хан, но битву вёл Касым. Ибак — событие другого времени (1481).
- id: q_s1e02_008
  fact: f.4.2.f
  format: single
  difficulty: 2
  stem:
    kk: Мұхаммед Шайбанидің 1509–1510 жылдардағы қазақтарға қарсы жорықтары немен аяқталды?
    ru: Чем закончились походы Мухаммеда Шайбани против казахов в 1509–1510 годах?
  options:
    - { id: "a", kk: "Сығанақты біржола өзіне қаратты", ru: "Он окончательно подчинил Сыгнак" }
    - { id: "b", kk: "Ұлытауда Қасымды тұтқынға алды", ru: "Он взял Касыма в плен в Улытау" }
    - { id: "c", kk: "Қазақтармен мәңгілік бітім жасады", ru: "Он заключил с казахами вечный мир" }
    - { id: "d", kk: "1510 жылдың басында Сығанақ түбінде Қасымнан жеңілді", ru: "В начале 1510 года он был разбит Касымом под Сыгнаком", correct: true }
  explain:
    kk: Шайбани Ұлытаудағы Қасымның ордасын тонады, бірақ Қасым әскер жинап, 1510 жылы оны Сығанақ түбінде жеңді. Бұл жеңілістен кейін Шайбани қазақ даласына қайтып оралмады.
    ru: Шайбани разграбил ставку Касыма в Улытау, но Касым собрал войско и в 1510 году разбил его под Сыгнаком. После этого поражения Шайбани в казахскую степь уже не вернулся.
  source: tb10_ru#§36,с.142
  distractor_note: «Взял в плен в Улытау» — ставку разграбили, но Касым уцелел. «Подчинил Сыгнак» — события 70-х, потом он город потерял.
- id: q_s1e02_009
  fact: f.4.2.f
  format: single
  difficulty: 2
  stem:
    kk: 1510 жылғы екі оқиғаның ретін анықтаңыз.
    ru: Определите порядок двух событий 1510 года.
  options:
    - { id: "a", kk: "Алдымен Сығанақ түбінде Қасымнан жеңілді, сосын Мерв түбінде қаза тапты", ru: "Сначала поражение от Касыма под Сыгнаком, потом гибель под Мервом", correct: true }
    - { id: "b", kk: "Алдымен Мерв түбінде жеңілді, сосын Сығанақты алды", ru: "Сначала поражение под Мервом, потом взятие Сыгнака" }
    - { id: "c", kk: "Екеуі бір күнде болды", ru: "Оба события произошли в один день" }
    - { id: "d", kk: "Алдымен Иранмен одақ, сосын Сығанақ түбінде жеңіс", ru: "Сначала союз с Ираном, потом победа под Сыгнаком" }
  explain:
    kk: Жыл басында Шайбани Сығанақ түбінде Қасымнан жеңілді. Сосын Иран шахы Исмаилмен соғысып, күзде Мерв түбінде қаза тапты. Оның мемлекеті Бұхара және Хиуа болып екіге бөлінді.
    ru: В начале года Шайбани разбит Касымом под Сыгнаком. Потом он воевал с иранским шахом Исмаилом и осенью погиб под Мервом. Его держава раскололась на Бухару и Хиву.
  source: tb06_ru#§42,с.168
  distractor_note: "Ловим тех, кто меняет местами причину и следствие: Мерв — финал, после него Шайбани нет."
- id: q_s1e02_010
  fact: f.4.2.l
  format: single
  difficulty: 2
  stem:
    kk: "XV ғасырдың соңы – XVI ғасырдың басындағы Қазақ хандығы сыртқы саясатының басты міндеті:"
    ru: "Главная задача внешней политики Казахского ханства в конце XV – начале XVI века:"
  options:
    - { id: "a", kk: "Ташкент үшін Абдаллахпен күресу", ru: "Бороться с Абдаллахом за Ташкент" }
    - { id: "b", kk: "Сырдария бойына билік орнату", ru: "Утвердить власть в Присырдарьинском регионе", correct: true }
    - { id: "c", kk: "Сібір хандығының жерлерін қосып алу", ru: "Присоединить земли Сибирского ханства" }
    - { id: "d", kk: "Шайбанилермен бірге Моғолстанды бөлісу", ru: "Вместе с Шайбанидами поделить Могулистан" }
  explain:
    kk: Сырдария қалалары — бабалардың мұрасы, қамалдар, сауда орталықтары және қыстақтар болды. Қала болмаса, дала астықсыз, темірсіз қалады. Сондықтан ол жер үшін ғасырлық күрес жүрді.
    ru: Сырдарьинские города — наследие предков, крепости, центры торговли и зимовья. Без городов степь оставалась без хлеба и железа. Поэтому борьба за них шла целый век.
  source: tb06_ru#§42,с.167
  distractor_note: Сибирь — эпоха Хакназара и Тауекела. «Ташкент и Абдаллах» — конец XVI века. «Вместе с Шайбанидами» — путают противника с союзником.
- id: q_s1e02_011
  fact: f.4.2.l
  format: single
  difficulty: 2
  stem:
    kk: "Бүкіл Шығыс Дешті Қыпшақ үшін «сауда айлағы» болған және алғашқы қазақ билеушілерінің ордасы болған қала:"
    ru: "Город, бывший «торговыми воротами» всего Восточного Дешт-и-Кыпчака и ставкой первых казахских правителей:"
  options:
    - { id: "a", kk: "Сарайшық", ru: "Сарайчик" }
    - { id: "b", kk: "Суяб", ru: "Суяб" }
    - { id: "c", kk: "Сығанақ", ru: "Сыгнак", correct: true }
    - { id: "d", kk: "Сайрам", ru: "Сайрам" }
  explain:
    kk: Сығанақ Сырдарияның орта ағысында, дала мен отырықшы аймақтардың түйіскен жерінде тұрды. Ол Ақ Орданың да, алғашқы қазақ хандарының да ордасы болды. Сондықтан Шайбани ең алдымен Сығанақты алуға тырысты.
    ru: Сыгнак стоял на среднем течении Сырдарьи, на стыке степи и оседлых земель. Он был ставкой и Ак Орды, и первых казахских ханов. Поэтому Шайбани прежде всего рвался к Сыгнаку.
  source: bank:school_tests_2026; tb06_ru#§30,с.126
  distractor_note: Сайрам — город, сдавшийся Касыму без боя. Сарайчик — на Урале, место погребения Касыма. Суяб — город более ранней эпохи.
- id: q_s1e02_012
  fact: f.4.2.b
  format: single
  difficulty: 2
  stem:
    kk: "Бұрындық Самарқанға кеткен соң хан болып ақ киізге көтерілген Жәнібектің ұлы:"
    ru: "Сын Жанибека, поднятый на белой кошме после ухода Бурундука в Самарканд:"
  options:
    - { id: "a", kk: "Хақназар", ru: "Хакназар" }
    - { id: "b", kk: "Мамаш", ru: "Мамаш" }
    - { id: "c", kk: "Шығай", ru: "Шигай" }
    - { id: "d", kk: "Қасым", ru: "Касым", correct: true }
  explain:
    kk: Нақты билік Бұрындық тұсында-ақ Қасымның қолында еді. Бұрындық кеткен соң оны ресми түрде хан етіп көтерді.
    ru: Реальная власть была у Касыма ещё при Бурундуке. После ухода Бурундука его официально подняли ханом.
  source: tb06_ru#§43,с.170
  distractor_note: Хакназар и Мамаш — сыновья Касыма, следующее поколение. Шигай — внук Жанибека, 1580 год.
