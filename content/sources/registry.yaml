# Реестр источников. Любой `source:` в вопросах и фактах ссылается на `id` отсюда.
# type: primary | academic | textbook | spec | media | tests (сборники тестов — источник банка пробника, не фактов)

- id: ent_spec_history
  type: spec
  title: "Спецификация теста по предмету «История Казахстана» для Единого национального тестирования (для использования с 2026 года)"
  author: "Национальный центр тестирования (НЦТ)"
  year: 2026
  url: "https://testcenter.kz/wp-content/uploads/2025/10/23_%D0%98%D1%81%D1%82%D0%BE%D1%80%D0%B8%D1%8F-%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD%D0%B0.pdf"
  locator: "разделы 01–07, темы 01–55"
  copy: "sources/ent_spec_history_2026.pdf"
  note: |
    Скачано 23 сентября 2026 с testcenter.kz (файл 23_История-Казахстана.pdf, выложен в октябре 2025).
    Содержание: 7 разделов, 55 тем. Образование ханства — раздел 02 «Период средневековья», темы 10 и 11.
    Структура теста: 20 заданий. 1–10 — с выбором одного правильного ответа, 11–20 — на основе 2 контекстов.
    (В самой спецификации в строке про контексты стоит «5 тестовых заданий на основе 2 контекстов» при
    заявленных 20 заданиях — читаем как 5 заданий на каждый из 2 контекстов, как и описано на сайте НЦТ.)
    Трудность в одном варианте: базовый A — 50%, средний B — 30%, высокий C — 20% (наше difficulty 1/2/3).
    Контекстные задания — раздел 07: 53 «История в документах», 54 «История в лицах», 55 «Исторические карты и схемы».
    Литература: «Перечень учебников и УМК», утверждаемый Министерством просвещения РК (учебники 5–11 кл. внесены ниже: tb05_ru … tb11_kk).

- id: dulati_tarikh_i_rashidi
  type: primary
  title: "Тарих-и Рашиди"
  author: "Мухаммад Хайдар Дулати"
  year: 1546
  note: "Основной письменный источник об откочёвке Керея и Жанибека и образовании ханства. Датирует событие 870 г. хиджры (1465–1466). Использовать по академическому переводу; указывать главу."

- id: qazaqstan_tarihy_v2
  type: academic
  title: "История Казахстана (с древнейших времён до наших дней). В пяти томах. Том 2"
  author: "Институт истории и этнологии им. Ч. Ч. Валиханова"
  year: 1997
  note: "Академическое издание. Локатор — страница. ЗАПОЛНИТЬ точные страницы при вычитке историком."

