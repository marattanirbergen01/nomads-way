    covers: []
    title: { kk: "Дәлел", ru: "Доказательство" }
    beats:
      - say:
          who: aidar
          kk: "Мына кітапты оқыңыз: «Шығыс қақпа — 300 теңге». Сейіттің өз қолы."
          ru: "Прочтите эту книгу: «Восточные ворота — 300 монет». Рука самого Сейита."
