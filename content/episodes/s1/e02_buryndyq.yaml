scenes:
  - id: sc010
    art: art_s1e02_010
    layer: history
    covers: [ "f.4.2.l" ]
    title: { kk: "Сығанақ базары", ru: "Базар Сыгнака" }
    beats:
      - say:
          who: narrator
          kk: 1470-жылдардың басы. Сырдарияның орта ағысындағы Сығанақ. Далада Керей хан билеп тұр, ал қалада базар қызып жатыр.
          ru: Начало 1470-х. Сыгнак на среднем течении Сырдарьи. В степи правит Керей-хан, а в городе кипит базар.
      - say:
          who: narrator
          kk: Бірнеше жыл бұрын, 1469–1470 жылдары, Керей мен Жәнібек Дешті Қыпшаққа оралып, Әбілқайыр мұрагерлерін талқандаған. Билік Орыс хан ұрпақтарына қайтып, қазақ тайпаларының жері бір мемлекетке бірікті.
          ru: Несколькими годами раньше, в 1469–1470 годах, Керей и Жанибек вернулись в Дешт-и-Кыпчак и разгромили наследников Абулхаира. Власть вернулась к потомкам Урус-хана, а земли казахских племён объединились в одно государство.
      - say:
          who: seiit
          kk: Керей мен Жәнібек ойраттардың шабуылдарына да тойтарыс берді. Солтүстікте Сібір ханы Ибақпен достық пен одақ туралы келісті. Сондықтан базарға енді қорықпай келеміз.
          ru: Керей и Жанибек отбили и набеги ойратов. На севере договорились о дружбе и союзе с сибирским ханом Ибаком. Потому на базар мы теперь ездим без страха.
      - say:
          who: dana
          kk: Сейіт ата, әкемнің жебелерін алыңызшы. Ұшы — Сығанақтың темірі, сабы — Қаратаудың қайыңы.
          ru: Сейит-ата, возьмите отцовские стрелы. Наконечник — сыгнакское железо, древко — каратауская берёза.
      - say:
          who: seiit
          kk: Аламын, қызым. Ал сен білесің бе, мына қала неге бай? Біз егін егеміз, ұста соғады, тоқымашы тоқиды. Ал дала мал әкеледі.
          ru: Возьму, дочка. А ты знаешь, отчего этот город богат? Мы сеем хлеб, кузнец куёт, ткач ткёт. А степь приводит скот.
      - say:
          who: seiit
          kk: "Дала бізсіз жалаңаш: бидайы жоқ, темірі жоқ, матасы жоқ. Ал біз даласыз ашпыз: етсіз, жүнсіз, терісіз."
          ru: "Степь без нас голая: ни хлеба, ни железа, ни ткани. А мы без степи голодные: ни мяса, ни шерсти, ни кож."
      - say:
          who: dana
          kk: Сонда қаланы кім ұстаса — соның қазынасы толы ғой.
          ru: Значит, у кого город — у того и казна полна.
      - say:
          who: seiit
          kk: Дәл солай. Сығанақ — бүкіл Шығыс Дешті Қыпшақтың сауда айлағы. Ақ Орда хандары да осында ордасын тіккен. Енді мұнда қазақ хандары отыр.
          ru: Именно. Сыгнак — торговые ворота всего Восточного Дешт-и-Кыпчака. Здесь стояла ставка ханов Ак Орды. Теперь здесь сидят казахские ханы.
      - say:
          who: seiit
          kk: Қыс сайын ауылдар Сыр бойына қыстауға келеді. Бабалардың зираты да осында. Бұл жерді ешкім оңайлықпен бермейді.
          ru: Каждую зиму аулы приходят на Сырдарью зимовать. Здесь и могилы предков. Эту землю никто просто так не отдаст.
      - say:
          who: narrator
          kk: Сырдария қалалары — бабалардың мұрасы, қамалдар, сауда және қыстақ. Сондықтан XV ғасырдың соңында Қазақ хандығының басты мақсаты Сыр бойына билік орнату болды.
          ru: Сырдарьинские города — наследие предков, крепости, торговля и зимовья. Поэтому в конце XV века главной целью Казахского ханства было утвердиться на Сырдарье.
    quiz: [ "q_s1e02_010", "q_s1e02_011" ]
  - id: sc015
    art: art_s1e02_015
    layer: personal
    covers: []
    title: { kk: "Сейіттің ұсынысы", ru: "Предложение Сейита" }
    beats:
      - say:
          who: narrator
          kk: Сығанақ, 1470-жылдардың басы. Базар жабылып жатыр.
          ru: Сыгнак, начало 1470-х. Базар закрывается.
      - say:
          who: seiit
          kk: Тоқта, жылқышы. Жұмыс бар. Бүгін түнде он атыңды шығыс қақпаның сыртына әкеліп ұстап тұр. Таңға дейін.
          ru: Постой. Есть дело. Этой ночью приведи десять коней к восточным воротам, снаружи. И держи до утра.
      - say:
          who: aidar
          kk: Түнде? Қақпа жабық болады ғой. Кімге ат?
          ru: Ночью? Ворота же будут закрыты. Для кого кони?
          emotion: alarm
      - say:
          who: seiit
          kk: Көп сұрама. Керуен ерте шығады. Міне — бір айлық пайдаң.
          ru: Не спрашивай много. Караван выходит рано. Вот — твой заработок за месяц.
      - say:
          who: dana
          kk: Сейіт ата, керуен шығыс қақпамен жүрмейді ғой. Шығыста — тек дала. Және жау.
          ru: Сейит-ата, караваны через восточные ворота не ходят. На востоке только степь. И враги.
      - say:
          who: seiit
          kk: Сен, қызым, жебеңді сатып жүр. Үлкендердің ісіне араласпа.
          ru: Ты, дочка, свои стрелы продавай. В дела взрослых не лезь.
      - say:
          who: dana
          kk: Алма бұл ақшаны. Мұнда бірдеңе дұрыс емес.
          ru: Не бери эти деньги. Тут что-то не так.
      - choice:
          prompt: { kk: "Күмісті аласың ба?", ru: "Возьмёшь серебро?" }
          options:
            - id: take
              kk: Алу — бір айлық пайда
              ru: Взять — месячная выручка
              reply:
                kk: Күміс ауыр. Түнде қақпа сыртында боламын. Тек — кімнің аттарын ұстаймын?
                ru: Серебро тяжёлое. Ночью — за воротами. Только чьих коней придётся держать?
                emotion: calm
              set: { practical: 1, seiit_deal: 1 }
              goto: sc020
            - id: refuse
              kk: Бас тарту — Дананың сөзіне сену
              ru: Отказаться — поверить Дане
              reply:
                kk: "Сейіт қабағын түйді. Дана сыбырлады: «Түнде мұнараға кел. Бірге қараймыз»."
                ru: "Сейит нахмурился. Дана шепнула: «Ночью приходи на башню. Посмотрим вместе»."
                emotion: alarm
              set: { loyalty: 1, vigilant: 1 }
              goto: sc020
  - id: sc020
    art: art_s1e02_020
    layer: history
    covers: [ "f.4.2.l" ]
    title: { kk: "Қақпа ашылды", ru: "Ворота открыты" }
    beats:
      - say:
          who: narrator
          kk: Сол түні Дана жебелерді қабырғадағы мұнараға апара жатқан. Ешкім айқайлаған жоқ. Ешкім қақпа қаққан жоқ.
          ru: В ту ночь Дана несла стрелы на башню. Никто не кричал. Никто не стучал в ворота.
      - say:
          who: dana
          kk: Қақпа... іштен ашылып жатыр. Кім ашты?
          ru: Ворота… открываются изнутри. Кто их открыл?
      - say:
          who: narrator
          kk: "Мұны шежірелер жазбаған. Тек кім кіргені белгілі: Әбілқайыр ханның немересі Мұхаммед."
          ru: "Этого летописи не сохранили. Известно только, кто вошёл: внук Абулхаир-хана Мухаммед."
      - say:
          who: shaibani
          kk: Атамның қаласы. Атам осы қабырғалардан бүкіл Дешті Қыпшақты билеген. Сәлем, Сығанақ.
          ru: Город моего деда. Отсюда дед правил всем Дешт-и-Кыпчаком. Здравствуй, Сыгнак.
      - say:
          who: shaibani
          kk: Керей мен Жәнібек атамның елін алып кетті. Мен оның қалаларын қайтарамын. Бірінен соң бірін.
          ru: Керей и Жанибек увели народ моего деда. Я верну его города. Один за другим.
      - say:
          who: narrator
          kk: Шығыс Дешті Қыпшақта Шайбани әулетінің билігі Қазақ хандығы құрылғанда тоқтаған еді. Енді Әбілқайырдың немересі оны қайтармақ болды.
          ru: Власть Шайбанидов в Восточном Дешт-и-Кыпчаке прекратилась с образованием Казахского ханства. Теперь внук Абулхаира хотел её вернуть.
      - say:
          who: narrator
          kk: Тарихта ол Мұхаммед Шайбани деген атпен қалды.
          ru: В историю он вошёл как Мухаммед Шайбани.
  - id: sc025
    art: art_s1e02_025
    art_when:
      - { if: "seiit_deal", art: "art_s1e02_025_outside" }
    layer: personal
    covers: []
    title: { kk: "Түнгі қақпа", ru: "Ночные ворота" }
    beats:
      - say:
          who: aidar
          kk: Аттарды кімге ұстап тұрғанымды енді түсіндім... Бұлар — Шайбанидің адамдары. Ал мен оларға ат дайындап тұрмын.
          ru: Теперь понятно, для кого эти кони… Это люди Шайбани. А их кони — в моих руках.
          emotion: alarm
          when: seiit_deal
      - say:
          who: aidar
          kk: Дана, қара! Темір қақпаны ашып жатыр!
          ru: Дана, смотри! Темир открывает ворота!
          emotion: alarm
          when: "!seiit_deal"
      - say:
          who: temir
          kk: Аштым! Ашып қойдым! Енді ұлымды бер!
          ru: Открыл! Всё, открыто! Теперь отдай сына!
      - say:
          who: rider
          kk: Қала біздікі болғанда береміз. Ұлың әзірге менімен жүреді.
          ru: Отдадим, когда город будет наш. А пока сын поедет со мной.
      - say:
          who: beket
          kk: Әке!..
          ru: Папа!..
      - say:
          who: rider
          kk: "Сейітке айт: келісім орындалды. Оның керуендері салықсыз жүреді."
          ru: "Передай Сейиту: уговор исполнен. Его караваны пойдут без налогов."
      - choice:
          prompt: { kk: "Не істейсің?", ru: "Что сделаешь?" }
          options:
            - id: save_boy
              kk: Ат үстіндегі адамға секіріп, баланы тартып алу
              ru: Броситься на всадника и вырвать ребёнка
              reply:
                kk: Қылыш жүзі жағымды сызып өтті. Бірақ бала — менің қолымда.
                ru: Клинок полоснул по щеке. Но ребёнок — у меня в руках.
                emotion: alarm
              set: { courage: 2, saved_beket: 1, scar: 1 }
              goto: sc026a
            - id: alarm
              kk: Мұнараға жүгіріп, дабыл қағып, қаланы ояту
              ru: Бежать на башню, бить в набат, будить город
              reply:
                kk: Дабыл! Үйлерден адамдар шықты. Ал бала жылаған дауыс алыстап барады...
                ru: Набат! Люди выбегают из домов. А детский плач уходит всё дальше…
                emotion: sorrow
              set: { loyalty: 2, raised_alarm: 1 }
              goto: sc026b
            - id: follow
              kk: Үнсіз қалып, Сейітке хабар апаратын адамның соңынан еру
              ru: Затаиться и пойти за тем, кто понесёт весть Сейиту
              reply:
                kk: Біреу көлеңкеден шығып, базарға қарай жүрді. Мен — соңынан.
                ru: Кто-то вышел из тени и пошёл к базару. Следом — я.
                emotion: alarm
              set: { vigilant: 2, followed_seiit: 1 }
              goto: sc026c
  - id: sc026a
    art: art_s1e02_026a
    layer: personal
    covers: []
    title: { kk: "Бала аман", ru: "Ребёнок спасён" }
    beats:
      - say:
          who: beket
          kk: Сенің бетіңнен қан ағып тұр...
          ru: У тебя кровь на лице…
      - say:
          who: aidar
          kk: Түк емес. Атың кім?
          ru: Ерунда. Как тебя зовут?
          emotion: calm
      - say:
          who: beket
          kk: Бекет. Әкем қайда?
          ru: Бекет. Где мой папа?
      - say:
          who: temir
          kk: Бекет! Құдайым... Сен оны алып қалдың ба? Онда мен қақпаны бекер ашқан екенмін ғой...
          ru: Бекет! Боже… Живой… Значит, я открыл ворота зря…
      - choice:
          prompt: { kk: "Темірге не айтасың?", ru: "Что скажешь Темиру?" }
          options:
            - id: hide_them
              kk: «Ұлыңды ал да, жасырын. Қақпа туралы мен үндемеймін»
              ru: «Забирай сына и прячьтесь. О воротах — ни слова»
              reply:
                kk: "Темір ұлын құшақтап, қараңғыға кірді: «Бұл қарызды өмір бойы өтеймін»."
                ru: "Темир обнял сына и растворился в темноте: «Этот долг я буду отдавать всю жизнь»."
                emotion: calm
              set: { loyalty: 1 }
              goto: sc030
            - id: answer
              kk: «Ұлың аман. Бірақ қақпаны ашқаныңа жауап бересің»
              ru: «Сын цел. Но за ворота ответишь»
              reply:
                kk: "Темір басын иді: «Жауап берем. Тек Бекетке қамқор бол»."
                ru: "Темир опустил голову: «Отвечу. Только позаботься о Бекете»."
                emotion: sorrow
              set: { justice: 1 }
              goto: sc030
  - id: sc026b
    art: art_s1e02_026b
    layer: personal
    covers: []
    title: { kk: "Дабыл", ru: "Набат" }
    beats:
      - say:
          who: dana
          kk: Әйелдер мен балалар — мешітке! Ер адамдар — қару ал!
          ru: Женщины и дети — в мечеть! Мужчины — к оружию!
      - say:
          who: aidar
          kk: Олар баланы алып кетті, Дана. Көз алдымда... бірақ...
          ru: Они увезли ребёнка, Дана. Прямо на глазах… а помочь…
          emotion: sorrow
      - say:
          who: dana
          kk: Сенің арқаңда жүз адам оянды. Жүз отбасы тірі. Бір баланы бүгін құтқара алмадық. Ертең — мүмкін.
          ru: Благодаря тебе проснулась сотня людей. Сто семей живы. Одного ребёнка сегодня спасти не смогли. Завтра — может быть.
      - choice:
          prompt: { kk: "Енді не істейсің?", ru: "Что теперь?" }
          options:
            - id: arm
              kk: Мұнарада қалып, Данамен бірге қабырғаны қорғау
