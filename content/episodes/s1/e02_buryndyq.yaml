  - id: sc030
    art: art_s1e02_030
    layer: history
    covers: [ "f.4.2.a" ]
    title: { kk: "Сұлтан жарасын таңады", ru: "Султан перевязывает рану" }
    beats:
      - say:
          who: narrator
          kk: Ол кезде хан әлі Керей еді. Әскерді оның ұлы Бұрындық бастап жүрді — болашақ қазақтың екінші ханы. Ол Жәнібектің емес, Керейдің ұлы еді.
          ru: Ханом тогда ещё был Керей. Войско вёл его сын Бурундук — будущий второй казахский хан. Сын Керея, а не Жанибека.
      - say:
          who: narrator
          kk: Жәнібектің ұлы Қасым әлі жас сұлтан болатын. Бірақ әскер оны қазірдің өзінде тыңдайтын.
          ru: Сын Жанибека Касым был ещё молодым султаном. Но войско уже тогда его слушало.
      - say:
          who: burundyq
          kk: Қасым, Сығанақ қабырғасының қай жағы әлсіз?
          ru: Касым, какая сторона стены у Сыгнака слабее?
      - say:
          who: qasym
          kk: Білмеймін, аға. Мұны тек қала адамдары біледі. Ал сенің жараң әлі жазылған жоқ. Мұны маған тапсыр.
          ru: Не знаю, брат. Такое знают только горожане. А твоя рана ещё не зажила. Поручи это мне.
      - say:
          who: narrator
          kk: "Сол сәтте хабаршы жетті: Сығанақты Шайбани алды."
          ru: "В этот миг примчался гонец: Сыгнак взял Шайбани."
      - say:
          who: burundyq
          kk: Жара — менің ісім. Қала — елдің ісі. Атымды әкел.
          ru: Рана — моё дело. Город — дело народа. Коня.
      - say:
          who: narrator
          kk: Бұрындық 1480–1511 жылдары хан болды — отыз жылдан астам. Ол әскерді өзі бастап, талай рет жараланды. Тарихшылар оны «Дешті Қыпшақтың қуатты әміршісі» деп атаған.
          ru: Бурундук был ханом в 1480–1511 годах — больше тридцати лет. Он сам водил войско и не раз был ранен. Историки называли его «могущественным государем Дешт-и-Кыпчака».
    quiz: [ "q_s1e02_001", "q_s1e02_002" ]
  - id: sc040
    art: art_s1e02_040
    layer: history
    covers: [ "f.4.2.l" ]
    title: { kk: "Мұнарадағы белгі", ru: "Знак на башне" }
    beats:
      - say:
          who: narrator
          kk: Қазақ әскері қаланы қоршады. Шайбанидің адамдары қала тұрғындарын қабырғаға шығарып, жебе тасытты.
          ru: Казахское войско окружило город. Люди Шайбани выгнали горожан на стены — подносить стрелы.
      - say:
          who: dana
          kk: Әкемнің жебелері... Біз соққан темір енді өз жағымызға атылып жатыр.
          ru: Отцовские стрелы… Наше железо теперь летит в своих.
      - say:
          who: narrator
          kk: "Төменде қазақ мергендерінің жебелері: сабы қызыл, бұралған өрнекті, ұшында қара жолақ. Дана оларды бірден таныды — бәрін әкесі соққан."
          ru: "Внизу стрелы казахских лучников: красное древко с витым узором, чёрная полоса у наконечника. Дана сразу их узнала — все ковал её отец."
      - say:
          who: dana
          kk: Шығыс қақпаның жанындағы қабырға — жаңбырдан жарылған. Мұны тек қала адамдары біледі...
          ru: Стена у восточных ворот треснула от дождей. Об этом знают только горожане…
      - say:
          who: narrator
          kk: Мұнарадан біреу шамшырақпен үш рет белгі берді. Төменде Бұрындық мұны көрді.
          ru: Кто-то трижды подал знак светильником с башни. Внизу Бурундук его увидел.
      - say:
          who: burundyq
          kk: Анау жерде біреу белгі беріп тұр. Шығыс қақпаға! Аттан!
          ru: Там кто-то подаёт знак. К восточным воротам! Вперёд!
      - say:
          who: shaibani
          kk: Сығанақ бәрібір менікі болады, Бұрындық! Бұл — бірінші есік қана!
          ru: Сыгнак всё равно будет моим, Бурундук! Это только первые ворота!
      - say:
          who: narrator
          kk: "Шайбанидің жасағы ойсырай жеңіліп, өзі қашты. Ол атасының хандығын қалпына келтіре алмады: қазақ хандары тек әскерінің көптігімен емес, халықтың көпшілігінің мүддесін білдіргендіктен күшті еді."
          ru: "Отряд Шайбани был разбит наголову, сам он бежал. Восстановить ханство деда он не смог: казахские ханы были сильны не только числом воинов — они выражали интересы большинства народа."
  - id: sc045
    art: art_s1e02_045
    layer: personal
    covers: []
