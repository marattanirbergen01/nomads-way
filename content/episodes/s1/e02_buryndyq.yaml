          who: esaul
          kk: Естідім дейсің... Дәлелің жоқ. Ал Сейіт — қаланың ең бай саудагері. Жалған жала — ауыр қылмыс. Мына жылқышының үйірі — қазынаға.
          ru: «Слышал», говоришь… Доказательств нет. А Сейит — богатейший купец города. Ложное обвинение — тяжкое преступление. Табун этого табунщика — в казну.
