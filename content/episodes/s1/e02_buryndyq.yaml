  - id: sc050
    art: art_s1e02_050
    layer: history
    covers: [ "f.4.2.a", "f.4.2.l" ]
    title: { kk: "Бұрындық пен Қасым", ru: "Бурундук и Касым" }
    beats:
      - say:
          who: burundyq
          kk: Көрдің бе, Қасым? Сыр бойы — үш елдің арасында. Біз, моғолдар және Шайбани. Жыл сайын шекара ауысады.
          ru: Видишь, Касым? Сырдарья — между тремя силами. Мы, могулы и Шайбани. Каждый год граница сдвигается.
      - say:
          who: qasym
          kk: Онда оны қылышпен ғана емес, сөзбен де ұстау керек. Қала әкімдері күштіні таңдайды. Бізді таңдасын.
          ru: Тогда держать её надо не только саблей, но и словом. Правители городов выбирают сильного. Пусть выберут нас.
      - say:
          who: burundyq
          kk: Сен әкеңе тартқансың. Жәнібек те солай айтатын.
          ru: Ты в отца. Жанибек тоже так говорил.
      - say:
          who: narrator
          kk: XV ғасырдың 80-жылдарынан Сыр бойындағы қалалар үшін қазақтар, моғолдар және өзбектер соғысты. Ғасырдың соңында өзен алқабы үш мемлекет арасында бөлініп қалды.
          ru: С 80-х годов XV века за города на Сырдарье воевали казахи, могулы и узбеки. К концу века долина реки оказалась поделена между тремя государствами.
      - say:
          who: dana
          kk: Сонда біздің қала бір күні — қазақтікі, бір күні — басқанікі бола ма?
          ru: Значит, наш город сегодня казахский, а завтра — чей-то ещё?
      - say:
          who: qasym
          kk: Біз тұрғанда — жоқ.
          ru: Пока мы здесь стоим — нет.
  - id: sc060
    art: map_s1e02_south
    layer: history
    covers: [ "f.4.2.g" ]
    title: { kk: "Самарқан, 1500", ru: "Самарканд, 1500" }
    beats:
      - say:
          who: narrator
          kk: Сыр бойындағы қалаларды Шайбани қазақтардан ала алмады. Сонда ол бағытын өзгертіп, оңтүстікке — Мәуереннахрға бұрылды.
          ru: Отнять у казахов сырдарьинские города Шайбани не смог. Тогда он сменил направление и повернул на юг — в Мавераннахр.
      - say:
          who: narrator
          kk: Ол жерде Әмір Темір ұрпақтарының мемлекеті әлсіреп, ыдырап жатқан. Шайбани соны пайдаланды.
          ru: Там слабела и распадалась держава потомков Тимура. Шайбани этим воспользовался.
      - say:
          who: narrator
          kk: 1500 жылы ол Самарқан мен Бұхараны Әмір Темір ұрпақтарынан тартып алды. Темір ұрпағы жас Бабыр Самарқаннан кетуге мәжбүр болды.
          ru: В 1500 году он отнял Самарканд и Бухару у потомков Тимура. Юный Тимурид Бабур был вынужден покинуть Самарканд.
      - say:
          who: narrator
          kk: Бұрын даладағы көшпелі тайпалардың бәрін «өзбек» деп атайтын. Керей мен Жәнібекке ерген жұртты — «өзбек-қазақ».
          ru: Раньше «узбеками» звали все кочевые племена степи. А народ, ушедший с Кереем и Жанибеком, — «узбек-казахами».
      - say:
          who: narrator
          kk: Шайбанимен бірге Мәуереннахрға кеткен тайпаларға «өзбек» деген ат қалды. Олар кейін өзбек халқының негізіне айналды.
          ru: За племенами, ушедшими с Шайбани в Мавераннахр, осталось имя «узбеки». Позже они стали основой узбекского народа.
      - say:
          who: narrator
          kk: Ал далада қалғандар енді жай «қазақ» деп аталды. Бір атау екіге бөлінді — екі халық пайда болды.
          ru: А оставшихся в степи теперь звали просто «казахами». Одно имя раскололось надвое — и появилось два народа.
    quiz: [ "q_s1e02_004", "q_s1e02_005", "q_s1e02_006" ]
  - id: sc070
    art: art_s1e02_070
    layer: history
    covers: [ "f.4.2.a" ]
    title: { kk: "Сауран. Тұтқын", ru: "Сауран. Пленник" }
    beats:
      - say:
          who: narrator
          kk: Шайбани оңтүстікте соғысып жатқанда, қазақтар Сауранды алды. Тұтқынға оның інісі Махмұд сұлтан әйелі, балаларымен бірге түсті.
          ru: Пока Шайбани воевал на юге, казахи взяли Сауран. В плен попал его младший брат Махмуд-султан с женой и детьми.
      - say:
          who: burundyq
          kk: Шайбанидің інісі. Сығанақты тонаған, біздің ата-бабамыздың қанын төккен әулет.
          ru: Брат Шайбани. Род, грабивший Сыгнак и проливший кровь наших предков.
      - say:
          who: burundyq
          kk: Жасауыл. Өлтір.
          ru: Есаул. Убей.
      - say:
          who: qasym
          kk: Тоқта.
          ru: Стой.
      - say:
          who: qasym
          kk: Хан ием, ол — тұтқын. Тұтқынды өлтірген — ер емес. Оның үстіне, ол да бәріміз сияқты Жошының ұрпағы.
          ru: Повелитель, он пленник. Убить пленника — не по-мужски. К тому же он, как и все мы, потомок Джучи.
      - say:
          who: burundyq
          kk: Бүгін босатсаң — ертең ол әскер әкеледі.
          ru: Отпустишь сегодня — завтра он приведёт войско.
      - say:
          who: qasym
          kk: Әкелсін. Бірақ ел біздің кім екенімізді біледі.
          ru: Пусть приводит. Зато люди будут знать, кто мы.
      - say:
          who: qasym
          kk: "Ағаңа бар, Махмұд. Менің адамдарым шығарып салады. Ағаңа айт: қазақ тұтқынды өлтірмейді."
          ru: "Иди к брату, Махмуд. Мои люди тебя проводят. Скажи брату: казах пленных не убивает."
      - say:
          who: mahmud
          kk: Мен мұны ұмытпаймын, Қасым сұлтан.
          ru: Я этого не забуду, Касым-султан.
      - say:
          who: narrator
          kk: Қасымның бұл ісіне Шайбанидің тарихшылары да таңданып жазды. Ал сарбаздар сол күні ханға емес, Қасымға қарады.
          ru: Этому поступку Касыма удивлялись даже историки Шайбани. А воины в тот день смотрели не на хана, а на Касыма.
  - id: sc080
    art: art_s1e02_080
    layer: history
    covers: [ "f.4.2.g" ]
    title: { kk: "Шаң басқан жүрек", ru: "Сердца в пыли" }
    beats:
      - say:
          who: narrator
          kk: 1509 жыл. Шайбани енді Мәуереннахрдың әміршісі. Оның сарайында парсы тарихшысы Ибн Рузбихан болды.
          ru: 1509 год. Шайбани теперь владыка Мавераннахра. При его дворе жил персидский историк Ибн Рузбихан.
      - say:
          who: narrator
          kk: Бір күні Рузбихан Махмұд сұлтанның ұлы, жас Ұбайдоллаға сұрақ қойды. Сол Махмұд — Сауранда Қасым босатқан тұтқын.
          ru: Однажды Рузбихан задал вопрос юному Убайдулле, сыну Махмуд-султана — того самого пленника, которого отпустил Касым.
      - say:
          who: ruzbihan
          kk: Сұлтаным, қазақтар — сіздердің қандас туыстарыңыз. Тегі бір, тілі бір, ата-бабасы — Жошы. Сонда бұл соғыс не үшін?
          ru: Султан, казахи — ваша кровная родня. Род один, язык один, предок — Джучи. Так зачем эта война?
      - say:
          who: ubaidulla
          kk: Әкемді олар бір кезде аман қайтарды. Мен оны білемін.
          ru: Когда-то они вернули моего отца живым. Я это знаю.
      - say:
          who: ubaidulla
          kk: Бір кезде туыс болғанымыз рас. Бірақ соғыстар жүрегіміздегі сүйіспеншілікті шаңмен көміп тастады.
          ru: Да, когда-то мы были родня. Но войны засыпали пылью любовь в наших сердцах.
      - say:
          who: ruzbihan
          kk: Шаңмен... Жақсы айтылды. Ащы шындық. Мұны жазып қоямын.
          ru: Пылью… Хорошо сказано. Горькая правда. Я это запишу.
      - say:
          who: narrator
          kk: Рузбихан жазып қалдырған осы сөздер бүгінге жетті. Ол Қасым туралы да жоғары пікір қалдырды.
          ru: Записанные Рузбиханом слова дошли до наших дней. О Касыме он тоже отзывался с большим уважением.
  - id: sc090
    art: art_s1e02_090
    layer: history
    covers: [ "f.4.2.f" ]
    title: { kk: "Ұлытаудағы күл", ru: "Пепел Улытау" }
    beats:
      - say:
          who: narrator
          kk: 1509–1510 жылдары Шайбани Керей мен Жәнібектің мұрагерлеріне қарсы бірнеше рет жорық жасады.
          ru: В 1509–1510 годах Шайбани несколько раз ходил походами на наследников Керея и Жанибека.
      - say:
          who: narrator
          kk: Бір жорықта ол Ұлытаудағы Қасымның ордасын тонады. Ордадан тек күл қалды.
          ru: В одном из походов он разграбил ставку Касыма в Улытау. От ставки остался только пепел.
      - say:
          who: dana
          kk: Сұлтан! Жылқыларды тауға айдап үлгердік. Балалар мен қарттар — аман.
          ru: Султан! Табуны успели угнать в горы. Дети и старики живы.
      - say:
          who: qasym
          kk: Дана... сен бе? Сығанақтағы мұнарада шамшырақ бұлғаған қыз сен бе едің?
          ru: Дана… это ты? Та девушка со светильником на башне Сыгнака — это была ты?
      - say:
          who: dana
          kk: Мен едім. Ол кезде он алтыда едім. Енді садақты өзім тартамын.
          ru: Я. Мне тогда было шестнадцать. Теперь я сама натягиваю лук.
      - say:
          who: qasym
          kk: Ел аман болса — бәрі аман. Шаңырақты қайта көтереміз.
          ru: Люди живы — значит, живо всё. Шанырак поднимем снова.
      - say:
          who: qasym
          kk: Ауылдарға хабар жібер. Атқа қонатын кім бар — бәрі жиналсын. Бұл жолы Шайбаниді өзі таңдаған жерде емес, біз таңдаған жерде күтеміз.
          ru: Разошли вести по аулам. Все, кто может сесть в седло, — собирайтесь. На этот раз будем ждать Шайбани не там, где выберет он, а там, где выберем мы.
  - id: sc095
    art: art_s1e02_095
    layer: personal
    covers: []
    title: { kk: "Ұлытаудағы жасақ", ru: "Отряд под Улытау" }
    beats:
      - say:
          who: narrator
          kk: Ұлытау, 1509. Шайбани Қасымның ордасын өртеді. Қасым ел жинап жатыр.
          ru: Улытау, 1509. Шайбани сжёг ставку Касыма. Касым собирает людей.
      - say:
          who: beket
          kk: Сені бірден таныдым — бетіңдегі тыртықтан. Сығанақта мені ат үстінен жұлып алған — сенің қолың. Енді менің кезегім. Қайда барсаң — мен де сонда.
          ru: Узнал сразу — по шраму. В Сыгнаке это твои руки сдёрнули меня с коня. Теперь мой черёд. Куда ты — туда и я.
          when: saved_beket && !named_temir
      - say:
          who: beket
          kk: Сені тыртығыңнан таныдым. Әкемді сен ханға атадың — ол шетте қайтыс болды. Бірақ мені ат үстінен сен жұлып алғансың. Қарыз — қарыз. Қайда барсаң — мен де сонда.
          ru: Узнал тебя по шраму. Это твоё слово отправило моего отца в изгнание — он умер на чужбине. Но и с коня меня сдёрнули твои руки. Долг есть долг. Куда ты — туда и я.
          when: saved_beket && named_temir
      - say:
          who: dana
          kk: Сол түнгі дабылды ел әлі айтады. Жүз отбасы сенің арқаңда тірі қалды.
          ru: Про тот ночной набат до сих пор говорят. Сто семей живы благодаря тебе.
          when: raised_alarm
      - say:
          who: dana
          kk: Сейіт Бұхараға кетті деседі. Шайбанидің қасында жүр екен. Абайла.
          ru: Говорят, Сейит ушёл в Бухару. Теперь при Шайбани. Берегись.
          when: named_seiit && seiit_book
      - say:
          who: dana
          kk: Сейіт әлі Сығанақта, бұрынғыдан да бай. Ал сенің үйірің — ханның қазынасында. Шындықты дәлелсіз айту қымбатқа түседі.
          ru: Сейит всё ещё в Сыгнаке, богаче прежнего. А твой табун — в ханской казне. Правда без доказательств обходится дорого.
          when: named_seiit && !seiit_book
      - say:
          who: dana
          kk: Сейіт сені ұмытпаған. «Бұл әлі бітпеді» деп жүр дейді.
          ru: "Сейит тебя не забыл. Говорят, всё повторяет: «Это ещё не конец»."
          when: seiit_enemy
      - say:
          who: dana
          kk: Темір ұлымен Шайбаниге кетті деседі. Ұлы бүгін оның жасағында.
          ru: Говорят, Темир с сыном ушли к Шайбани. Сын теперь в его войске.
          when: named_temir && !saved_beket
      - say:
          who: dana
          kk: Қасымға мерген керек. Ал жылқысыз мерген — мерген емес. Сенде екеуі де бар. Таңда.
          ru: Касыму нужны лучники. А лучник без коня — не лучник. У тебя есть и то и другое. Выбирай.
          when: "!named_seiit"
      - say:
          who: dana
          kk: Қасымға мерген керек. Ал жылқысыз мерген — мерген емес. Сенде екеуі де бар. Таңда.
          ru: Касыму нужны лучники. А лучник без коня — не лучник. У тебя есть и то и другое. Выбирай.
          when: named_seiit && seiit_book
      - say:
          who: dana
          kk: "Қасымға мерген керек. Үйірің қазынада қалды ғой — менің екі атымның бірін ал. Таңда: алдыңғы қатар ма, әлде жылқы бағу ма?"
          ru: "Касыму нужны лучники. Твой табун ведь в казне — возьми одного из двух моих коней. Выбирай: первый ряд или пасти коней?"
          when: named_seiit && !seiit_book
      - choice:
          prompt: { kk: "Қалай қосыласың?", ru: "Как вступишь?" }
          options:
            - id: archer
              kk: Алдыңғы қатарда — мерген болып
              ru: В первый ряд — лучником
              reply:
                kk: Садақ — қолда. Сығанақ түбінде алдыңғы қатарда тұрамын.
                ru: Лук в руках. Под Сыгнаком — в первом ряду.
                emotion: joy
              set: { courage: 1, role_archer: 1 }
              goto: sc100
            - id: herder
              kk: Артта — бүкіл жасақтың жылқысын бағып
              ru: В тылу — пасти коней всего отряда
              reply:
                kk: Мың жылқы. Әр сарбазға — екі ат. Шайқаста ат ауыстыра алатын әскер жеңеді.
                ru: Тысяча коней. На каждого воина — по два. В бою побеждает тот, кто может сменить коня.
                emotion: calm
              set: { practical: 1, role_herder: 1 }
              goto: sc100
  - id: sc100
    art: art_s1e02_100
    layer: history
    covers: [ "f.4.2.f" ]
    title: { kk: "Сығанақ түбінде, 1510", ru: "Под Сыгнаком, 1510" }
    beats:
      - say:
          who: narrator
          kk: 1510 жылдың басы. Шайбани тағы да Сығанаққа келді. Бұл оның қазақтарға қарсы соңғы жорығы еді.
          ru: Начало 1510 года. Шайбани снова пришёл к Сыгнаку. Это был его последний поход против казахов.
      - say:
          who: qasym
          kk: Қырық жылға жуық бұрын біз Бұрындықпен бірге бұл қаланы осы адамнан қайтарып алғанбыз. Бүгін тағы да біздің кезек.
          ru: Почти сорок лет назад мы с Бурундуком отбили этот город у этого человека. Сегодня — снова наш черёд.
      - say:
          who: qasym
          kk: Орталық — шегінеді. Қанаттар — күтеді. Жау ортаға кірген кезде екі жақтан орап аламыз.
          ru: Центр — отступает. Крылья — ждут. Когда враг войдёт в середину, охватим его с двух сторон.
      - say:
          who: dana
          kk: Олардың сауыты ауыр, біздің аттарымыз жеңіл. Далада жеңіс саннан емес — шапшаңдықтан.
          ru: У них тяжёлые доспехи, у нас лёгкие кони. В степи побеждает не число — быстрота.
      - say:
          who: qasym
          kk: Аттан!
          ru: Вперёд!
      - say:
          who: narrator
          kk: Қазақтар жауды орталықта ұстап, қанаттарымен орап алды. Шайбанидің туы құлады.
          ru: Казахи сдержали врага в центре и охватили его крыльями. Знамя Шайбани упало.
      - say:
          who: narrator
          kk: 1510 жылдың басында Сығанақ түбінде Шайбаниді Қасым сұлтанның әскері жеңді. Осыдан кейін Шайбани қазақ даласына қайтып оралмады.
          ru: В начале 1510 года под Сыгнаком войско султана Касыма разбило Шайбани. После этого Шайбани в казахскую степь больше не возвращался.
    quiz: [ "q_s1e02_007", "q_s1e02_008" ]
  - id: sc110
    art: art_s1e02_110
    layer: history
    covers: [ "f.4.2.f" ]
    title: { kk: "Мерв, 1510", ru: "Мерв, 1510" }
    beats:
      - say:
          who: narrator
          kk: Сығанақтағы жеңілістен кейін Шайбани оңтүстікке бұрылып, Иран шахы Исмаилмен соғысқа кірісті.
          ru: После поражения под Сыгнаком Шайбани повернул на юг и ввязался в войну с иранским шахом Исмаилом.
      - say:
          who: narrator
          kk: 1510 жылдың күзінде Мерв түбінде оның әскері жеңілді. Мұхаммед Шайбанидің өзі қаза тапты.
          ru: Осенью 1510 года под Мервом его войско было разбито. Сам Мухаммед Шайбани погиб.
      - say:
          who: narrator
          kk: "Ол құрған мемлекет екіге бөлінді: бірі — орталығы Бұхарадағы Бұхар хандығы, екіншісі — Хиуа хандығы."
          ru: "Созданная им держава раскололась надвое: одно ханство с центром в Бухаре, другое — со ставкой в Хиве."
      - say:
          who: dana
          kk: Қырық жыл бойы бізге қақпа қаққан адам... енді жоқ.
          ru: Человек, который сорок лет стучался в наши ворота… его больше нет.
      - say:
          who: narrator
          kk: Мерв апатынан кейін Қазақ хандығын нығайтуға жағдай туды. Далада енді Қасымға тең келер ешкім қалмады.
          ru: После мервской катастрофы у Казахского ханства появилась возможность окрепнуть. В степи не осталось никого, кто мог бы сравниться с Касымом.
    quiz: [ "q_s1e02_009" ]
  - id: sc120
    art: art_s1e02_120
    layer: history
    covers: [ "f.4.2.a" ]
    title: { kk: "Самарқанға жол", ru: "Дорога на Самарканд" }
    beats:
      - say:
          who: narrator
          kk: Хан — Бұрындық еді. Бірақ Мұхаммед Хайдар жазғандай, Қасымның беделі мен әскердегі ықпалы соншалық, билік оның қолында болды.
          ru: Ханом был Бурундук. Но, как писал Мухаммед Хайдар, авторитет Касыма и его влияние в войске были так велики, что вся власть была у него.
      - say:
          who: narrator
          kk: "Қасым Бұрындықтан алыс жүретін: жақын жүріп құрмет көрсетпесе — ханға қарсы шыққандық болар еді, ал оған бағынуға көңілі жоқ еді."
          ru: "Касым держался от хана подальше: быть рядом и не оказывать почтения значило бы перечить хану, а повиноваться ему душа не лежала."
      - say:
          who: qasym
          kk: Хан ием. Самарқанға дейін менің адамдарым шығарып салады.
          ru: Повелитель. До Самарканда вас проводят мои люди.
      - say:
          who: burundyq
          kk: «Хан ием» дейсің... Әлі де айтасың.
          ru: «Повелитель», говоришь… Всё ещё говоришь.
      - say:
          who: qasym
          kk: Сіз — Керейдің ұлысыз. Сіз ел үшін отыз жыл қан төктіңіз.
          ru: Вы — сын Керея. Вы тридцать лет проливали кровь за народ.
      - say:
          who: burundyq
          kk: Ал сен елдің жүрегін алдың. Қылышпен емес. Сауранда... бір тұтқынмен.
          ru: А ты взял сердце народа. Не саблей. В Сауране… одним пленником.
      - say:
          who: burundyq
          kk: Қызым Самарқанда тұрады. Соған барамын. Шаршадым. Жақсы баста, Қасым.
          ru: Моя дочь живёт в Самарканде. К ней и поеду. Устал. Начни хорошо, Касым.
      - say:
          who: narrator
          kk: Шамамен 1511 жылы Бұрындық жақындарымен Самарқанға кетті. Қасым оны құрметпен шығарып салды — сондықтан хандықта алауыздық болмады.
          ru: Около 1511 года Бурундук с приближёнными уехал в Самарканд. Касым проводил его с почестями — поэтому до междоусобицы не дошло.
    quiz: [ "q_s1e02_003" ]
  - id: sc130
    art: art_s1e02_130
    layer: history
    covers: [ "f.4.2.b" ]
    title: { kk: "Ақ киіз", ru: "Белая кошма" }
    beats:
      - say:
          who: narrator
          kk: Бұрындық кеткен соң Қасымды ақ киізге көтеріп, хан етті. Ол Жәнібектің ұлы еді.
          ru: После отъезда Бурундука Касыма подняли на белой кошме ханом. Он был сыном Жанибека.
      - say:
          who: dana
          kk: Он алты жасымда қақпа ашылғанын көрдім. Енді, міне, қартайғанда хан көтеріп тұрмын.
          ru: В шестнадцать я видела, как открылись ворота. А теперь, на старости лет, поднимаю хана.
      - say:
          who: qasym
          kk: Ұстаңдар мықтап. Бұл киізді бір кісі емес — бүкіл ел көтереді.
          ru: Держите крепче. Эту кошму поднимает не один человек — весь народ.
      - say:
          who: narrator
          kk: "Мұхаммед Хайдар жазды: Қасым бүкіл Дешті Қыпшақтың толық әміршісі болды. Жошы ханнан кейін мұндай атаққа, мұндай қуатқа ешкім ие болмаған."
          ru: "Мухаммед Хайдар писал: Касым стал полным властелином всего Дешт-и-Кыпчака. После Джучи-хана никто не имел такой известности и такого могущества."
    quiz: [ "q_s1e02_012" ]
