episode: s1e01
title: { kk: "Шу бойында", ru: "На берегу Шу", en: "On the Banks of the Chu" }
topics: [ kz.4.1 ]
era: "1457–1468"
approved_by: null        # виза историка. Без неё серия не публикуется.

characters:
  - id: narrator
    name: { kk: "Баяншы", ru: "Рассказчик" }
    fiction: false
  - id: aidar
    name: { kk: "Айдар", ru: "Айдар" }
    fiction: true
    note: "Юный табунщик, глаза игрока. Не знает будущего, не влияет на реальные события."
  - id: aksakal
    name: { kk: "Ақсақал", ru: "Аксакал" }
    fiction: true
    note: "Старейшина рода Айдара. Голос опыта, объясняет контекст."
  - id: kerei
    name: { kk: "Керей сұлтан", ru: "Керей-султан" }
    fiction: false
  - id: zhanibek
    name: { kk: "Жәнібек сұлтан", ru: "Жанибек-султан" }
    fiction: false

scenes:

  # ---------------------------------------------------------------- 1457
  - id: sc010
    art: art_s1e01_010
    covers: [ f.4.1.f, f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "1457 жыл. Сығанақ түбі. Әбілқайыр ханның әскері ойраттардан ауыр жеңіліс тапты."
          ru: "1457 год. Под Сыгнаком. Войско Абулхайр-хана разбито ойратами."
      - say:
          who: aidar
          kk: "Ата, жылқыны кім айдап кетті? Далада ешкім қалмады."
          ru: "Ата, кто угнал табун? В степи никого не осталось."
      - say:
          who: aksakal
          kk: "Ойраттар. Хан жеңілді, ел қорғансыз қалды."
          ru: "Ойраты. Хан разбит, народ остался без защиты."
      - say:
          who: narrator
          kk: "Әбілқайыр Дешті Қыпшақты темір қолмен биледі. Жеңілістен кейін қысымы күшейе түсті — сұлтандар шығар жол іздей бастады."
          ru: "Абулхайр правил Дешт-и-Кипчаком железной рукой. После поражения его хватка стала ещё жёстче — и султаны начали искать выход."
      - choice:
          prompt: { kk: "Айдар не істейді?", ru: "Что делать Айдару?" }
          options:
            - id: stay
              kk: "Руымен бірге қалады"
              ru: "Остаться с родом"
              set: { caution: 1 }
              goto: sc020
            - id: seek
              kk: "Керей мен Жәнібек сұлтандарды іздеп барады"
              ru: "Идти искать султанов Керея и Жанибека"
              set: { courage: 1 }
              goto: sc020
    quiz: [ q_s1e01_001, q_s1e01_002, q_s1e01_011 ]

  # ---------------------------------------------------------------- совет
  - id: sc020
    art: art_s1e01_020
    covers: [ f.4.1.b ]
    beats:
      - say:
          who: narrator
          kk: "Керей мен Жәнібек — Орыс хан ұрпағы, Жошы әулетінің сұлтандары. Билікке құқығы Әбілқайырдан кем емес еді."
          ru: "Керей и Жанибек — султаны из рода Урус-хана, потомки Жошы. Их право на власть было не меньше, чем у Абулхайра."
      - say:
          who: zhanibek
          kk: "Біз қашпаймыз. Елді өмір сүретін жерге апарамыз."
          ru: "Мы не бежим. Мы уводим народ туда, где он будет жить."
      - say:
          who: kerei
          kk: "Есен-Бұға бізді Моғолстанға шақырып жүр. Оған одақтас керек — бізге жер керек."
          ru: "Есен-Буга давно зовёт нас в Могулистан. Ему нужны союзники — нам нужна земля."
      - choice:
          prompt: { kk: "Айдар не дейді?", ru: "Что скажет Айдар?" }
          options:
            - id: loyal
              kk: "Менің руым сіздермен бірге жүреді"
              ru: "Мой род пойдёт с вами"
              set: { loyalty: 2 }
              goto: sc030
            - id: doubt
              kk: "Әбілқайыр қуып жетсе қайтеміз?"
              ru: "А если Абулхайр догонит?"
              set: { caution: 1 }
              goto: sc030
    quiz: [ q_s1e01_003, q_s1e01_004 ]

  # ---------------------------------------------------------------- 1465
  - id: sc030
    art: art_s1e01_030
    covers: [ f.4.1.a, f.4.1.c, f.4.1.d ]
    beats:
      - say:
          who: narrator
          kk: "1465 жыл. Ұзақ жолдан кейін көш Батыс Жетісуға — Шу мен Қозыбасы алқабына жетті."
          ru: "1465 год. После долгого пути кочевье дошло до Западного Жетысу — до долин Шу и Козыбасы."
      - say:
          who: narrator
          kk: "Моғолстан ханы Есен-Бұға сұлтандарды қабылдап, осы жерлерді берді. Оған батыс шекарада қалқан керек еді."
          ru: "Есен-Буга, хан Могулистана, принял султанов и отдал им эти земли. Ему нужен был щит на западной границе."
      - say:
          who: zhanibek
          kk: "Осы жерде тұрақтаймыз. Хандық осы жерден басталады."
          ru: "Здесь мы и встанем. Отсюда начнётся ханство."
      - say:
          who: narrator
          kk: "Тарихшылар осы жылды — 1465 жылды — Қазақ хандығының құрылған жылы деп санайды."
          ru: "Этот год — 1465-й — историки считают годом образования Казахского ханства."
      - choice:
          prompt: { kk: "Айдар киіз үйді қайда тігеді?", ru: "Айдар первым ставит юрту. Где?" }
          options:
            - id: river
              kk: "Өзен жағасына"
              ru: "У реки"
              set: { practical: 1 }
              goto: sc040
            - id: hill
              kk: "Дала көрінетін төбеге"
              ru: "На холме, откуда видна степь"
              set: { vigilant: 1 }
              goto: sc040
    quiz: [ q_s1e01_005, q_s1e01_006, q_s1e01_007, q_s1e01_012 ]

  # ---------------------------------------------------------------- 1468
  - id: sc040
    art: art_s1e01_040
    covers: [ f.4.1.i, f.4.1.g, f.4.1.h ]
    beats:
      - say:
          who: narrator
          kk: "Кеткендерді «қазақ» деп атады — ерікті, бөлініп шыққан адамдар. Әуелі өзбек-қазақ, кейін жай қазақ."
          ru: "Тех, кто ушёл, стали называть «казаками» — вольными, отделившимися людьми. Сначала узбек-казаками, потом просто казаками."
      - say:
          who: narrator
          kk: "1468 жылы Әбілқайыр Керей мен Жәнібекке қарсы жорыққа шықты — және жолда қайтыс болды. Мемлекеті ыдырап, рулар Жетісуға ағылды."
          ru: "В 1468 году Абулхайр выступил в поход против Керея и Жанибека — и умер в пути. Его государство распалось, роды потянулись в Жетысу."
      - say:
          who: aksakal
          kk: "Көрдің бе, Айдар. Ел өзі таңдады. Ханды қылыш емес, халық жасайды."
          ru: "Видишь, Айдар. Народ выбрал сам. Хана делает не сабля — народ."
      - say:
          who: narrator
          kk: "Бұл оқиғалар туралы біз ең алдымен XVI ғасырда жазылған «Тарих-и Рашиди» — Мұхаммед Хайдар Дулатидың еңбегі арқылы білеміз."
          ru: "Об этих событиях мы знаем прежде всего из «Тарих-и Рашиди» — труда Мухаммада Хайдара Дулати, написанного в XVI веке."
    quiz: [ q_s1e01_008, q_s1e01_009, q_s1e01_010 ]

final_test:
  single: 10
  context: 10
  note: "Пока банк серии меньше 20 — компилятор собирает тест из всех доступных вопросов."
