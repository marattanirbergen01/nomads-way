episode: s1e01
title: { kk: "Шу бойында", ru: "На берегу Шу", en: "On the Banks of the Chu" }
topics: [ kz.4.1 ]
era: "1457–1468"
approved_by: null        # виза историка. Без неё серия не публикуется.

# Редакция 2 (по правкам от 07.09.2026):
#  · 4 сцены → 13. Пометки «%» из правки развёрнуты в отдельные сцены со своей иллюстрацией.
#  · Развилка в sc010 убрана — сцена идёт сплошным текстом, как и просили.
#  · Казахские строки вычитаны: аскери→әскері, женилди→жеңілді, халыктын наразылыгы→халықтың
#    наразылығы, Жанибек→Жәнібек, тұрақталамыз→тұрақтаймыз, Казах Хандагы→Қазақ хандығы.
#  · Русские строки приведены в соответствие с изменённым казахским.
#  · Имя аватара в репликах не звучит: обращение «қарағым», «балам».
# Поля `emotion` (у реплик аватара и у reply) и `reply` (у опций развилки) проставлены заранее:
# компилятор их пока пропускает, реализация за окном «Код» (docs/DECISIONS.md, 09.09 и 12.09).
# Значения emotion: calm | joy | alarm | resolve | sorrow — по именам файлов аватара.

characters:
  - id: narrator
    name: { kk: "Баяншы", ru: "Рассказчик" }
    fiction: false
  - id: aidar
    name: { kk: "Айдар", ru: "Айдар" }
    fiction: true
    note: "Аватар игрока: табунщик около 17 лет. Имя и внешность игрок меняет в профиле, поэтому в репликах его не называют по имени и не склоняют — обращение «қарағым», «балам», «жігітім». Не знает будущего, не влияет на реальные события."
  - id: aksakal
    name: { kk: "Ақсақал", ru: "Аксакал" }
    fiction: true
    note: "Старейшина рода. Голос опыта, объясняет контекст."
  - id: kerei
    name: { kk: "Керей сұлтан", ru: "Керей-султан" }
    fiction: false
  - id: zhanibek
    name: { kk: "Жәнібек сұлтан", ru: "Жанибек-султан" }
    fiction: false
  - id: abilqaiyr
    name: { kk: "Әбілқайыр хан", ru: "Абулхайр-хан" }
    fiction: false

scenes:

  # ---------------------------------------------------------------- 1457, Сыгнак
  - id: sc010
    art: art_s1e01_010
    layer: history
    covers: [ f.4.1.f, f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "1457 жыл. Сығанақ түбі."
          ru: "1457 год. Под Сыгнаком."
      - say:
          who: narrator
          kk: "Әбілқайыр ханның әскері ойраттардан ауыр жеңілді."
          ru: "Войско Абулхайр-хана тяжело разбито ойратами."
      - say:
          who: aidar
          kk: "Ата, жылқыны кім айдап бара жатыр? Далада тірі жан қалмапты!"
          ru: "Ата, кто это угоняет табун? В степи ни живой души!"
          emotion: alarm
      - say:
          who: aksakal
          kk: "Ойраттар, балам. Әбілқайыр ханның әскері жеңілді — ел қорғансыз қалды."
          ru: "Ойраты, дитя моё. Войско Абулхайр-хана разбито — народ остался без защиты."
      - say:
          who: narrator
          kk: "Әбілқайыр Дешті Қыпшақты темір қолмен биледі. Жеңілістен кейін халықтың наразылығы күшейе түсті — Жәнібек пен Керей сұлтандар шығар жол іздей бастады."
          ru: "Абулхайр правил Дешт-и-Кипчаком железной рукой. После поражения недовольство в народе усилилось — и султаны Жанибек и Керей начали искать выход."
    quiz: [ q_s1e01_001, q_s1e01_002, q_s1e01_013 ]

  # ---------------------------------------------------------------- ханские сборщики
  - id: sc012
    art: art_s1e01_012
    layer: personal          # личный слой: своя жизнь аватара, без фактов и вопросов
    covers: []
    beats:
      - say:
          who: narrator
          kk: "Шабуылдан кейін ауыл жылқысыз қалды. Көп ұзамай ханның салық жинайтын адамдары келді."
          ru: "После набега аул остался без коней. А вскоре приехали ханские сборщики."
      - say:
          who: aksakal
          kk: "Хан қорғай алмады, ал үлесін сұрайды. Жыл сайын осылай."
          ru: "Хан не защитил, а долю просит. И так каждый год."
      - say:
          who: aidar
          kk: "Сонда бізді кім қорғайды?"
          ru: "Тогда кто нас защитит?"
          emotion: alarm
      - choice:
          prompt: { kk: "Не істейсің?", ru: "Что ты сделаешь?" }
          options:
            - id: grumble
              kk: "Хан саясаты туралы күбірлеу"
              ru: "Проворчать про ханскую политику"
              reply:
                kk: "Жылқыны біз бақтық, ойрат айдап кетті, ал үлесін хан алуды ұмытпайды."
                ru: "Коней пасли мы, угнали ойраты, а хан не забывает взять свою долю."
                emotion: resolve
              set: { courage: 1 }
              goto: sc020
            - id: silent
              kk: "Үндемей, ақсақалды тыңдау"
              ru: "Промолчать и выслушать аксакала"
              reply:
                kk: "Үндемедім. Тек атамның ер-тұрманы ғана қалғанын ойладым."
                ru: "Я промолчал. Только подумал, что от деда осталось одно седло."
                emotion: calm
              set: { caution: 1 }
              goto: sc020

  # ---------------------------------------------------------------- совет султанов
  - id: sc020
    art: art_s1e01_020
    layer: history
    covers: [ f.4.1.b, f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "Сол күні сұлтандар кеңеске жиналды."
          ru: "В тот день султаны собрались на совет."
      - say:
          who: kerei
          kk: "Біз Орыс ханның ұрпағымыз, Жошы әулетінен. Билікке құқығымыз Әбілқайырдан кем емес."
          ru: "Мы потомки Урус-хана, из рода Жошы. Наше право на власть не меньше, чем у Абулхайра."
      - say:
          who: zhanibek
          kk: "Жеңілістен кейін ел ханға сенбейді. Сенбеген елді қылышпен ғана ұстап тұрасың."
          ru: "После поражения народ хану не верит. А неверящий народ удержишь только мечом."
      - say:
          who: kerei
          kk: "Кетсек, ол соңымыздан шығады. Дала кең, бірақ ол қашатын жер емес."
          ru: "Уйдём — он двинется следом. Степь широка, но это не место, где прячутся."
      - say:
          who: zhanibek
          kk: "Біз қашпаймыз. Елмен бірге тыныш өмір сүретін жерге барамыз."
          ru: "Мы не бежим. Мы уходим с народом туда, где будет спокойная жизнь."
      - say:
          who: kerei
          kk: "Есен-Бұға бізді Моғолстанға шақырып тұр. Жер сонда."
          ru: "Есен-Буга зовёт нас в Могулистан. Земля там."

  # ---------------------------------------------------------------- обращение к народу
  - id: sc022
    art: art_s1e01_022
    layer: history
    covers: [ f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "Кеңестен кейін сұлтандар халыққа шықты."
          ru: "После совета султаны вышли к народу."
      - say:
          who: kerei
          kk: "Ағайын! Біз Әбілқайырдың қол астынан кетеміз. Еркін жерге шақырамыз."
          ru: "Люди! Мы уходим из-под руки Абулхайра. Зовём вас на свободную землю."
      - say:
          who: zhanibek
          kk: "Кім қаламын десе — қалсын. Ешкімді күштемейміз."
          ru: "Кто захочет остаться, пусть остаётся. Никого не принуждаем."
      - say:
          who: narrator
          kk: "Сұлтандардың соңынан ерікті жұрт ерді: рулар өз еркімен көшке қосылды."
          ru: "За султанами пошли вольные люди: роды присоединялись к кочевью по своей воле."
    quiz: [ q_s1e01_003, q_s1e01_004, q_s1e01_011, q_s1e01_014, q_s1e01_016 ]

  # ---------------------------------------------------------------- сборы
  - id: sc023
    art: art_s1e01_023
    layer: personal
    covers: []
    beats:
      - say:
          who: narrator
          kk: "Ауыл киіз үйін жықты, жүкті түйеге артты."
          ru: "Аул разобрал юрты и навьючил поклажу на верблюдов."
      - say:
          who: aidar
          kk: "Ағайынның жартысы қалып жатыр. Біз дұрыс істеп жүрміз бе, ата?"
          ru: "Половина родичей остаётся. Мы правильно делаем, ата?"
          emotion: sorrow
      - say:
          who: aksakal
          kk: "Ата-бабаның моласы осында қалады, қарағым. Біз жерді емес, елді алып кетеміз."
          ru: "Могилы предков остаются здесь, дитя моё. Мы уводим не землю, а народ."
      - say:
          who: aksakal
          kk: "Дұрысын жол көрсетеді. Әзірге жүгіңді жи."
          ru: "Что правильно, покажет дорога. А пока собирай поклажу."
      - choice:
          prompt: { kk: "Жолға не аласың?", ru: "Что возьмёшь в дорогу?" }
          options:
            - id: saddle
              kk: "Атамның ер-тұрманын"
              ru: "Дедовское седло"
              reply:
                kk: "Ер-тұрманды арқалап алдым. Ауыр екен, бірақ атамның қолы тиген жалғыз зат."
                ru: "Взвалил седло на спину. Тяжёлое, но это единственное, чего касались руки деда."
                emotion: sorrow
              set: { practical: 1 }
              goto: sc025
            - id: help
              kk: "Ештеңе — көршінің жүгін тиеуге көмектесу"
              ru: "Ничего — помочь соседу навьючить поклажу"
              reply:
                kk: "Көршінің түйесін байлап бердім. Өз жүгім екі қолыма сыйып қалды."
                ru: "Помог соседу увязать верблюда. Своя поклажа уместилась в двух руках."
                emotion: calm
              set: { loyalty: 1 }
              goto: sc025

  # ---------------------------------------------------------------- зима в пути
  - id: sc025
    art: art_s1e01_025
    layer: personal
    covers: []
    beats:
      - say:
          who: narrator
          kk: "Көш оңтүстік-шығысқа қарай жылжыды. Жол ұзаққа созылды: бір қыс емес, бірнеше қыс."
          ru: "Кочевье двигалось на юго-восток. Путь растянулся: не одна зима, а несколько."
      - say:
          who: aidar
          kk: "Соңғы екі ат та қалмады, ата. Мен енді жаяу жылқышымын."
          ru: "Последних двух коней не стало, ата. Я теперь табунщик пешком."
          emotion: sorrow
      - say:
          who: aksakal
          kk: "Ат кетеді, ат келеді. Ал ерік бір кетсе, қайтпайды."
          ru: "Кони уходят, кони приходят. А воля, если уйдёт, не вернётся."
      - say:
          who: aidar
          kk: "Сол ерік үшін бізді «қазақ» дейді ме?"
          ru: "За эту волю нас и зовут «казахами»?"
          emotion: resolve
      - say:
          who: aksakal
          kk: "Иә. Қазақ — өз ханынан бөлініп, ерікті жүрген адам. Біз соны таңдадық."
          ru: "Да. Казах — человек, отделившийся от своего хана и живущий вольно. Мы это и выбрали."

  # ---------------------------------------------------------------- 1465, долина Шу
  - id: sc030
    art: art_s1e01_030
    layer: history
    covers: [ f.4.1.a, f.4.1.c, f.4.1.d ]
    beats:
      - say:
          who: narrator
          kk: "1465 жыл. Ұзақ жолдан кейін көш Батыс Жетісуға — Шу мен Қозыбасы алқабына жетті."
          ru: "1465 год. После долгого пути кочевье дошло до Западного Жетысу — до долин Шу и Козыбасы."
      - say:
          who: narrator
          kk: "Моғолстан ханы Есен-Бұға сұлтандарды қабылдап, Шу мен Қозыбасы алқабын берді. Оған батыс шекарада қорғаныс керек еді."
          ru: "Есен-Буга, хан Могулистана, принял султанов и отдал им долины Шу и Козыбасы. Ему нужна была защита на западной границе."
      - say:
          who: zhanibek
          kk: "Осы жерде тұрақтаймыз. Қазақ хандығы осы жерден басталады."
          ru: "Здесь мы и встанем. Отсюда начнётся Казахское ханство."
      - say:
          who: narrator
          kk: "Тарихшылар осы жылды — 1465 жылды — Қазақ хандығының құрылған жылы деп санайды."
          ru: "Этот год — 1465-й — историки считают годом образования Казахского ханства."
    quiz: [ q_s1e01_006, q_s1e01_012, q_s1e01_017, q_s1e01_020, q_s1e01_021 ]

  # ---------------------------------------------------------------- карта пути
  - id: sc031
    art: map_s1e01_route
    layer: history
    covers: [ f.4.1.c, f.4.1.j ]
    beats:
      - say:
          who: narrator
          kk: "Міне, өткен жол. Дешті Қыпшақтан — Сырдария бойынан — Батыс Жетісуға дейін."
          ru: "Вот пройденный путь. Из Дешт-и-Кипчака, с берегов Сырдарьи, в Западное Жетысу."
      - say:
          who: narrator
          kk: "Батыста қалғаны — Әбілқайырдың иелігі. Шығыста, тау бөктерінде — жаңа қоныс: Шу мен Қозыбасы."
          ru: "Позади, на западе, — владения Абулхайра. Впереди, в предгорьях, — новое кочевье: Шу и Козыбасы."
      - say:
          who: aksakal
          kk: "Мына жолды жаяу да, атпен де өттік, қарағым. Енді келдік."
          ru: "Этот путь мы прошли и пешком, и верхом, дорогой. Вот мы и пришли."
      - say:
          who: narrator
          kk: "Көш жылдан жылға өсті. Дулатидің дерегі бойынша, Керей мен Жәнібекке қосылғандардың саны 200 мыңға жетті."
          ru: "Кочевье росло год за годом. По данным Дулати, число присоединившихся к Керею и Жанибеку достигло двухсот тысяч человек."
    quiz: [ q_s1e01_019, q_s1e01_028, q_s1e01_029, q_s1e01_030 ]

  # ---------------------------------------------------------------- обустройство
  - id: sc032
    art: art_s1e01_032
    layer: personal
    covers: []
    beats:
      - say:
          who: narrator
          kk: "Кешке қарай алқапта киіз үйлер тігіліп жатты. Шу суы мол, жайылым шүйгін, тау бөктері жақын."
          ru: "К вечеру в долине ставили юрты. В Шу много воды, пастбища сочные, предгорья рядом."
      - say:
          who: aksakal
          kk: "Мына жер жақсы, қарағым. Су бар, шөп бар, тау қыстан қорғайды."
          ru: "Земля хорошая, дитя моё. Есть вода, есть трава, горы прикроют от зимы."
      - say:
          who: aidar
          kk: "Өзен жағасы — жылқыға жақсы. Көктемде табын жинаймын."
          ru: "Берег реки хорош для лошадей. Весной соберу табун."
          emotion: joy
      - say:
          who: aksakal
          kk: "Әуелі қысты шығып ал, қарағым."
          ru: "Сначала переживи зиму, дитя моё."
      - choice:
          prompt: { kk: "Киіз үйді қайда тігесің?", ru: "Где поставишь юрту?" }
          options:
            - id: river
              kk: "Өзен жағасына"
              ru: "У реки"
              reply:
                kk: "Өзен жағасына тіктім. Таңертең су да, шөп те қол астында."
                ru: "Поставил у реки. Утром и вода, и трава под рукой."
                emotion: calm
              set: { practical: 1, yurt_river: 1 }
              art: art_s1e01_032_river
              goto: sc038
            - id: hill
              kk: "Дала көрінетін төбеге"
              ru: "На холме, откуда видна степь"
              reply:
                kk: "Төбеге тіктім. Дала түгел көрінеді — кім келе жатса да, бірінші мен көремін."
                ru: "Поставил на холме. Степь видна вся: кто бы ни ехал, первым увижу я."
                emotion: calm
              set: { vigilant: 1, yurt_hill: 1 }
              art: art_s1e01_032_hill
              goto: sc038

  # ---------------------------------------------------------------- Абулхайр решает идти
  - id: sc038
    art: art_s1e01_038
    layer: history
    covers: [ f.4.1.g ]
    beats:
      - say:
          who: narrator
          kk: "Дешті Қыпшақ. Әбілқайырдың ордасы."
          ru: "Дешт-и-Кипчак. Ставка Абулхайра."
      - say:
          who: abilqaiyr
          kk: "Сұлтандар хандықтан кетті. Бір емес, көп. Олар — бүлікшілер."
          ru: "Султаны ушли из ханства. Не один, многие. Это мятежники."
      - say:
          who: abilqaiyr
          kk: "Керей мен Жәнібек біздің руларды алып кетті. Жыл сайын тағы кетіп жатыр. Бұл — менің билігіме қауіп."
          ru: "Керей и Жанибек увели наши роды. И с каждым годом уходят ещё. Это угроза моей власти."
      - say:
          who: abilqaiyr
          kk: "Кеткен ел қайтпаса — келесісі де кетеді. Олардың орнын көрсету керек."
          ru: "Если ушедшие не вернутся, уйдут и следующие. Надо поставить их на место."
      - say:
          who: narrator
          kk: "1468 жылы Әбілқайыр әскерін жинап, Жетісуға аттанды."
          ru: "В 1468 году Абулхайр собрал войско и выступил в Жетысу."
    quiz: [ q_s1e01_005, q_s1e01_007, q_s1e01_018, q_s1e01_024 ]

  # ---------------------------------------------------------------- 1468
  - id: sc040
    art: art_s1e01_040
    layer: history
    covers: [ f.4.1.g, f.4.1.i, f.4.1.h ]
    beats:
      - say:
          who: narrator
          kk: "Бірақ жорық аяқталмады: Әбілқайыр жолда қайтыс болды. Мемлекеті ыдырады."
          ru: "Но поход не был завершён: Абулхайр умер в пути. Его государство распалось."
      - say:
          who: aksakal
          kk: "Көрдіңдер ме. Ел өзі таңдады. Ханды қылыш емес, халық жасайды."
          ru: "Видите. Народ выбрал сам. Хана делает не меч — народ."
      - say:
          who: narrator
          kk: "Осы жылдардан бастап оларды бүкіл дала «қазақ» деп таныды — ерікті, бөлініп шыққан адамдар. Әуелі өзбек-қазақ, кейін жай қазақ."
          ru: "С этих лет вся степь знала их как «казахов» — вольных, отделившихся людей. Сначала узбек-казахами, потом просто казахами."
      - say:
          who: narrator
          kk: "Бұл оқиғалар туралы біз ең алдымен XVI ғасырда жазылған «Тарих-и Рашиди» — Мұхаммед Хайдар Дулатидың еңбегі арқылы білеміз."
          ru: "Об этих событиях мы знаем прежде всего из «Тарих-и Рашиди» — труда Мухаммада Хайдара Дулати, написанного в XVI веке."
    quiz: [ q_s1e01_008, q_s1e01_010, q_s1e01_023, q_s1e01_025, q_s1e01_027, q_s1e01_009, q_s1e01_022, q_s1e01_026 ]

  # ---------------------------------------------------------------- те, кто остался, приходят
  - id: sc042
    art: art_s1e01_042
    layer: history
    covers: [ f.4.1.g ]
    beats:
      - say:
          who: narrator
          kk: "Айлар бойы Дешті Қыпшақтан ауыл артынан ауыл көшіп келді."
          ru: "Месяцами из Дешт-и-Кипчака приходил аул за аулом."
      - say:
          who: zhanibek
          kk: "Бұлар — сол кезде қалғандар. Әбілқайырмен қалған рулар."
          ru: "Это те, кто тогда остался. Роды, что остались с Абулхайром."
      - say:
          who: kerei
          kk: "Ханы жоқ, ордасы жоқ. Енді олар да келді."
          ru: "Ни хана, ни ставки. Теперь пришли и они."
      - say:
          who: zhanibek
          kk: "Жер де, су да жетеді. Бауырларымыз."
          ru: "И земли, и воды хватит. Наши братья."
      - say:
          who: narrator
          kk: "Әбілқайырдың мемлекеті оның беделіне сүйенген еді — хан кетті, бірлік те кетті. Жас хандық адаммен де, жермен де толықты."
          ru: "Государство Абулхайра держалось на его авторитете: не стало хана, не стало и единства. Молодое ханство пополнилось и людьми, и землёй."

