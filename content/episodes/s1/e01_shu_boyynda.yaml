episode: s1e01
title: { kk: "Шу бойында", ru: "На берегу Шу", en: "On the Banks of the Chu" }
topics: [ kz.4.1 ]
era: "1457–1468"
approved_by: null        # виза историка. Без неё серия не публикуется.

# Редакция 2 (по правкам от 07.09.2026):
#  · 4 сцены → 13. Пометки «%» из правки развёрнуты в отдельные сцены со своей иллюстрацией.
#  · Развилка в sc010 убрана — сцена идёт сплошным текстом, как и просили.
#  · Казахские строки вычитаны: аскери→әскері, женилди→жеңілді, халыктын наразылыгы→халықтың
#    наразылығы, Жанибек→Жәнібек, тұрақталамыз→тұрақтаймыз, Казак Хандагы→Қазақ хандығы.
#  · Русские строки приведены в соответствие с изменённым казахским.
#  · Имя аватара в репликах не звучит: обращение «қарағым», «балам».
# Открытый вопрос историку: численность откочевавших (см. docs/DECISIONS.md).

characters:
  - id: narrator
    name: { kk: "Баяншы", ru: "Рассказчик" }
    fiction: false
  - id: aidar
    name: { kk: "Айдар", ru: "Айдар" }
    fiction: true
    note: "Аватар игрока: табунщик около 17 лет. Имя и внешность игрок меняет в профиле, поэтому в репликах его не называют по имени и не склоняют — обращение «қарағым», «балам», «жігітім». Не знает будущего, не влияет на реальные события."
  - id: aksakal
    name: { kk: "Ақсақал", ru: "Аксакал" }
    fiction: true
    note: "Старейшина рода. Голос опыта, объясняет контекст."
  - id: kerei
    name: { kk: "Керей сұлтан", ru: "Керей-султан" }
    fiction: false
  - id: zhanibek
    name: { kk: "Жәнібек сұлтан", ru: "Жанибек-султан" }
    fiction: false

scenes:

  # ---------------------------------------------------------------- 1457, Сыгнак
  - id: sc010
    art: art_s1e01_010
    covers: [ f.4.1.f, f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "1457 жыл. Сығанақ түбі."
          ru: "1457 год. Под Сыгнаком."
      - say:
          who: narrator
          kk: "Әбілқайыр ханның әскері ойраттардан ауыр жеңілді."
          ru: "Войско Абулхайр-хана тяжело разбито ойратами."
      - say:
          who: aidar
          kk: "Ата, жылқыны кім айдап бара жатыр? Далада тірі жан қалмапты!"
          ru: "Ата, кто это угоняет табун? В степи ни живой души!"
      - say:
          who: aksakal
          kk: "Ойраттар, балам. Әбілқайыр ханның әскері жеңілді — ел қорғансыз қалды."
          ru: "Ойраты, дитя моё. Войско Абулхайр-хана разбито — народ остался без защиты."
      - say:
          who: narrator
          kk: "Әбілқайыр Дешті Қыпшақты темір қолмен биледі. Жеңілістен кейін халықтың наразылығы күшейе түсті — Жәнібек пен Керей сұлтандар шығар жол іздей бастады."
          ru: "Абулхайр правил Дешт-и-Кипчаком железной рукой. После поражения недовольство в народе усилилось — и султаны Жанибек и Керей начали искать выход."
    quiz: [ q_s1e01_001, q_s1e01_002, q_s1e01_013, q_s1e01_015 ]

  # ---------------------------------------------------------------- ханские сборщики
  - id: sc012
    art: art_s1e01_012
    covers: [ f.4.1.f, f.4.1.e ]
    beats:
      - say:
          who: narrator
          kk: "Шабуылдан кейін ауыл жылқысыз қалды. Көп ұзамай ханның салық жинайтын адамдары келді."
          ru: "После набега аул остался без коней. А вскоре приехали ханские сборщики."
      - say:
          who: aksakal
          kk: "Хан қорғай алмады, ал үлесін сұрайды. Жыл сайын осылай."
          ru: "Хан не защитил, а долю просит. И так каждый год."
      - say:
          who: aidar
          kk: "Сонда бізді кім қорғайды?"
          ru: "Тогда кто нас защитит?"
      - say:
          who: narrator
          kk: "Дешті Қыпшақта наразылық өсті. Сұлтандар да, қарапайым ел де басқа жол іздей бастады."
          ru: "В Дешт-и-Кипчаке росло недовольство. И султаны, и простой народ начали искать другой путь."
      - choice:
          prompt: { kk: "Не істейсің?", ru: "Что ты сделаешь?" }
          options:
            - id: speak
              kk: "Ханның адамдарына қарсы сөз айту"
              ru: "Возразить ханским людям"
              set: { courage: 1 }
              goto: sc020
            - id: listen
              kk: "Үндемей, ақсақалды тыңдау"
              ru: "Промолчать и выслушать аксакала"
              set: { caution: 1 }
              goto: sc020
    quiz: [ q_s1e01_011, q_s1e01_014 ]

  # ---------------------------------------------------------------- совет султанов
  - id: sc020
    art: art_s1e01_020
    covers: [ f.4.1.b ]
    beats:
      - say:
          who: narrator
          kk: "Керей мен Жәнібек — Орыс хан ұрпағы, Жошы әулетінің сұлтандары. Билікке құқығы Әбілқайырдан кем емес еді."
          ru: "Керей и Жанибек — султаны из рода Урус-хана, потомки Жошы. Их право на власть было не меньше, чем у Абулхайра."
      - say:
          who: zhanibek
          kk: "Біз қашпаймыз. Елмен бірге тыныш өмір сүретін жерге барамыз."
          ru: "Мы не бежим. Мы уходим с народом туда, где будет спокойная жизнь."
      - say:
          who: kerei
          kk: "Есен-Бұға бізді Моғолстанға шақырып тұр. Оған одақтас керек — бізге жер керек."
          ru: "Есен-Буга зовёт нас в Могулистан. Ему нужны союзники — нам нужна земля."
      - choice:
          prompt: { kk: "Не дейсің?", ru: "Что ты скажешь?" }
          options:
            - id: loyal
              kk: "Менің руым сіздермен бірге"
              ru: "Мой род пойдёт с вами"
              set: { loyalty: 2 }
              goto: sc022
            - id: doubt
              kk: "Әбілқайыр қуып жетсе қайтеміз?"
              ru: "А если Абулхайр догонит?"
              set: { caution: 1 }
              goto: sc022
    quiz: [ q_s1e01_003, q_s1e01_004 ]

  # ---------------------------------------------------------------- обращение к народу и сборы
  - id: sc022
    art: art_s1e01_022
    covers: [ f.4.1.e, f.4.1.b ]
    beats:
      - say:
          who: kerei
          kk: "Ей, жұрт! Біз сендерді еркін жерге шақырамыз. Кім өз еркімен жүрсе — қосылсын."
          ru: "Люди! Мы зовём вас на свободную землю. Кто идёт по своей воле — присоединяйтесь."
      - say:
          who: narrator
          kk: "Сұлтандардың соңынан ерікті жұрт жиналды: рулар өз еркімен көшке қосылды."
          ru: "Вокруг султанов собрались вольные люди: роды присоединялись к кочевью по своей воле."
      - say:
          who: narrator
          kk: "Ауыл киіз үйлерін жықты, жүкті түйеге артты. Бір рулар қалды, бір рулар жолға шықты."
          ru: "Аул разобрал юрты и навьючил поклажу на верблюдов. Одни роды остались, другие вышли в путь."
      - say:
          who: aksakal
          kk: "Ата-бабаның моласы осында қалады, қарағым. Біз жерді емес, елді алып кетеміз."
          ru: "Могилы предков остаются здесь, дитя моё. Мы уводим не землю, а народ."
      - choice:
          prompt: { kk: "Жолға не аласың?", ru: "Что возьмёшь в дорогу?" }
          options:
            - id: saddle
              kk: "Атамның ер-тұрманын"
              ru: "Дедовское седло"
              set: { practical: 1 }
              goto: sc025
            - id: help
              kk: "Ештеңе — көршінің жүгін тиеуге көмектесу"
              ru: "Ничего — помочь соседу навьючить поклажу"
              set: { loyalty: 1 }
              goto: sc025
    quiz: [ q_s1e01_016 ]

  # ---------------------------------------------------------------- зима в пути
  - id: sc025
    art: art_s1e01_025
    covers: [ f.4.1.i ]
    beats:
      - say:
          who: narrator
          kk: "Көш оңтүстік-шығысқа қарай жылжыды. Жол ұзаққа созылды: жайлау мен қыстауды бірнеше рет ауыстырды."
          ru: "Кочевье двигалось на юго-восток. Путь растянулся надолго: летовки и зимовки сменяли друг друга."
      - say:
          who: aidar
          kk: "Ата, бізді неге «қазақ» деп атайды?"
          ru: "Ата, почему нас называют «казаками»?"
      - say:
          who: aksakal
          kk: "Қазақ — өз ханынан бөлініп, ерікті жүрген адам. Біз соны таңдадық."
          ru: "Казак — человек, отделившийся от своего хана и живущий вольно. Мы это и выбрали."
      - say:
          who: narrator
          kk: "Әуелі оларды өзбек-қазақ деп атады. Уақыт өте «өзбек» деген сөз түсіп қалып, «қазақ» халықтың атына айналды."
          ru: "Сначала их называли узбек-казаками. Со временем слово «узбек» отпало, и «казак» стало именем народа."
    quiz: [ q_s1e01_009, q_s1e01_022 ]

  # ---------------------------------------------------------------- 1465, долина Шу
  - id: sc030
    art: art_s1e01_030
    covers: [ f.4.1.a, f.4.1.c, f.4.1.d ]
    beats:
      - say:
          who: narrator
          kk: "1465 жыл. Ұзақ жолдан кейін көш Батыс Жетісуға — Шу мен Қозыбасы алқабына жетті."
          ru: "1465 год. После долгого пути кочевье дошло до Западного Жетысу — до долин Шу и Козыбасы."
      - say:
          who: narrator
          kk: "Моғолстан ханы Есен-Бұға сұлтандарды қабылдап, Шу мен Қозыбасы алқабын берді. Оған батыс шекарада қорғаныс керек еді."
          ru: "Есен-Буга, хан Могулистана, принял султанов и отдал им долины Шу и Козыбасы. Ему нужна была защита на западной границе."
      - say:
          who: zhanibek
          kk: "Осы жерде тұрақтаймыз. Қазақ хандығы осы жерден басталады."
          ru: "Здесь мы и встанем. Отсюда начнётся Казахское ханство."
      - say:
          who: narrator
          kk: "Тарихшылар осы жылды — 1465 жылды — Қазақ хандығының құрылған жылы деп санайды."
          ru: "Этот год — 1465-й — историки считают годом образования Казахского ханства."
      - choice:
          prompt: { kk: "Киіз үйді қайда тігесің?", ru: "Где поставишь юрту?" }
          options:
            - id: river
              kk: "Өзен жағасына"
              ru: "У реки"
              set: { practical: 1 }
              goto: sc031
            - id: hill
              kk: "Дала көрінетін төбеге"
              ru: "На холме, откуда видна степь"
              set: { vigilant: 1 }
              goto: sc031
    quiz: [ q_s1e01_006, q_s1e01_012, q_s1e01_017, q_s1e01_020, q_s1e01_021 ]

  # ---------------------------------------------------------------- карта пути
  - id: sc031
    art: map_s1e01_route
    covers: [ f.4.1.c, f.4.1.j ]
    beats:
      - say:
          who: narrator
          kk: "Міне, өткен жол. Дешті Қыпшақтан — Сырдария бойынан — Батыс Жетісуға дейін."
          ru: "Вот пройденный путь. Из Дешт-и-Кипчака, с берегов Сырдарьи, в Западное Жетысу."
      - say:
          who: narrator
          kk: "Батыста қалғаны — Әбілқайырдың иелігі. Шығыста, тау бөктерінде — жаңа қоныс: Шу мен Қозыбасы."
          ru: "Позади, на западе, — владения Абулхайра. Впереди, в предгорьях, — новое кочевье: Шу и Козыбасы."
      - say:
          who: aksakal
          kk: "Мына жолды жаяу да, атпен де өттік, қарағым. Енді ол біздің жол."
          ru: "Этот путь мы прошли и пешком, и верхом, дитя моё. Теперь он наш."
      - say:
          who: narrator
          kk: "Көш жылдан жылға өсті. Дулатидің дерегі бойынша, Керей мен Жәнібекке қосылғандардың саны 200 мыңға жетті."
          ru: "Кочевье росло год за годом. По данным Дулати, число присоединившихся к Керею и Жанибеку достигло двухсот тысяч человек."
    quiz: [ q_s1e01_019, q_s1e01_028, q_s1e01_029, q_s1e01_030 ]

  # ---------------------------------------------------------------- обустройство
  - id: sc032
    art: art_s1e01_032
    covers: [ f.4.1.c ]
    beats:
      - say:
          who: narrator
          kk: "Кешке қарай алқапта ондаған киіз үй тұрды. Шу суы мол, жайылым шүйгін, тау бөктері жақын."
          ru: "К вечеру в долине стояли десятки юрт. В Шу много воды, пастбища сочные, предгорья рядом."
      - say:
          who: aksakal
          kk: "Мына жер жақсы, қарағым. Су бар, шөп бар, тау қыстан қорғайды."
          ru: "Земля хорошая, дитя моё. Есть вода, есть трава, горы прикроют от зимы."
      - say:
          who: aidar
          kk: "Сонда біз енді қашпаймыз ба?"
          ru: "Значит, мы больше не бежим?"
      - say:
          who: aksakal
          kk: "Жоқ. Енді біз тұрамыз."
          ru: "Нет. Теперь мы стоим."
    quiz: [ q_s1e01_005 ]

  # ---------------------------------------------------------------- расчёт Есен-Буги
  - id: sc035
    art: art_s1e01_035
    covers: [ f.4.1.d ]
    beats:
      - say:
          who: narrator
          kk: "Көп ұзамай Моғолстан ханының елшісі келді. Есен-Бұға жаңа көршілерін көрмекші болды."
          ru: "Вскоре приехал посланец хана Могулистана. Есен-Буга хотел видеть новых соседей."
      - say:
          who: aidar
          kk: "Ол бізге жерді неге тегін берді?"
          ru: "Почему он отдал нам землю даром?"
      - say:
          who: kerei
          kk: "Тегін емес. Батыстан Әбілқайыр қысады, іште ағасы Жүніспен тақ таласы бар. Біз оның қалқанымыз."
          ru: "Не даром. С запада давит Абулхайр, внутри — спор за трон с братом Жунусом. Мы его щит."
      - say:
          who: narrator
          kk: "Бұл — саяси есеп, мейірімділік емес. Екі жақ та ұтты: Есен-Бұға шекарасын бекітті, сұлтандар жер алды."
          ru: "Это политический расчёт, а не милосердие. Выиграли обе стороны: Есен-Буга укрепил границу, султаны получили землю."
    quiz: [ q_s1e01_007, q_s1e01_018 ]

  # ---------------------------------------------------------------- почему Абулхайр пошёл в поход
  - id: sc038
    art: art_s1e01_038
    covers: [ f.4.1.g ]
    beats:
      - say:
          who: narrator
          kk: "Жетісудағы жаңа хандық күшейген сайын, Әбілқайыр оны елемей отыра алмады."
          ru: "Чем сильнее становилось новое ханство в Жетысу, тем меньше Абулхайр мог его не замечать."
      - say:
          who: narrator
          kk: "Одан рулар үздіксіз көшіп кетіп жатты. Кеткендерді қайтармаса, мемлекеті ішінен босайтын еді."
          ru: "От него непрерывно откочёвывали роды. Не вернув ушедших, он терял государство изнутри."
      - say:
          who: aksakal
          kk: "Хан бізді жазалауға шығады, балам. Кеткенді кешірмейді."
          ru: "Хан выйдет нас наказать, дитя моё. Ушедших не прощают."
      - say:
          who: narrator
          kk: "1468 жылы Әбілқайыр әскерін жинап, Жетісуға аттанды."
          ru: "В 1468 году Абулхайр собрал войско и выступил в Жетысу."
    quiz: [ q_s1e01_024 ]

  # ---------------------------------------------------------------- 1468
  - id: sc040
    art: art_s1e01_040
    covers: [ f.4.1.g, f.4.1.i, f.4.1.h ]
    beats:
      - say:
          who: narrator
          kk: "Бірақ жорық аяқталмады: Әбілқайыр жолда қайтыс болды. Мемлекеті ыдырап, рулар Жетісуға аттанды."
          ru: "Но поход не был завершён: Абулхайр умер в пути. Его государство распалось, роды двинулись в Жетысу."
      - say:
          who: aksakal
          kk: "Көрдің бе, қарағым. Ел өзі таңдады. Ханды қылыш емес, халық жасайды."
          ru: "Видишь, дитя моё. Народ выбрал сам. Хана делает не сабля — народ."
      - say:
          who: narrator
          kk: "Осы жылдардан бастап оларды бүкіл дала «қазақ» деп таныды — ерікті, бөлініп шыққан адамдар. Әуелі өзбек-қазақ, кейін жай қазақ."
