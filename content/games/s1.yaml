# Мини-игры сезона 1 — ЭКСПЕРИМЕНТ (ветка experiment/minigames), в основную версию не входит.
# Формат — docs/TZ_minigames.md. Игра идёт после реплик сцены, до её вопросов; исход ставит переменные сюжета.
# Тексты и источники — черновик окна «Код»: «Контенту» вычитать, историку проверить.
s1e01:
  sc031:
    - id: route_shu
      kind: route
      source: tb06_ru#§карта «Казахское ханство XV–XVII вв.»
      title: { kk: "Көш жолы", ru: "Путь кочевья" }
      prompt:
        kk: Көшті Сығанақтан Шу бойына апар. Жол — 12 күннен аспасын. Әбілқайырдың барлауынан аулақ бол.
        ru: Проведи кочевье от Сыгнака к Шу. Дорога — не дольше 12 дней. Держись подальше от разведки Абулхаира.
      art: map_s1e01_route_game   # «чистая» карта без маршрута (сдача «Анимации» 2026-10-23)
      view: [0.18, 0.22, 0.86, 0.60]   # увеличенный участок карты с маршрутом
      start: syganaq
      goal: shu
      days_limit: 12
      nodes:   # label_at — где подпись: below (по умолчанию) | above | left | right; разведены, чтобы не накладывались
        - { id: syganaq, x: 0.32,  y: 0.39,  label: { kk: Сығанақ, ru: Сыгнак } }
        - { id: steppe,  x: 0.47,  y: 0.31,  kind: enemy, label_at: above, label: { kk: Әбілқайыр барлауы, ru: Разведка Абулхаира } }
        - { id: karatau, x: 0.45,  y: 0.47,  kind: hill,  label_at: left,  label: { kk: Қаратау, ru: Каратау } }
        - { id: sands,   x: 0.60,  y: 0.37,  label_at: left, label: { kk: Мойынқұм, ru: Мойынкум } }
        - { id: talas,   x: 0.58,  y: 0.45,  kind: river, label: { kk: Талас, ru: Талас } }
        - { id: shu,     x: 0.735, y: 0.418, label_at: above, label: { kk: Шу · Қозыбасы, ru: Шу · Козыбасы } }
      edges:
        - [syganaq, steppe, 3]
        - [steppe, shu, 4]
        - [syganaq, karatau, 4]
        - [karatau, talas, 3]
        - [talas, shu, 3]
        - [syganaq, sands, 7]   # в обход Каратау с севера, через пески Мойынкум — дольше
        - [sands, shu, 6]
      outcomes:
        win:     { set: { vigilant: 1 }, reply: { kk: "Уақытында жеттік. Мал аман, ел аман.", ru: "Дошли вовремя. Скот цел, люди целы." } }
        partial: { set: { caution: 1 },  reply: { kk: "Жол ұзақ болды, бірақ жеттік.", ru: "Дорога вышла долгой, но мы дошли." } }
        lose:    { set: { lost_herd: 1 }, reply: { kk: "Барлаушылар жылқының бір бөлігін айдап кетті...", ru: "Разведчики угнали часть табуна..." } }
s1e02:
  sc010:
    - id: bazaar_syganaq
      kind: trade
      source: tb06_ru#§Сыгнак — торговый город на Сырдарье
      title: { kk: "Сығанақ базары", ru: "Базар Сыгнака" }
      prompt:
        kk: Қолыңда он қой. Ауылға қысқа бидай, мата, жебе ұштары және тұз керек. Сейітпен саудалас.
        ru: У тебя десять овец. Аулу к зиме нужны пшеница, ткань, наконечники стрел и соль. Торгуйся с Сейитом.
      budget: 10
      currency: { kk: "қой", ru: "овец" }
      goods:
        - { id: wheat, price: 3, icon: good_wheat, label: { kk: "Бидай қабы", ru: "Мешок пшеницы" } }
        - { id: cloth, price: 2, icon: good_cloth, label: { kk: "Мата", ru: "Ткань" } }
        - { id: arrow, price: 2, icon: good_arrow, label: { kk: "Жебе ұштары", ru: "Наконечники стрел" } }
        - { id: salt,  price: 1, label: { kk: "Тұз", ru: "Соль" } }
        - { id: silk,  price: 4, label: { kk: "Жібек", ru: "Шёлк" } }
        - { id: pot,   price: 3, label: { kk: "Мыс қазан", ru: "Медный котёл" } }
      needs: { wheat: 1, cloth: 1, arrow: 1, salt: 2 }
      outcomes:
        win:     { set: { practical: 1 }, reply: { kk: "Бәрі түгел. Қыс бізді қорқытпайды.", ru: "Всё есть. Зима нам не страшна." } }
        partial: { set: {},               reply: { kk: "Бірдеңе жетпей қалды... Қыста сезіледі.", ru: "Чего-то не хватило... Зимой это скажется." } }
        lose:    { set: { hungry_winter: 1 }, reply: { kk: "Қойлар кетті, ауылға керегі жоқ.", ru: "Овцы ушли, а нужного аулу нет." } }
  sc100:
    - id: battle_syganaq_1510
      kind: tactics
      source: tb06_ru#§Касым-хан, разгром Шайбани под Сыгнаком 1510
      title: { kk: "Сығанақ түбі, 1510", ru: "Под Сыгнаком, 1510" }
      art: game_battle_syganaq_1510   # схема поля боя без войск (сдача «Анимации» 2026-10-23)
      prompt:
        kk: Шайбани орталыққа соғып келеді. Қасым ханға кеңес бер.
        ru: Шайбани бьёт в центр. Подскажи Касым-хану.
      units:
        - { label: { kk: "Шайбани", ru: "Шайбани" }, x: 0.50, y: 0.24, enemy: true }
        - { label: { kk: "Орталық", ru: "Центр" }, x: 0.50, y: 0.50 }
        - { label: { kk: "Сол қанат", ru: "Левое крыло" }, x: 0.22, y: 0.46 }
        - { label: { kk: "Оң қанат", ru: "Правое крыло" }, x: 0.78, y: 0.46 }
      moves:
        - id: envelop
          outcome: win
          label: { kk: "Орталық шегінсін, қанаттар қоршасын", ru: "Центр отходит, крылья охватывают" }
          arrows: [[0.50, 0.50, 0.50, 0.60], [0.22, 0.46, 0.40, 0.20], [0.78, 0.46, 0.60, 0.20]]
        - id: head_on
          outcome: lose
          label: { kk: "Бәрі бірге қарсы шабу", ru: "Все вместе в лоб" }
          arrows: [[0.50, 0.50, 0.50, 0.30], [0.22, 0.46, 0.45, 0.30], [0.78, 0.46, 0.55, 0.30]]
        - id: hold
          outcome: partial
          label: { kk: "Орнында тұрып, күту", ru: "Стоять и ждать" }
      outcomes:
        win:     { set: { vigilant: 1 }, reply: { kk: "Далада күш санда емес, жылдамдықта.", ru: "В степи сила не в числе, а в быстроте." } }
        partial: { set: {}, reply: { kk: "Тұрып қалдық — шайқас ұзаққа созылды.", ru: "Мы стояли — бой затянулся." } }
        lose:    { set: {}, reply: { kk: "Маңдайдан соғып, көп жігіт жоғалттық.", ru: "Ударили в лоб — и потеряли многих." } }
    - id: volley_syganaq
      kind: volley
      when: [{ var: role_archer, op: '>=', value: 1 }]
      source: tb06_ru#§Касым-хан, разгром Шайбани под Сыгнаком 1510
      title: { kk: "Жебе жаңбыры", ru: "Залп" }
      prompt:
        kk: Ерте атпа — жебе жетпейді. Шкала алтын белдеуге жеткенде ат.
        ru: Не стреляй рано — стрелы не долетят. Стреляй, когда шкала войдёт в золотую полосу.
      rounds: 3
      need: 2
      period_ms: 1500
      window: [0.85, 1.0]
      outcomes:
        win:     { set: { courage: 1 }, reply: { kk: "Сап бұзылды!", ru: "Строй сломан!" } }
        partial: { set: {}, reply: { kk: "Бір жебе тиді — аз болды.", ru: "Одна стрела попала — мало." } }
        lose:    { set: {}, reply: { kk: "Жебелер жетпей түсті, жау күлді.", ru: "Стрелы не долетели, враг смеётся." } }
