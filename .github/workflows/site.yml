# Автосборка сайта: любой push в main → контент + веб-версия → ветка gh-pages (GitHub Pages).
# Делает то же, что scripts/deploy_site.sh на Mac. Медиа берутся готовыми из content/media/*/out
# (pack_media.sh — только на Mac: нужен sips).
name: Сайт
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Зависимости
        run: |
          (cd tools && dart pub get)
          (cd app && flutter pub get)
      - name: Сборка сайта (контент + приложение)
        run: sh scripts/build_site.sh /nomads-way/
      - name: Публикация в gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
