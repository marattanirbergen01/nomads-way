name: nomads_way
description: История Казахстана как сюжетная игра с вопросами формата ЕНТ.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  crypto: ^3.0.5
  path: ^1.9.0
  video_player: ^2.14.1

# path_provider_foundation 2.6+ тянет objective_c, а тот собирает нативные ассеты
# и требует полного Xcode — без него ломается даже `flutter test` на macOS.
# Держим предыдущую линию: она делает то же самое и собирается без Xcode.
dependency_overrides:
  path_provider_foundation: '>=2.4.0 <2.6.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # assets/ — только интерфейс. Контент приходит бандлами (см. app/CLAUDE.md).
  # awards/ — ролики раскрытия наград (marketing/awards-motion, 720×1280, 60 fps): это анимация интерфейса.
  assets:
    - assets/awards/
    # toasts/ — дымка и звуки плашек после выбора (эталон «Анимации»: content/media/s1/app/toasts)
    - assets/toasts/
    # games/ — значки и звуки мини-игр (эксперимент; эталон «Анимации»: content/media/s1/app/games)
    - assets/games/
  fonts:
    - family: Golos
      fonts:
        - asset: assets/fonts/GolosText.ttf
